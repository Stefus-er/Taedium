l_english:
 SNA_elender_conflicts_title: "Elender Conflicts"
 SNA_elender_conflicts_desc: "The elenders have served us for many years and even though they were not always working for our interest, they were a useful asset nonetheless. Now they are increasingly disloyal and have to be either put down or appeased."
 TD_Elender_Conflicts: "Elender Conflicts"

 SNA_pearls_of_the_south_title: "Pearls of the South"
 SNA_pearls_of_the_south_desc: "Snaiwatz is not only dependent on our countless villages, but also great cities of Eniverian age. By securing interest of local urban elites we can bring prosperity to our entire state."
 Owns_Vizam_TT: "If §Y[625.GetName]§! is ours and has at least §Y20§! development:"
 Owns_Adrianburg_TT: "If §Y[566.GetName]§! is ours and has at least §Y20§! development:"
 TD_Adrianburg_Prosperity: "Adrianburg Prosperity"
 Upgrade_Habichtenberg_tt: "Upgrade the §YHabichtenberg§! great project if its level is lower than §Y2§!."

 SNA_mercenary_wars_title: "Mercenary Wars"
 SNA_mercenary_wars_desc: "A great disaster has struck Snaiwatz. Fellow brothers, who previously together fought against the Bohemian threat, now are skirmishing between themselves and rising Elender confederation. We must prepare for the worst - and be ready to unify Snaiwatz by force if necessary."
 Mercenary_Wars_First_Phase_TT: "The Mercenary Wars are in the first phase"
 Mercenary_Wars_Second_Phase_TT: "The Mercenary Wars are in the second phase"
 Mercenary_Wars_Concluded_TT: "The Mercenary Wars have already concluded"
 TD_Elender_Fervour: "Elender Fervour"
 TD_Pikemens_League_Unity: "Unity of Pikemen's League"
 TD_Remove_Modifier_On_Wars_End: "until the Mercenary Wars have concluded"

 SNA_expanding_the_townships_title: "New Town Chartering"
 SNA_expanding_the_townships_desc: "Despite the greatness of our ancient cities, they were often built on easily defensible terrain, often unsuitable for large settlements. To compete against our more developed neighbours, we have to continue urban development by chartering new towns and cities."
 TD_Township_Works: "Chartering Rights"
 TD_Random_Owned_15dev_Prov_Gets_3_Dev_tt: "A random §Y15§! development province will gain §G+1§! of each development type."
 TD_3_Random_Owned_10dev_provs_get_dev_cost_red_tt: "Three random §Y10§! development provinces will gain the following modifier:"

 SNA_expansion_of_grobhalde_title: "Gold of Grobhalde"
 SNA_expansion_of_grobhalde_desc: "The treasure deep beneath Grobhalde drove many to madness and many more to try to take it for themselves. Bohemians, Camarians, the Empire - all tried to secure their control over the mine, however it has always remained at least somewhat autonomous. Now we must protect it at all cost."
 TD_Has_rampart_8_manpower_dev_tt: "If Grobhalde has at least §Y8§! base manpower and §YRamparts§!"
 TD_Has_8_manpower_dev_tt: "If Grobhalde has at least §Y8§! base manpower and NO §YRamparts§!"
 TD_add_artillery: "Gain §Y2§! artillery units"

 SNA_reclaiming_grottingen_title: "Reclaiming Grottingen"
 SNA_reclaiming_grottingen_desc: "Grottingen was once a great border fortress of kingdom of Eniver, securing southern trade routes connecting Camaria with Silvestria. We have to retake it and restore it to its former glory."
 TD_Provinces_Owned_Directly_tt: "If we own the required provinces directly"
 TD_Provinces_Owned_By_Subject_tt: "If the provinces are owned by our subjects"