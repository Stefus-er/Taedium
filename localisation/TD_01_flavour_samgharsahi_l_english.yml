 samgharsahi.1.t: "Calaki Celebration"
 samgharsahi.1.desc: "Calaki Celebration is a cultural, traditional and religious festival of all smiths and ironworkers, where they compete with each other in their craft and offer their craft to their Patron Deity Ratisigha."
 samgharsahi.1.a: "Glory to Ratisigha!"
 TD_sam_calaki_celebrations: "Calaki Celebration"
 TD_sam_calaki_celebrations_prov: "Local Calaki Celebration"
 samgharsahi.2.t: "Joradaravalian Festivals"
 samgharsahi.2.desc: "Joradaravalian Festivals are borderline debaucherous, promoting cutthroat competition, egoism, and even dangerous, delusional view of the world. Only those who take patronage of Joradaravali, primarly Paredeshian Nobility, celebrate those festivals."
 samgharsahi.2.a: "Glory to Joradaravali!"'
 TD_sam_joradaravalian_festivals: "Support of Paredeshian Nobility"
 sam_joradaravalian_festivals: "Celebrated Joradaravalian Festivals"
 samgharsahi.3.t: "Zarkesurtan Enlightenment"
 samgharsahi.3.desc: "Our Priesthood has found a woman that they claim has been blessed by Zarkesurta herself. She has shown our court that she has knowledge nobody her age and status should possess, and our Priests press us to offer her a respectful place to not anger Zarkesurta herself."
 samgharsahi.3.a: "She will be a welcome addition at our court"
 TD_sam_zarkesurtan_enlightenment: "Zarkesurtan Enlightenment"
 samgharsahi.4: "Zarkesurtan Sacrifice"
 samgharsahi.4.desc: "Our benelovent ruler has been devout beliver of Lady Zarkesurta since birth, but despite that, has not been blessed with a worthy heir yet. Priests claim we should make a sacrifice to the Lady Zarkesurta herself to gain her favour."
 samgharsahi.4.a: "Anything for my children!"
 samgharsahi.4.b: "I think I can make this through by myself.."
 TD_sam_defied_zakresurta: "Defied Zarkesurta"
 samgharsahi.5.t: "Favour of Zarkesurta"
 samgharsahi.5.desc: "Our beloved [Root.Monarch.GetHerHim], a devout beliver of Zarkesurta, had a vision, where Zarkesurta has shown her.."
 samgharsahi.5.a: ".. Path to Infinite Wisdom."
 samgharsahi.5.b: ".. The way of Pious and Just Ruler."
 samgharsahi.5.c: ".. How to push the realm into a golden age."
 TD_sam_zarkesurtan_favour_mod: "Zarkesurtan Favour"
 samgharsahi.6.t: "The Khantanian Fairs"
 samgharsahi.6.desc: "The faithful under the patronage of Khantani, mainly farmers from around the Khanta river, have started the celebrations of their traditional Fairs."
 samgharsahi.6.a: "Khantani is a fair Deity, let them celebrate in peace"
 TD_sam_khantanian_fairs: "Khantanian Fairs"
 samgharsahi.7.t: "Khanta Festival"
 samgharsahi.7.desc: "This year's Khanta festival has been very Big and successful, attracting many new settlers, merchants and opportunities, all under the patronage of the great Khantani."
 samgharsahi.7.a: "Blessed be Khanta and Khantani"
 TD_sam_khanta_festival: "Khanta Festival"
 samgharsahi.8.t: "The Ritual Duel"
 samgharsahi.8.desc: "One of our Generals has been challenged by one of the younger officers to a Ritual Duel to the death under the patronage of the deity Jangayath, if the Young one wins, he will take the place of the killed general."
 samgharsahi.8.a: "Let the best one win!"
 samgharsahi.9.t: "Roshurat's Blessing"
 samgharsahi.9.desc: "Lady Roshurat has blessed us with a visit of a very knowledgeable scholar from afar, who is willing to help and work for us in the name of knowledge."
 samgharsahi.9.a: "Give him a job at our court!"
 samgharsahi.9.b: "Let him preach about the latest societal advancements in our [Root.Capital.GetName]"
 samgharsahi.9.c: "He could help us on our new governmental reforms"
 samgharsahi.10.t: "Chosen by Ondaqat"
 samgharsahi.10.desc: "Our priests claim that there is a new champion chosen by our Patron Deity Ondaqat, and many have started claiming that mantle, until the most promising candidates where brought before the court for our Ruler to decide who is the Chosen one."
 samgharsahi.10.a: "That Thief looks promising"
 samgharsahi.10.b: "The Merchant is Definitely the Chosen one"
 samgharsahi.10.c: "I am the chosen one!"
 TD_sam_chosen_by_ondaqat: "Chosen by Ondaqat"
 samgharsahi.101.t: "[samgharsahi101ET.GetName] Celebrates"
 samgharsahi.101.desc: "The Population of [samgharsahi101ET.GetName] has started they local celebrations of a minor, less known deity that is native to the inhabitants of the [samgharsahi101ET.GetName]."
 samgharsahi.101.a: "Maybe we could increase their taxes and they won't notice?"
 TD_sam_local_celebrations: "Local Celebrations"
 samgharsahi.102.t: "Moral Conflict"
 samgharsahi.102.desc: "The Priests of various Deities are at conflict about the moral differences between the followers of said Deities, with the traditionals support that we should be righteous and donate to the poor, while the Pragmatic Priests claim that state needs it first foremost."
 samgharsahi.102.a: "Support the Righteous Priests"
 samgharsahi.102.b: "Support the Pragmatic Priests"
 samgharsahi.103.t: "Local Deity Found?"
 samgharsahi.103.desc: "The Priests from the rural area claim to have found one of the local minor deities in person, and started to elevate said deity locally, causing a ruckus."
 samgharsahi.103.a: "Endorse this newfound Deity"
 samgharsahi.103.b: "Let them handle it themselves"
 samgharsahi.103.c: "We are loyal only to our Patron deity!"
 samgharsahi.104.t: "Foreign Sage Visit"
 samgharsahi.104.desc: "A Foreign sage from the far east has visited our state, and started to spread his wisdom with the locals, resulting in them confusing the sage for an Envoy of Lady Roshurat, which has alarmed our Priests."
 samgharsahi.104.a: "This wise man will be a fine addition at our Court"
 samgharsahi.104.b: "Clear the misunderstanding and let him travel the country freely"
 samgharsahi.104.c: "Hey! He is an Envoy of Lady Roshurat!"
 samgharsahi.200.t: "The Rise of Emancipation Movements"
 samgharsahi.200.desc: "With how Widespread the cults of Jangayath and Zarkesurta are, and the promotion of novel ideas like `Rights of Man`, many Priests, philosophers, theologians and common folk have started calling for better treatment of the female part of our population."
 samgharsahi.200.a: "Nonsense, fill them with lead!"
 samgharsahi.200.b: "We should go with the times"
 TD_sam_Early_Emancipation: "Early Emancipation"
 samgharsahi.201.t: "The Theological Discoveries of the [Root.Monarch.GetName]"
 samgharsahi.201.desc: "Our monarch has spend a lot of time studying the nuances of the faith revolving around their foreign patron deity, and has decided to convert to the new faith."
 samgharsahi.201.a: "This cannot end bad, right?"
 samgharsahi.201.b: "`Gently` persuade our monarch to change mind"
 samgharsahi.201.c: "Depose [Root.Monarch.GetHerHim]!"
 samgharsahi.202.t: "The Saelian Denomination"
 samgharsahi.202.desc: "Our ruler is fervent follower of Saelius, but which doctrines should he follow?"
 samgharsahi.202.a: "Sigillian"
 samgharsahi.202.b: "Eneratian"
 samgharsahi.202.c: "The Ehren Saelian"
 samgharsahi.202.d: "Agellidian"
 samgharsahi.202.e: "Wirosepan"
 samgharsahi.202.f: "Palmisian"
 samgharsahi.202.g: "Sacellist"
 samgharsahi.202.h: "Liemarian"
 samgharsahi.203.t: "The Conversion of [Root.GetName]"
 samgharsahi.203.desc: "Our Ruler after conversion, has come to a conclusion that all of [Root.GetName] should follow the one true faith of [Root.Monarch.GetHerHim] newfound faith, alarming all of the estates and subjects."
 samgharsahi.203.a: "Embrace the new Faith!"