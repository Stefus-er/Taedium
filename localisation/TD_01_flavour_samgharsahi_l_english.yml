l_english:
 ratisigha: "Ratisigha"
 ratisigha_desc: "Goddess of Ironworking and Desert Winds. Patron Deity of Rakkha Empire."
 joradaravali: "Joradaravali"
 joradaravali_desc: "God of Trickery and Delusion, Patron Deity of Paredeshian Nobility."
 zarkesurta: "Zarkesurta"
 zarkesurta_desc: "Goddess of Feminity and Fertility, Patron of all Independent Women."
 samgharsahi_female_ruler_has_zarkesurta: "Truly Zarkesurtan Ruler"
 khantani: "Khantani"
 khantani_desc: "God of Farming and Order, Patron Deity of Khanta River."
 jangayath: "Jangayath"
 jangayath_desc: "God of Battle and Chaos, Patron Deity of Warriors and Soldiers. Is Equally represented as both Male and Female."
 roshurat: "Roshurat"
 roshurat_desc: "Goddess of Light, Sun, and Patron of all Sages and Scholars."
 ondaqat: "Ondaqat"
 ondaqat_desc: "God of Shadows, Night, Power, and Patron of those who defy the odds no matter the means."
 sam_saelius: "Saelius"
 sam_saelius_desc: "Saelius is Emperor-turned-God founder of the Saelian faiths, and is the sole Deity in every major denomination of the Saelianism."
 sam_merhaan: "Merhaan"
 sam_merhaan_desc: "Merhaan is the sole Deity of Merhaanic faiths, which belivers of those Faiths claim that Merhaan is responsible for creation of Mankind."
 sam_ilum: "Ilum"
 sam_ilum_desc: "Ilum is the sole Deity of Ilumist and Yaltaizm Faiths."
 sam_avos: "Avos"
 sam_avos_desc: "Avos is the sole Deity of the Kausali faith."
