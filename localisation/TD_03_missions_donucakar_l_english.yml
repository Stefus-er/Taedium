 #buttons
 don_buy_claims_tt: "Purchase Claim to Heretical Land"
 #decisions
 don_move_capital_decision_title: "£shield_DON£Move Capital"
 don_move_capital_decision_desc: "[Root.Capital.GetName] is strained by our growing administrative needs. Perhaps our court should find a new city to host the government?"

 don_old_treaties_decision_title: "£shield_DON£The Old Treaties"
 don_old_treaties_decision_desc: "Many years ago, a deal with signed between king Esin and the emperor of Saelian Empire, swearing to lend each other supports in time of crisis. We should ask the emperor for support using this as our basis."

 don_royal_highway_1_decision_title: "£shield_DON£Construct Royal Highway - Kanar Yolu"
 don_royal_highway_1_decision_desc: "We will expand the road network through a royal decree."
 kanar_yolu: "Kanar Yolu"
 don_royal_highway_decision_cost_tt: "Ruler personality §YArchitectural Visionary§! will reduce the cost by §Y250§!¤. Completing §YInfrastructure Ideas§! will reduce it further."
 don_royal_highway: "The Royal Highway"
 desc_don_royal_highway: "Road network in this province serves not only our people, but also makes it easier to govern and move troops across the country."
 don_royal_highway_2_decision_title: "£shield_DON£Construct Royal Highway - Karsi Yolu"
 don_royal_highway_2_decision_desc: "We will expand the road network through a royal decree."
 karsi_yolu: "Karsi Yolu"
 don_royal_highway_3_decision_title: "£shield_DON£Construct Royal Highway - Güney Yolu"
 don_royal_highway_3_decision_desc: "We will expand the road network through a royal decree."
 guney_yolu: "Güney Yolu"

 #reforms
 armed_monasteries_reform: "Armed Monasteries"
 armed_monasteries_reform_desc: "In order to protect our kingdom from neighboring heathens, every monastery will be trained to autonomously defend themselves."
 gov_militarized_churches: "Militarized Churches"
 desc_gov_militarized_churches: "Sacred places in this province have been militarized to effectively fight back against invaders."
 mechanic_military_churches_attribute_yes: "Temple buildings now grant §YLocal Hostile Attrition§! and §YLocal Manpower Modifier§!."
 unlock_armed_monasteries_reform_tt: "\nUnlocks tier 4 government reform §YArmed Monasteries§!."
 unlocked_armed_monasteries_reform_tt: "Unlocked government reform §YArmed Monasteries§! through completing the mission §YReform the Army§!."

 don_ileyorir_system_reform: "Ileyorir System"
 don_ileyorir_system_reform_desc: "Based on the governance system functioning in the near vicinity of the city of Ileyorir, the clergy is given a free hand on cultural and religious matters."
 mechanic_seizing_land_no_rebels_from_estate_peasants_yes: "Seizing Land from the §YPeasantry§! does not trigger Peasant rebels"
 mercantilistic_approach_reform: "Mercantilistic Approach"

 don_royal_representative_reform: "Court Representation"
 don_royal_representative_reform_desc: "To ensure equality among our people, they will receive a royal appointed representative to handle their matters."
 mechanic_better_promote_festival_yes: "Peasantry privilege §YPromote Festivals§! now grants §G-5§! Years of Separatism and no longer reduces max absolutism."

 don_confinian_theism_reform: "Confinian Theism"
 don_confinian_theism_reform_desc: "Radical form of Saelian \"Holy Viceroyalty\" idea.\nA Saelian state must, above all, fulfill the divine mission of allowing only truly divine individuals to take the throne and govern effectively; heathens and heretics are not seen as having fully developed conscience and thus are unable to be judged through normal way of law."
 unlocked_don_confinian_theism_reform_tt: "Unlocked government reform §YConfinian Theism§! through completing the mission §YAge of Enlightenment§!."
 unlock_don_confinian_theism_reform_tt: "Unlocks tier 9 government reform §YConfinian Theism§!."
 
 #privileges
 estate_nobles_arazi_payi: "Reformed Arazi Payi"
 estate_nobles_arazi_payi_desc: "Arazi Payi is an ancient system of loot and land division, even more ancient than the kingdom itself. According to the law, the king redistributes the spoils himself; if the nobles are satisfied, they return some of the gifts they were given. If not, they have a right to be exempted from military campaigns. The reformed Arazi Payi allows the king to remit taxes from the land in exchange for loyalty."
 has_unlocked_estate_nobles_arazi_payi_tt: "Unlocked [Root.GetNobilityName] privilege '§YReformed Arazi Payi§!' through completing the mission §YReform the Army§!."
 unlock_privilege_estate_nobles_arazi_payi_tt: "\nUnlocks the [Root.GetNobilityName] privilege '§YReformed Arazi Payi§!."
 #, which provides:\n§G-2.00§! National Unrest\n§G+10%§! [Root.GetNobilityName] Loyalty Equilibrium\n§Y+5%§! [Root.GetNobilityName] Influence\nExempt [Root.GetNobilityName] from §YSeize Land§!.

 #mission events
 don_kanlabi_defeatism_mod: "Kanlabi Defeatism"
 desc_don_kanlabi_defeatism_mod: "The massacre in Kanlabi has left our nobles craven and unwilling to continue supporting military aggressive actions against Chilverchians."

 donucakar.100_insight: "A funeral will be held. Our King has planned a great speech for the ceremony."
 donucakar.100.t: "The Funeral"
 donucakar.100.desc: "The Funeral of Mahzun Alparslanoglu will forever mark an important point in [Root.GetAdjective] history, however not for the reason one might think.\n\nDuring the ceremony and after laying the body in the newly constructed tomb, the king started his great speech. Despite speaking mostly of Alparslan, our conversion and the legacy of Mahzun, many could tell shame was emanating from the [Root.Monarch.GetTitle]. End of this speech confirmed suspicions of many courtiers - Altan is abdicating to give power to his ambitious son Emre."
 donucakar.100.a: "Can he even do that?"
 donucakar.100.a_tt: "Current Ruler (§YAltan§!) will abdicate."

 donucakar.101_insight: "Political intrigues between warring factions in the court will be resolved.\n\n§TOption 1§!\nEmre will be victorious, but the pretender will still rise up in the north;\n\n§TOption 2§!\nA Gormadi contender will win, at the cost of empowering his supporters."
 donucakar.101.t: "A New Contender"
 donucakar.101.desc: "Following the abdication, Emre has been reorganizing his cabinet and the court to his will. Taking advantage of the chaos, a powerful noble named Tugay Özgüroglu, member of the exiled Gormadi nobility now residing in Yanla, has been scheming to take the throne for himself.\n\nDuring one of the audiences of [Root.Monarch.GetTitle] Emre, Tugay has approached Him, demanding He also abdicates and gives the throne to a more worthy successor, using his mother's ancestry as a way to legitimize his claim."
 donucakar.101.a: "Emre and his loyalists remain in power"
 donucakar.101.b: "Using Yanlan nobles, Tugay seizes the throne"
 donucakar.101.b_tt_1: "He will be §YJust§! and §YConqueror§!.\n  "
 don_noble_leverage_mod: "Noble Leverage"
 desc_don_noble_leverage_mod: "For their support in the coup, nobles expect a hefty recompensation."
 donucakar.101.b_tt_2: "\nGain a permanent claim on every §YGormadi§! culture province."

 donucakar.102_insight: "Decide the future of our military organisation.\n\n§TOption 1§!\nFocus on the Defense and strengthen the [Root.GetClergyName];\n\n§TOption 2§!\nA Focus on the offense - empower the [Root.GetNobilityName]."
 donucakar.102.t: "A Fresh Look"
 donucakar.102.desc: "Ever since the Kanlabi Humiliation, there have been influential people wishing to reform our army and prevent another event as destructive to our power as this. Two schools of thought developed; the first one focused on maintaining our defensive stance, making use of the vast network of fortified monasteries; the second one focused on bringing back cavalry into the army, modernizing it and making use of its tactical and outmaneuver potential."
 donucakar.102.a: "This is our home now and we have to protect it"
 donucakar.102.a_tt: "Unlock §YSpray and Pray§! mission."
 donucakar.102.b: "We will ride towards the sunset once again"
 donucakar.102.b_tt: "Unlock §YBack to the Past§! mission."

 donucakar.103_insight: "We will charter the newly gained land between our estates."
 donucakar.103.t: "Question of Right"
 donucakar.103.desc: "As our reclamation of the land east of Dutissim continues, many are trying to get the opportunity to be the ones to govern these lands. Clergy claims that it has the inherent right, as they and their monasteries have been here even before our kingdom, however many wealthy individuals see this land a land of investment and opportunities, wishing to use their wealth to bring prosperity. What should we do?"
 donucakar.103.a: "The Clergy will govern the land."
 don_clergy_stewardship: "Clerical Stewardship"
 desc_don_clergy_stewardship: "The clergy is using its influence to coerce local population to pay increased taxes, some of which is used to organise festivals and celebrations."
 donucakar.103.b: "The Urbanites will steward the land"
 don_burghers_stewardship: "Burgher Stewardship"
 desc_don_burghers_stewardship: "The burghers are using their infuence to fund new investments and increase production capabilities of the area."

 donucakar.104_insight: "Solidify the integration of Gormadis into our social fabric. Perhaps with a ruler of §YGormadi§! we could have a different outcome?"
 donucakar.104.t: "The Crown of Gormad"
 donucakar.104.desc: "The Gormadi have always stood in opposition to our kingdom. Our fights for influence in the region have caused frequent clashes and border changes in the Dutissim, further distancing once brotherly clans. Now that we are the sole rulers of Confinia, we have to deal with the Gormadi remnants once and for all."
 donucakar.104.a: "Integrate them into our society."
 donucakar.104.b: "If we wish to survive, we have to go on as a one nation."
 donucakar.104.b_tt: "Developing §YWestern Anavatic§! provinces will have a §Y10%§! chance to change the culture to §YGeneli§!."

 donucakar.105_insight: "We will decide on the site of our new capital out of a few eligible provinces.\nThe new capital will gain:"
 donucakar.105.t: "The New Capital of [Root.GetName]"
 donucakar.105.desc: "Laradandol has served as the seat of our court for a few centuries, however with new administrative strains, it's becoming apparent that a new seat of power should be arranged. Our advisors and courtiers have proposed a few potential locations."
 donucakar.105.a: "[787.GetName], our most cosmopolitan city."
 donucakar.105.b: "[448.GetName], the old capital of Gormad."
 donucakar.105.c: "[445.GetName], the lost and rebuilt city."
 donucakar.105.d: "[446.GetName], our once grandest castle and palace."

 donucakar.106_insight: "We will demand fulfillment of emperor's part of our deal."
 donucakar.106.t: "The Old Treaties"
 donucakar.106.desc: "Through the ages we have signed many deals and treaties with the Donucian rulers, for better or for worse. Now they demand that we fulfill our part of the deal..."
 donucakar.106.a: "Respect the request"
 donucakar.106.b: "Respectfully Deny"

 donucakar.107.t: "The Emperor supports us!"
 donucakar.107.desc: "The emperor has accepted our request and the troops should arrive shortly."
 donucakar.107.a: "Glory to the Emperor!"

 donucakar.108.t: "The Emperor denies support!"
 donucakar.108.desc: "The emperor has denied our request!"
 donucakar.108.a: "Damnation!"

 donucakar.109_insight: "We will decide on the fate of Chilverchian remnants. Allow them to convert or leave these lands."
 donucakar.109.t: "...Die by the Sword"
 donucakar.109.desc: "While the chilverchian states are gone, some of the nobles stayed behind, eithe because they foolishly expect their brothers in faith to regain the territories or simply because they feel comfortable and confident enough to maintain power in our nation. The crown is being pressured to deal with these dissidents; whether by force or diplomacy does not matter - everyone agrees that there can be no Eneratian rulers within our borders."
 donucakar.109.a: "They can stay - but only if they convert."
 donucakar.109.a_tt: "Every owned §YEneratian§! province will have a §Y25%§! chance to become §Y[Root.Religion.GetName]§!."
 donucakar.109.b: "Expel them to their rotten homeland!"
 donucakar.109.b_tt: "Every owned province with a Chilverchian march §Yculture§! or with a Chilverchian march §Ycore§! will gain:\nLose §R1§! random development point.\nGain §R25§! devastation."

 donucakar.110.t: "Missionaries from [don_proselytizer_et.GetName]"
 donucakar.110.desc: "Our relations with [don_proselytizer_et.GetName] brought not only a new ally, but also a wave of missionaries converting our people to their faith."
 donucakar.110.a: "Maybe they are right?"
 donucakar.110.b: "We will not abandon our roots!"

 donucakar.111.t: "The Council of Five"
 donucakar.111.desc: "The wide range of languages and cultures in our land has never been a problem, mostly because of our lack of actual control, while the clergy ruled the land as they wished, often having different systems of law. Through our efforts to increase the power of the crown, these lands are slowly becoming harder and harder to manage. The council of five, representing most important factions within the court, was brought together to discuss a unified way to manage internal affairs in the [Root.GovernmentName]."
 donucakar.111.a: "The clergy will handle cultural matters"
 donucakar.111.b: "The rights of the rural folk will be protected"

 donucakar.112_insight: "The Saelian Empire is falling. Should we support it?\n\n§TOption 1§!\n“The Era of Emperors must come to an end.“\n§TOption 2§!\nHelp the empire in times of crisis."
 donucakar.112.t: "Cracks in the Wall"
 donucakar.112.desc: "We have relied on imperial support ever since our conversion to Saelianism. As political climate shifted, so did our people's view on this relation - powerful groups now wish for us to distance ourselves from this rotting state before its too late."
 donucakar.112.a: "We have faith in the empire and the emperor"
 donucakar.112.a_tt: "Unlock §YImperial§! branch."
 donucakar.112.b: "The path forward is our own:"
 donucakar.112.b_tt: "Unlock §YReformation§! branch."

 donucakar.113.t: "Fate of the Empire"
 donucakar.113.desc.1: "The empire has fallen in law, but it has not fallen in truth! As long as we stand, we will fight to restore the glory of the Saelian Empire."
 donucakar.113.desc.2: "The empire survived countless attempts to destroy it, however the one to finish it off might be the emperor himself. Many of our advisors are arguing to attempt to subdue the tetrarchy and seize the emperorship, while it is not too late to save it."
 donucakar.113.a: "As one we will be victorious."
 don_emperors_most_faithful: "Emperor's Most Faithful"
 desc_don_emperors_most_faithful: "The empire is strongest when it is unified."
 donucakar.113.a_tt: "As long as we have this modifier, we will NOT be integrated into the Saelian Empire upon its unification."
 donucakar.113.b: "Silvestrines do not deserve the mantle of Saelius."
 don_imperial_claimant: "Imperial Claimant"
 desc_don_imperial_claimant: "Who said the Emperor can't be [Root.Culture.GetName]?"
 donucakar.113.c: "From the ashes, we will rise!"
 unlock_decision_saelian_empire_nation_tt: "Unlock §YRestore Saelian Empire§! decision."

 donucakar.114_insight: "We will decide if we want to cooperate with the clergy or crush them once and for all."
 donucakar.114.t: "The Fate of the Clergy"
 donucakar.114.desc: "Our attempts to influence religious doctrine in the [Root.GovernmentName] have not have not gone unnoticed by the clergy, which is staunchly supportive of the true imperial doctrine. Rumor has it, that some of the more influential bishops and monks have began to arrange a proper opposition and organize themselves against our actions. We must act fast, else we might find ourselves in a civil war."
 donucakar.114.a: "Arrange a compromise"
 don_clerical_support: "Clerical Support"
 desc_don_clerical_support: "The clergy is supporting us for the time being."
 donucakar.114.b: "What are they going to do? Rebel?"
 donucakar.114.c: "Let's Rebel! They'll never expect that!"

 donucakar.115.t: "Uprising in Yanla"
 donucakar.115.desc: "It appears that the monks of Yanla have launched an uprising against [donucakar114_et.GetName], claiming that the [donucakar114_et.Monarch.GetTitle] has wandered off the true imperial doctrine and attempting to distance the [donucakar114_et.GovernmentName] from the empire. If we don't intervene, they will surely abandon us and might prove to be a threat to the empire in the future."
 donucakar.115.a: "Support the monks"
 donucakar.115.b: "We can't spare the coin"

 donucakar.116.t: "Emperor supports Yanla"
 donucakar.116.desc: "The emperor has decided to support Yanla in their unlawful efforts to destroy our monarchy. We too should seek help abroad, preferably in the enemies of the empire."
 donucakar.116.a: "Ask Ehrens for support."
 donucakar.116.b: "We'll deal with it."

 donucakar.117.t: "[donucakar114_et.GetName] asks for support"
 donucakar.117.desc: "A representative from [donucakar114_et.GetName] has reached out to our [Root.Monarch.GetTitle], in order to ask for support in their ongoing fight against the rebelling monks in Yanla mountains. If we accept, this will surely hurt the Saelian Empire..."
 donucakar.117.a: "Accept it"
 donucakar.117.b: "Deny it"

 donucakar.118.t: "Ehrens accepted"
 donucakar.118.desc: "The generous Ehrens accepted our cry for help! We now have resources to fight the Yanlans and the empire."
 donucakar.118.a: "Wonderful!"

 donucakar.119.t: "Ehrens rejected"
 donucakar.119.desc: "The greedy Ehrens rejected our cry for help! We now stand alone against the empire and the Yanlans."
 donucakar.119.a: "Damnation!"
 
 #missions
 don_imperial_relations_title: "Imperial Relations"
 don_imperial_relations_desc: "The Saelian Empire has seen better days. Nevertheless, they still remain a powerful force on the continent and should be treated accordingly."

 don_1_1_title: "Branching Mission"
 don_1_1_desc: "This is a Branching Mission. Its triggers and effects will be different depending on our choices."
 don_1_1_empire: "Unlocking §TReign in Revoria§! will provide:"
 don_1_1_reformation: "\nUnlocking §TClerical Conundrum§! will provide:"

 don_1_2_title: "Branching Mission"
 don_1_2_desc: "This is a Branching Mission. Its triggers and effects will be different depending on our choices."
 don_1_2_empire: "Unlocking §TFaith and Obedience§! will provide:"
 don_1_2_reformation: "\nUnlocking §T[Root.Monarch.GetTitle]'s Country§! will provide:"

 don_1_3_title: "Branching Mission"
 don_1_3_desc: "This is a Branching Mission. Its triggers and effects will be different depending on our choices."
 don_1_3_empire: "Unlocking §TThe Sword of Sigilius§! will provide:"
 don_1_3_reformation: "\nUnlocking §THeresiarch of the East§! will provide:"

 don_reign_in_revoria_title: "Reign in Revoria"
 don_reign_in_revoria_desc: "Revoria, the famed imperial land of art and commerce. To further secure our position as the rulers of Ostsee, we should seek to claim the mantle of king of Revoria, preferably with emperor's approval."
 don_corona_muralis_revorira: "Corona Muralis Revorira"
 desc_don_corona_muralis_revorira: "In ancient times those who spearheaded the siege assault would be rewarded with a corona muralis and granted an estate in Revoria or Silvestria; with time 'Corona Muralis' began to mean the rulers of (or in) Revoria."
 don_reign_in_revoria_tt1: "Have at least §G+3.00§! Diplomatic Reputation"
 don_reign_in_revoria_tt2: "Have at least §G+50.0%§! improve relations"

 don_emperors_most_faithful_title: "Faith and Obedience"
 don_emperors_most_faithful_desc: "The empire needs to be reformed if it wants to compete with the zealous heretics. If the current emperor can't live up to the task, we must be the one to complete it."

 don_the_sword_of_sal_title: "The Sword of Sigilius"
 don_the_sword_of_sal_desc: "We can no longer let people drift away from the true Saelian doctrine. We must be the sword and the shield of Sigilius and Saelius. We must be the judge of law for these heretics."
 don_the_sword_of_sal_tt: "Have at least §G+12.0§! Tolerance of True Faith"
 don_the_sword_of_sigilius: "The Sword of Sigilius"
 desc_don_the_sword_of_sigilius: "We are the nation the ghost of Sigilius will cleanse the heretics."
 don_the_sword_of_sigilius2: "The Sword of Sigilius"
 desc_don_the_sword_of_sigilius2: "We are the nation the ghost of Sigilius will cleanse the heretics."

 don_revorian_avarice_title: "Revorian Avarice"
 don_revorian_avarice_desc: "Revorians are known not only for their far reaching trade networks, but also the wealth they amassed through those routes, which they use to further stifle the competition. We must act fast or they will completely eradicate our merchants."
 don_revorian_avarice_tt: "If §Y[CAD.GetName]§! is our subject and has less than §Y40§! total development:"
 don_mercantile_boom: "Mercantile Boom"
 desc_don_mercantile_boom: "Freeing our merchants from Revorian monopoly led to an increase in economic activity among our people."

 don_urbanize_the_coast_title: "Urbanize the Coast"
 don_urbanize_the_coast_desc: "To increase our influence in the Ostsee we establish a network of cities along the coastline. We could use Revorian settlers to further the investment."
 don_urbanize_the_coast_tt: "If at least 3 §YRevorian§! culture provinces meet the requirements:"
 don_coastal_supply_network: "Coastal Supply Network"
 desc_don_coastal_supply_network: "Our cities have established a solid network of trade routes, allowing for mutual growth."

 don_zakarturi_masters_title: "Zakarturi Masters"
 don_zakarturi_masters_desc: "The Zakarturi, having lost most of their territories, are now spreading across the world, from Visparaya to Mysentria. If we house some of those great thinkers, we will earn respect of our court and neighbours."
 don_zakarturi_masters_tt2: "Gain §G20§! of respective monarch power per hired advisor level."

 don_reform_the_government_title: "Reform the Government"
 don_reform_the_government_desc: "The administration of villages and towns was always very lackluster; not only was it monopolized by nobles and clergy, but also functioned differently across the nation. We must reform it to establish a single bureaucratic apparatus."
 centralize_state_count: "Amount of Centralized States"

 don_universite_saelce_title: "Üniversite Saelce"
 don_universite_saelce_desc: "Support of science and education by Mysentrian elites has allowed many great universities to spring up across the continent. We mustn't lag behind our neighbour and immediately set up a new university."
 don_universite_saelce_tt: "If we have completed §YReligious§!, §YHumanist§!, or §YInnovative Ideas§!:"
 don_universite_saelce: "Üniversite Saelce"
 desc_don_universite_saelce: "A great university with focus on educating priests, philosophers and missionaries."

 don_age_of_enlightenment_title: "Age of Enlightenment"
 don_age_of_enlightenment_desc: "The bright minds of [Root.Getname] are gathering to discuss the most important matter - are heathens even people?"

 don_elegy_for_mahzun_title: "Elegy for Mahzun"
 don_elegy_for_mahzun_desc: "Kanlabi Massacre shook the kingdom to its very core. Estates lost faith in the royal family and the Chilverchian marches are preparing to cross the Dutissim. We must return stability to the kingdom and honor the deeds of late prince Mahzun."

 don_end_the_humiliation_title: "End the Humiliation"
 don_end_the_humiliation_desc: "The only way to clear the stain on our national honor is to vanquish Chilverchians not only from our lands, but from the region altogether. If we manage to defeat them, we will be on a clear path to a regional hegemony."

 don_the_crown_of_gormad_title: "The Crown of Gormad"
 don_the_crown_of_gormad_desc: "The Gormadi have always stood in opposition to our kingdom. Our fights for influence in the region have caused frequent clashes and border changes in the Dutissim, further distancing once brotherly clans. Now that we are the sole rulers of Confinia, we have to deal with the Gormadi remnants once and for all."
 don_overlord_of_confinia: "Overlord of Confinia"
 desc_don_overlord_of_confinia: "Only our [Root.GovernmentName] stands in Confinia. This fills our people with hope and will to fight."

 don_live_by_the_sword_title: "Live by the Sword..."
 don_live_by_the_sword_desc: "The Chilverchian states are gone, but their subjects are still haunting the land. We have to deal with their remnants and ensure stability."

 don_chilverchian_sunset_title: "Eneratian Sunset"
 don_chilverchian_sunset_desc: "After the battle of Kanlabi, we were at the brink of annihilation, but through perseverence and Sal's will we have survived. Now it is our turn to destroy those who have wronged. The century of Eneratian Humiliation has begun!"
 don_ene_num_of_wars_won_var: "Number of wars against Eneratians won"
 don_chilverchian_sunset_tt1: "No great power is §YEneratian§!."
 don_chilverchian_sunset_tt2: "Unlock purchasing permanent claims on §YEneratian§! areas (Accessed through the State interface)."

 don_rebuild_the_army_title: "Rebuild the Army"
 don_rebuild_the_army_desc: "What we lost at Kanlabi was not only huge amounts of peasant blood, but more importantly our few most trusted nobles and officers, who served the king and protected the kingdom. We will have to elevate many lesser nobles to a higher status, using them as a stepping stone for our new force."
 don_building_tradition: "Building Tradition"
 desc_don_building_tradition: "We have lost many great men during the massacre of Kanlabi. We have to rebuild."

 don_mending_the_shattered_sea_title: "Mending the Shattered Sea"
 don_mending_the_shattered_sea_desc: "Islands of Mezonian Straits and Lacerian Sea are divided between many countries fighting for influence and power in the region. If we don't act fast and unify the region, Eneratians will surely consolidate these lands to starve the rest of the Ostsee of resources."
 don_mending_the_shattered_sea_tt_402: "\nIf we meet all the requirements for §Y[402.GetName]§!:"
 don_mending_the_shattered_sea_tt_403: "\nIf we meet all the requirements for §Y[403.GetName]§!:"

 don_recolonize_the_countryside_title: "Recolonize the Countryside"
 don_recolonize_the_countryside_desc: "The Chilverchians have brought nothing but devastation to these lands. Once prosperous fields are now turning into wild meadows and roads lie dormant with nobody caring for them. We have to bring order once again with the help of our estates to speed up the process."
 don_recolonize_the_countryside_tt1: "Every owned province which has a §YTemple§! or a §YCathedral§! will gain:"
 don_recolonize_the_countryside_tt2: "\nEvery owned province which has a §YMarketplace§!, a §YTrade Depot§! or a §YStock Exchange§! will gain:"

 don_the_royal_highway_title: "The Royal Highway"
 don_the_royal_highway_desc: "A problem of old Anavatic kingdoms was that they could never establish a proper road network. All attempts were met with lack of treasury, lack of estate support, or simply lack of will to finish the construction. We have to establish a network of government offices and later use them as outposts along the great Royal Highway."
 don_the_royal_highway_tt1: "Every owned province with expanded infrastructure:"
 don_flawless_infrastructure: "Flawless Infrastructure"
 desc_don_flawless_infrastructure: "Our network of roads, trade and tax buildings, and military outposts has allowed the province to flourish."
 don_the_royal_highway_tt2: "Unlock §YConstruct Royal Highway§! decisions.\nSigning the decisions will provide the eligible provinces with:"

 don_beyond_panourgia_title: "Beyond Panourgia"
 don_beyond_panourgia_desc: "There are some of brothers and sisters in Zakarturia that have never embraced the divine way. We must correct this and coerce them into joining the [Root.Religion.GetName] church, to save them from eternal damnation."
 don_proselytizer_of_gisia: "Proselytizer of Gisia"
 desc_don_proselytizer_of_gisia: "Every village in Gisia has their own religion. We have to correct that."
 don_beyond_panourgia_tt1: "If it is before the §YAge of Absolutism§!:"
 don_beyond_panourgia_tt2: "Every ally of §YTushivi§! or §YMerhaanic§! religion will have a chance to convert. They are more likely to convert the higher their trust of us."

 don_reform_the_army_title: "Reform the Army"
 don_reform_the_army_desc: "To prevent another national tragedy from occuring, we have to set a focus for our military. While the clergy insists on increasing the budget on the fortification, the nobles are increasingly nostalgic for the ancient times where we traversed on the steppe."

 don_back_to_the_past_title: "Back to the Past"
 don_back_to_the_past_desc: "Alparslan once rode west to seek the land of the dead, where people would revel and celebrate all day. We will ride with his ghost to seek this place once again."
 don_spirit_of_alparslan: "Spirit of Alparslan"
 desc_don_spirit_of_alparslan: "Alparslan once rode west to seek the land of the dead, where people would revel and celebrate all day. We will ride with his ghost to seek this place once again."

 don_spray_and_pray_title: "Spray and Pray"
 don_spray_and_pray_desc: "According to our monks, securing mountain passages and constructing gun-equipped monasteries there will ensure our control over the lands. Not only that, but they will help cultivate the land, further securing our grip and royal influence."
 don_unshaken_foundation: "Unshaken Foundation"
 desc_don_unshaken_foundation: "The Church of Donuçakar is a rock on which the entire seeks support."
 unlock_don_spray_and_pray_mechanic: "Constructing §YRamparts§! building will provide §Y10§! of each monarch power and §G-10.0%§! Local Development Cost for §Y50§! years."
 don_frontier_fortification: "Frontier Fortification"
 desc_don_frontier_fortification: "Earthwork has recently been constructed in this province and thanks to the efforts of the clerical colonies the land is returning to prosperity."

 don_5_1_title: "Branching Mission"
 don_5_1_desc: "This is a Branching Mission. Its triggers and effects will be different depending on our choices."
 option_don_5_defensive_tt: "Unlocking §TSpray and Pray§! will provide:"
 option_don_5_offensive_tt: "\nUnlocking §TBack to the Past§! will provide:"

 don_a_navy_of_our_own_title: "A Navy of Our Own"
 don_a_navy_of_our_own_desc: "Our kingdom never had a proper navy, it was always ships levied from fishermen and lended from Camarian merchants. Constructing a proper force to fight on the seas will greatly benefit our interests and protect us from piracy. Our advisors suggest integrating famous Revorian seamen to train our troops and oversee the ships for the time being."
 don_a_navy_of_our_own_tt1: "Two random provinces with §YShipyard§! or §YGrand Shipyard§! buildings:"
 don_a_navy_of_our_own_tt2: "\nIf §YRevorian§! culture is accepted:"
 don_importing_northern_lumber: "Lumber Imports"
 desc_don_importing_northern_lumber: "Ships are made of lumber. We will import lumber to make ships. A perfect plan."
 don_revorian_expertise: "Revorian Admirals"
 desc_don_revorian_expertise: "If we reintegrate Revorians into our naval ranks, they will pass on their expertise to our people."

 don_white_gold_title: "White Gold"
 don_white_gold_desc: "Salt mined deep within the Dutissim is sold across the Ostsee. If we secure and expand its production, we could monopolize the salt trade in eastern Mysentria."
 don_white_gold_tt1: "from §Y10§! years of salt production."
 don_white_gold_tt2: "If §Y[348.GetName]§! province is owned and core by us:"
 don_the_salt_capital: "The Salt Capital of Mysentria"
 desc_don_the_salt_capital: "Our salt is used everywhere, from dishes of Camarian merchants, through pantries of countless castles, to supplies of long voyage ships."

 don_manufacturing_revolution_title: "Manufacturing Revolution"
 don_manufacturing_revolution_desc: "Manufactories are an effective way to produce goods en masse, much faster than traditional guild workshops. We should embrace them across the nation as soon as possible."
 don_manufacturing_revolution_mod: "Manufacturing Revolution"
 desc_don_manufacturing_revolution_mod: "Manufactories are a more effective way of whipping the population to work than a whip."
 don_manufacturing_revolution_tt: "§Y5§! provinces meeting the requirements will gain:"

 don_expand_clothing_industries_title: "Expand Cloth Industry"
 don_expand_clothing_industries_desc: "Clothing industry has always been greatly profitable, however many are now talking about a revolutionary machine capable of improving cloth production. We should investigate these rumors and maybe even set up some of these engines ourselves."
 don_expand_clothing_industries_tt1: "from §Y15§! years of cloth production."
 don_expand_clothing_industries_tt2: "If §YIndustrialization§! has been discovered:"
 don_expand_clothing_industries_tt3: "Every owned province with §YEnlightenment§! and a manufactory will gain:"
 don_donucian_industrialists: "Donucian Industrialists"
 desc_don_donucian_industrialists: "The rich landowners from our heartland are eager to support new methods of production."

 don_clerical_conundrum_title: "Clerical Conundrum"
 don_clerical_conundrum_desc: "The clergy have always had a strong hand in our internal affairs. Many priests are becoming more vocal about their dissatisfaction as we drift away from the imperial sphere of influence. We should deal with these dissidents."

 don_kings_country_title: "[Root.Monarch.GetTitle]'s Country"
 don_kings_country_desc: "As the Sigilian church is losing control over all the drifting doctrines, we should use this to solidify the religious authority of our ruler."
 don_kings_country_tt1: "If religion is §YSigilian§!:"
 don_religious_sovereignty: "Religious Sovereignty"
 desc_don_religious_sovereignty: "No Gods or Men, only King!"
 don_religious_sovereignty2: "Religious Sovereignty"
 desc_don_religious_sovereignty2: "No Gods or Men, only King!"

 don_heresiarch_of_the_east_title: "Heresiarch of the East"
 don_heresiarch_of_the_east_desc: "Apocalyptic fall of the Sigilian church has caused dozens of heretic doctrines, esoteric cults and baseless religions to spring up, taking us further from God. We must reunify the children of God under the true [Root.Religion.GetName] faith."
 don_heresiarch_of_the_east_tt: "Have at least §G+12.0§! Tolerance of True Faith"
 don_heresiarch_of_the_east_mod: "Heresiarch of the East"
 desc_don_heresiarch_of_the_east_mod: "Not one nation stands between us and our destiny. The Will of God must be fulfilled."