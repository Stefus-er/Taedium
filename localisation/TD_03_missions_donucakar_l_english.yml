 don_elegy_for_mahzun_title: "Elegy for Mahzun"
 don_elegy_for_mahzun_desc: "Kanlabi Massacre shook the kingdom to its very core. Estates lost faith in the royal family and the Chilverchian marches are preparing to cross the Dutissim. We must return stability to the kingdom and honor the deeds of late prince Mahzun."

 don_end_the_humiliation_title: "End the Humiliation"
 don_end_the_humiliation_desc: "The only way to clear the stain on our national honor is to vanquish Chilverchians not only from our lands, but from the region altogether. If we manage to defeat them, we will be on a clear path to a regional hegemony."

