 don_reign_in_revoria_title: "Reign in Revoria"
 don_reign_in_revoria_desc: ""

 don_emperors_most_faithful_title: "Emperor's Most Faithful"
 don_emperors_most_faithful_desc: ""

 don_the_sword_of_sal_title: "The Sword of Sigilius"
 don_the_sword_of_sal_desc: ""

 don_revorian_avarice_title: "Revorian Avarice"
 don_revorian_avarice_desc: "Revorians are known not only for their far reaching trade networks, but also the wealth they amassed through those routes, which they use to further stifle the competition. We must act fast or they will completely eradicate our merchants."
 don_revorian_avarice_tt: "If §Y[CAD.GetName]§! is our subject and has less than §Y40§! total development:"
 don_mercantile_boom: "Mercantile Boom"
 desc_don_mercantile_boom: "Freeing our merchants from Revorian monopoly led to an increase in economic activity among our people."

 don_urbanize_the_coast_title: "Urbanize the Coast"
 don_urbanize_the_coast_desc: "To increase our influence in the Ostsee we establish a network of cities along the coastline. We could use Revorian settlers to further the investment."
 don_urbanize_the_coast_tt: "If at least 3 §YRevorian§! culture provinces meet the requirements:"
 don_coastal_supply_network: "Coastal Supply Network"
 desc_don_coastal_supply_network: "Our cities have established a solid network of trade routes, allowing for mutual growth."

 don_zakarturi_masters_title: "Zakarturi Masters"
 don_zakarturi_masters_desc: "The Zakarturi, having lost most of their territories, are now spreading across the world, from Visparaya to Mysentria. If we house some of those great thinkers, we will earn respect of our court and neighbours."
 don_zakarturi_masters_tt2: "Gain §G20§! of respective monarch power per hired advisor level."

 don_reform_the_government_title: "Reform the Government"
 don_reform_the_government_desc: "The administration of villages and towns was always very lackluster; not only was it monopolized by nobles and clergy, but also functioned differently across the nation. We must reform it to establish a single bureaucratic apparatus."
 centralize_state_count: "Amount of Centralized States"

 don_universite_saelce_title: "Üniversite Saelce"
 don_universite_saelce_desc: "Support of science and education by Mysentrian elites has allowed many great universities to spring up across the continent. We mustn't lag behind our neighbour and immediately set up a new university."
 don_universite_saelce_tt: "If we have completed §YReligious§!, §YHumanist§!, or §YInnovative Ideas§!:"
 don_universite_saelce: "Üniversite Saelce"
 desc_don_universite_saelce: "A great university with focus on educating priests, philosophers and missionaries."

 don_age_of_enlightenment_title: "Age of Enlightenment"
 don_age_of_enlightenment_desc: "The bright minds of [Root.Getname] are gathering to discuss the most important matter - are heathens even people?"

 don_elegy_for_mahzun_title: "Elegy for Mahzun"
 don_elegy_for_mahzun_desc: "Kanlabi Massacre shook the kingdom to its very core. Estates lost faith in the royal family and the Chilverchian marches are preparing to cross the Dutissim. We must return stability to the kingdom and honor the deeds of late prince Mahzun."

 don_end_the_humiliation_title: "End the Humiliation"
 don_end_the_humiliation_desc: "The only way to clear the stain on our national honor is to vanquish Chilverchians not only from our lands, but from the region altogether. If we manage to defeat them, we will be on a clear path to a regional hegemony."

 don_the_crown_of_gormad_title: "The Crown of Gormad"
 don_the_crown_of_gormad_desc: "The Gormadi have always stood in opposition to our kingdom. Our fights for influence in the region have caused frequent clashes and border changes in the Dutissim, further distancing once brotherly clans. Now that we are the sole rulers of Confinia, we have to deal with the Gormadi remnants once and for all."
 don_overlord_of_confinia: "Overlord of Confinia"
 desc_don_overlord_of_confinia: "Only our [Root.GovernmentName] stands in Confinia. This fills our people with hope and will to fight."

 don_live_by_the_sword_title: "Live by the Sword..."
 don_live_by_the_sword_desc: "The Chilverchian states are gone, but their subjects are still haunting the land. We have to deal with their remnants and ensure stability."

 don_chilverchian_sunset_title: "Eneratian Sunset"
 don_chilverchian_sunset_desc: "After the battle of Kanlabi, we were at the brink of annihilation, but through perseverence and Sal's will we have survived. Now it is our turn to destroy those who have wronged. The century of Eneratian Humiliation has begun!"
 don_ene_num_of_wars_won_var: "Number of won wars against Eneratians"
 don_chilverchian_sunset_tt1: "No great power is §YEneratian§!."
 don_chilverchian_sunset_tt2: "Unlock purchasing permanent claims on §YEneratian§! areas (Accessed through the State interface)."

 don_rebuild_the_army_title: "Rebuild the Army"
 don_rebuild_the_army_desc: "What we lost at Kanlabi was not only huge amounts of peasant blood, but more importantly our few most trusted nobles and officers, who served the king and protected the kingdom. We will have to elevate many lesser nobles to a higher status, using them as a stepping stone for our new force."
 don_building_tradition: "Building Tradition"
 desc_don_building_tradition: "We have lost many great men during the massacre of Kanlabi. We have to rebuild."

 don_mending_the_shattered_sea_title: "Mending the Shattered Sea"
 don_mending_the_shattered_sea_desc: "Islands of Mezonian Straits and Lacerian Sea are divided between many countries fighting for influence and power in the region. If we don't act fast and unify the region, Eneratians will surely consolidate these lands to starve the rest of the Ostsee of resources."
 don_mending_the_shattered_sea_tt_402: "\nIf we meet all the requirements for §Y[402.GetName]§!:"
 don_mending_the_shattered_sea_tt_403: "\nIf we meet all the requirements for §Y[403.GetName]§!:"

 don_recolonize_the_countryside_title: "Recolonize the Countryside"
 don_recolonize_the_countryside_desc: "The Chilverchians have brought nothing but devastation to these lands. Once prosperous fields are now turning into wild meadows and roads lie dormant with nobody caring for them. We have to bring order once again with the help of our estates to speed up the process."
 don_recolonize_the_countryside_tt1: "Every owned province which has a §YTemple§! or a §YCathedral§! will gain:"
 don_recolonize_the_countryside_tt2: "\nEvery owned province which has a §YMarketplace§!, a §YTrade Depot§! or a §YStock Exchange§! will gain:"

 don_the_royal_highway_title: "The Royal Highway"
 don_the_royal_highway_desc: "A problem of old Anavatic kingdoms was that they could never establish a proper road network. All attempts were met with lack of treasury, lack of estate support, or simply lack of will to finish the construction. We have to establish a network of government offices and later use them as outposts along the great Royal Highway."
 don_the_royal_highway_tt1: "Every owned province with expanded infrastructure:"
 don_flawless_infrastructure: "Flawless Infrastructure"
 desc_don_flawless_infrastructure: "Our network of roads, trade and tax buildings, and military outposts has allowed the province to flourish."
 don_the_royal_highway_tt2: "Unlock §YConstruct Royal Highway§! decisions.\nSigning the decisions will provide the eligible provinces with:"

 don_beyond_panourgia_title: "Beyond Panourgia"
 don_beyond_panourgia_desc: "There are some of brothers and sisters in Zakarturia that have never embraced the divine way. We must correct this and coerce them into joining the [Root.Religion.GetName] church, to save them from eternal damnation."
 don_proselytizer_of_gisia: "Proselytizer of Gisia"
 desc_don_proselytizer_of_gisia: "Every village in Gisia has their own religion. We have to correct that."
 don_beyond_panourgia_tt1: "If it is before the §YAge of Absolutism§!:"
 don_beyond_panourgia_tt2: "Every ally of §YTushivi§! or §YMerhaanic§! religion will have a chance to convert. They are more likely to convert the higher their trust of us."

 don_reform_the_army_title: "Reform the Army"
 don_reform_the_army_desc: "To prevent another national tragedy from occuring, we have to set a focus for our military. While the clergy insists on increasing the budget on the fortification, the nobles are increasingly nostalgic for the ancient times where we traversed on the steppe."

 don_back_to_the_past_title: "Back to the Past"
 don_back_to_the_past_desc: "Alparslan once rode west to seek the land of the dead, where people would revel and celebrate all day. We will ride with his ghost to seek this place once again."
 don_spirit_of_alparslan: "Spirit of Alparslan"
 desc_don_spirit_of_alparslan: "Alparslan once rode west to seek the land of the dead, where people would revel and celebrate all day. We will ride with his ghost to seek this place once again."

 don_spray_and_pray_title: "Spray and Pray"
 don_spray_and_pray_desc: "According to our monks, securing mountain passages and constructing gun-equipped monasteries there will ensure our control over the lands. Not only that, but they will help cultivate the land, further securing our grip and royal influence."
 don_unshaken_foundation: "Unshaken Foundation"
 desc_don_unshaken_foundation: "The Church of Donuçakar is a rock on which the entire seeks support."
 unlock_don_spray_and_pray_mechanic: "Constructing §YRamparts§! building will provide §Y10§! of each monarch power and §G-10.0%§! Local Development Cost for §Y50§! years."
 don_frontier_fortification: "Frontier Fortification"
 desc_don_frontier_fortification: "Earthwork has recently been constructed in this province and thanks to the efforts of the clerical colonies the land is returning to prosperity."

 don_5_1_title: "Branching Mission"
 don_5_1_desc: ""
 option_don_5_defensive_tt: "Unlocking §TSpray and Pray§! will provide:"
 option_don_5_offensive_tt: "\nUnlocking §TBack to the Past§! will provide:"

 don_a_navy_of_our_own_title: "A Navy of Our Own"
 don_a_navy_of_our_own_desc: "Our kingdom never had a proper navy, it was always ships levied from fishermen and lended from Camarian merchants. Constructing a proper force to fight on the seas will greatly benefit our interests and protect us from piracy. Our advisors suggest integrating famous Revorian seamen to train our troops and oversee the ships for the time being."
 don_a_navy_of_our_own_tt1: "Two random provinces with §YShipyard§! or §YGrand Shipyard§! buildings:"
 don_a_navy_of_our_own_tt2: "\nIf §YRevorian§! culture is accepted:"
 don_importing_northern_lumber: "Lumber Imports"
 desc_don_importing_northern_lumber: "Ships are made of lumber. We will import lumber to make ships. A perfect plan."
 don_revorian_expertise: "Revorian Admirals"
 desc_don_revorian_expertise: "If we reintegrate Revorians into our naval ranks, they will pass on their expertise to our people."

 don_white_gold_title: "White Gold"
 don_white_gold_desc: "Salt mined deep within the Dutissim is sold across the Ostsee. If we secure and expand its production, we could monopolize the salt trade in eastern Mysentria."
 don_white_gold_tt1: "from §Y10§! years of salt production."
 don_white_gold_tt2: "If §Y[348.GetName]§! province is owned and core by us:"
 don_the_salt_capital: "The Salt Capital of Mysentria"
 desc_don_the_salt_capital: "Our salt is used everywhere, from dishes of Camarian merchants, through pantries of countless castles, to supplies of long voyage ships."

 don_manufacturing_revolution_title: "Manufacturing Revolution"
 don_manufacturing_revolution_desc: "Manufactories are an effective way to produce goods en masse, much faster than traditional guild workshops. We should embrace them across the nation as soon as possible."
 don_manufacturing_revolution_mod: "Manufacturing Revolution"
 desc_don_manufacturing_revolution_mod: "Manufactories are a more effective way of whipping the population to work than a whip."
 don_manufacturing_revolution_tt: "§Y5§! provinces meeting the requirements will gain:"

 don_expand_clothing_industries_title: "Expand Cloth Industry"
 don_expand_clothing_industries_desc: "Clothing industry has always been greatly profitable, however many are now talking about a revolutionary machine capable of improving cloth production. We should investigate these rumors and maybe even set up some of these engines ourselves."
 don_expand_clothing_industries_tt1: "from §Y15§! years of cloth production."
 don_expand_clothing_industries_tt2: "If §YIndustrialization§! has been discovered:"
 don_expand_clothing_industries_tt3: "Every owned province with §YEnlightenment§! and a manufactory will gain:"
 don_donucian_industrialists: "Donucian Industrialists"
 desc_don_donucian_industrialists: "The rich landowners from our heartland are eager to support new methods of production."

 don_clerical_conundrum_title: "Clerical Conundrum"
 don_clerical_conundrum_desc: ""

 don_kings_country_title: "[Root.Monarch.GetTitle]'s Country"
 don_kings_country_desc: ""

 don_heresiarch_of_the_east_title: "Heresiarch of the East"
 don_heresiarch_of_the_east_desc: ""