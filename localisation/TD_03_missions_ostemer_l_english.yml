l_english:
 TD_OST_Merchant_Navy_title: "Merchant Navy"
 TD_OST_Merchant_Navy_desc: "If we wish to dominate the Revorian Bay, and by extension, all of Ostsee, we first must found a proper merchant navy to project our power on other Ostemer States."
 TD_OST_Merchant_Fleet: "Merchant Navy"

 TD_OST_Marines_title: "Ostemer Marine Corpus"
 TD_OST_Marines_desc: "The maritime nature of our state demands adaptations of our military. We must expand the Ostemer Marine Corpus which shall protect the interests of [Root.GetUsableName] in the Ostsee."
 ostemer_marines_reform: "Ostemer Marine Corpus"
 ostemer_marines_reform_desc: "Ostemer Marine Corpus was originally founded as a Marine Mercenary Group, but was quickly bought up Burghers of [LEE.GetUsableName] and has become their elite force ever since."
 unlock_ostemer_marines_reform_tt: "Unlock the '§YOstemer Marine Corpus§!` government reform."

 TD_OST_Burgher_Diet_title: "The Diet of [GetYear]"
 TD_OST_Burgher_Diet_desc: "The Nobility and Clergy are troublesome estates that always go against our wishes and try to sabotage every endeavour in our way of dominating the Ostsee. We must help the burghers to grow in power so they can outvote them in the Diet."
 ostemer.21.t: "The Diet of [GetYear]"
 ostemer.21.desc: "After many troubles with the Estates in [Root.GetUsableName], Burghers finally managed to outvote the other estates on the Diet in the year [GetYear] and proclaim a Burgher Parliament."
 ostemer.21.a: "We rule the waves AND country!"
 burgher_diet_reform: "Burgher Diet"
 burgher_diet_reform_desc: "The Burgher Diet is a type of a Parliamentary system where only the most rich and influential merchants have right to vote."
 unlock_burgher_diet_reform_tt: "Unlock the '§YBurgher Diet§!` government reform."

 TD_OST_Expand_Navy_title: "Expand Naval Infrastructure"
 TD_OST_Expand_Navy_desc: "We live and die by our ability to project our power over the sea. We must prepare our nation for the construction and expansion of the Ostemer Navy."
 OST_Get_building_reward_tt: "Random owned province that meets requirements will gain the following building:"

 TD_OST_Wedlan_Diplo_title: "Wedlan Diplomacy"
 TD_OST_Wedlan_Diplo_desc: "[WED.GetName] is the biggest maritime country in the Ostsee, with power projection that can be rivaled only if all of Ostemer Merchants united. It is better to seek a Diplomacy with them than a war, especially with [BOG.GetAdjective] threat that lies between us."
 OST_allied_wedla_tt: "If we have successfully allied @WED [WED.GetName], we will get the following:"
 OST_wedla_dead_tt: "Otherwise, if @WED [WED.GetName] was insulted or doesn't exist, we will get the following:"
 OST_Mutual_trade_mod: "Trade Alliance"

 TD_OST_Ostmeer_Domination_title: "Ostsee Domination"
 TD_OST_Ostmeer_Domination_desc: "After Winning the race for Ostmeer, we must secure all vital trade ports in the Ostsee to secure or Dominion over the sea."
 OST_Won_Revoria_tt: "We have won the Race for Revorian Bay"
 OST_Killed_Revoria_Winner_tt: "The Winner of Race for Revorian Bay doesn't exist"
 OST_Killed_Revoria_Winner_tt2: "If we killed Winner of Race for Revorian Bay, we will additionaly get the following:"
 OST_Ostsee_Domination: "Ostsee Domination"
 OST_own_8_ostemer_ports_tt: "We, our subject, or @WED [WED.GetName] if they are our ally, owns atleast 8 provinces in Northern and Southern Ostemer Ports groups"

 TD_OST_WTC_title: "Center of World's Trade"
 TD_OST_WTC_desc: "Wherever our gaze falls upon, there shall be commerce of inconceivable wealth. Our marketplaces are the centers of the trade of the world."
 TD_OST_WTC_Monarchy_title: "Center of World's Trade"
 TD_OST_WTC_Monarchy_desc: "Wherever our gaze falls upon, there shall be commerce of inconceivable wealth. Our marketplaces are the centers of the trade of the world."
 OST_WTC_trigger_tt: "Eastward Trade Collapse has been averted or hasn't happened yet"

 TD_OST_Fight_For_Relevance_title: "A Fight for Relevance"
 TD_OST_Fight_For_Relevance_desc: "We live in the shadow of the great Ostemer Merchnat Republics. If we wish to be seen as relevant in the Ostemeria Proper by our neighbour, we must expand our domain."
 ostemeria_proper: "Ostemeria Proper"

 TD_OST_Revorian_Campaign_title: "Revorian Campaign"
 TD_OST_Revorian_Campaign_desc: "With our Relevance in Ostemeria secured, we turn gaze to the lands of Revoria, where many states like [SAG.GetUsableName] or [SER.GetUsableName] could still overshadow us easily, and the looming threat of Chilverchian expansion in the newly-established march of [DAG.GetUsableName]."
 TD_OST_Revorian_Campaign_trigger_tt1: "No §YRevorian§! Primary Culture nation has army bigger than us."
 TD_OST_Revorian_Campaign_trigger_tt2: "No §YRevorian§! province that is part of SE is under control of a country from outside SE." 
 TD_OST_Revorian_Campaign_trigger_tt3: "No §YRevorian§! province is part of SE."
 TD_OST_Revorian_Campaign_effect_tt1: "We will gain Permanent Claims on every §YRevorian§! province"
 TD_OST_Revorian_Campaign_effect_tt2: "If we own atleast §Y20 Development§! in §YRevorian§! provinces we will get:"
 TD_OST_Revorian_Campaign_effect_tt3: "The §YSouthern Campaign§! Imperial Incident will start as soon as possible"
 FRAGILDAN: "Fragildan"
 FRAGILDAN_ADJ: "Fragildian"
 unlock_fragildian_monarchy_reform_tt: "Unlock the '§YFragildian Monarchy§!` government reform."
 fragildian_monarchy_reform: "Fragildian Monarchy"
 fragildian_monarchy_reform_desc: "Modern Fragildian Monarchy has nothing to do with the old, despotic ways of Pre-Saelian Silvestria, and is actually an Elective Monarchy with it's own Parliament, where all estate convene and decide on who should be the monarch."
 TD_OST_Fragildan_claims_tt: "Newly formed §YFragildan§! will gain normal claims on all Revorian and Ostemer provinces"
 TD_Holy_War_on_Heresy: "Saelius' call to War"
 TD_Holy_War_on_Heresy_desc: "FOR THE EMPEROR"

 TD_OST_Fragildan_title: "The Fragildan"
 TD_OST_Fragildan_desc: "Fragildan was an old-silvestrine state that encompassed southern Ostemeria and most of Revoria, with it's unique culture and customs. It has been wiped out by the expansion of Saelius' Empire, but with this favourable winds of change, we could re-establish this famous Domain."


