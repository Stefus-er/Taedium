 ribyah_group_ideas: "Ribyah Minor Ideas"
 ribyah_group_ideas_bonus: "Ribyah Minor Ambition"
 ribyah_group_ideas_start: "Ribyah Minor Traditions"
 ribyah_land_of_altakar: "Land of Altakar"
 ribyah_land_of_altakar_desc: "Altakar, the great chief of ancient Ribyara, is to many much more than a legendary figure or dynastical founder. He represents an idea of fighting evil against all odds, even through trickery."
 ribyah_great_zabayzgad_model: "Great Zabayzgad Model"
 ribyah_great_zabayzgad_model_desc: "While high priests in other states endlessly squabble and fight for power, we took a different approach. Instead of Equalizing all scholars in the realm, there is only one Zabayzgad with absolute power."
 ribyah_mines_of_turahtur: "Mines of Turahtur"
 ribyah_mines_of_turahtur_desc: "Misty mountains of Turahtur hide infinite riches beneath the surface. High quality copper, iron, tin and rare minerals supply palaces and barracks across the entire Maqitan."
 ribyah_hafani_enclaves: "Hafani Enclaves"
 ribyah_hafani_enclaves_desc: "At first, Ilumists were unwelcome in our lands, seen as devils incarnate, however with time, religious fervour died out and even the high priests started accepting foreign merchants and craftsmen."
 ribyah_hawabi_current: "Hawabi Current"
 ribyah_hawabi_current_desc: "Warm eastern winds are not only providers of bountiful rains, but also encourage our people to take to the seas. Many merchants ride the current to swiftly move across the bay and beyond."
 ribyah_eye_for_an_eye: "Eye for an Eye"
 ribyah_eye_for_an_eye_desc: "A simple founding tenet of our justice system, arm for an arm, or often eye for an eye, brings stability and knowledge of the law to all people of our land. It is rooted so deep in the minds of our people, that is even used in dealing with foreigners and wars, taking from them what they took from us - no more and no less."
 ribyah_highland_paradise: "Highland Paradise"
 ribyah_highland_paradise_desc: "Some people see our land as harsh and unsuitable for large scale agriculture, but they are fools; what they see as a weakness, is in reality a strength. Humid valleys and warm winds provide a perfect climate, while dry highlands in our borderlands shield us from our enemies."

 oyria_ideas: "Oyrian Ideas"
 oyria_ideas_start: "Oyrian Traditions"
 oyria_ideas_bonus: "Oyrian Ambition"
 oyria_keepers_of_the_passes: "Keepers of the Passes"
 oyria_keepers_of_the_passes_desc: "Originally drawn from the Turahtur mountain tribes, these troops form the backbone of the forces guarding the passes leading into the Oyar Valley. Before joining Oyria, the mountain tribes tended to their herds of goats, fending off predators and thieves alike in the lands they knew like the back of their hand.\n\nSplit between heavy, bronze shield wielders with a backline composed of archers and slingers, they create an unyielding formation designed to defend the heartland from invaders and raiders. Few have tried to find an opening through the passes, as every trail, ravine, and ridgeline is known to them, and none are left unguarded."
 oyria_high_council_of_zabayzgads: "High Council of Zabayzgads"
 oyria_high_council_of_zabayzgads_desc: "Holding authority over Qubrayian doctrine and claiming direct communion with the river gods themselves, the Zabayzgads have long acted autonomously, their influence varying from region to region.\n\nTo avoid power struggles and contradicting teachings, the Zabayzgads were assembled together in Oyriarab to establish a central doctrine.\n\nVowing to not stray from Qubray’s path and to further ensure the supremacy of the Zabayzgads in the state, the High Council was established to perform statecraft efficiently and decisively."
 oyria_gardens_of_qubray: "Kahhin Ganinia"
 oyria_gardens_of_qubray_desc: "The magnificent Hanging Gardens in Qubrayia stand as a sacred oasis in harsh lands, displaying the divine favour of Qubray to his faithful and the prosperity of Oyria. Built over a period of 40 years, the multi-layered Kahhin Ganinia houses flora both local and foreign, with vines decorating each wall, leaving no surface without greenery.\n\nWaterways on the ground level keep the plants vibrant, with the Zabayzgads claiming Qubray himself blesses life upon his temple. Servants and clergy alike tend to the gardens, carrying water jugs up four levels to ensure every last tree, bush and flower stays vibrant."
 oyria_sacred_cleansers: "Sacred Cleansers"
 oyria_sacred_cleansers_desc: "The cleansers of Oyria train in the use of medicine, utilising the cleansing waters of the Oyar which they believe are critical for healing battle wounds. Often accompanying soldiers across military campaigns, each cleanser is expected to carry a pack of medicine, bandages and a goatskin of Oyar river water.\n\nThose who are lucky to battle near the river get the luxury of having its living waters clean all impurities obtained from the battlefield, washing blood and dirt alike from fresh wounds."
 oyria_fields_of_plenty: "Fields of Plenty"
 oyria_fields_of_plenty_desc:  "While not all lands of Oyria are as blessed and lush as the coastal delta, much work was done to irrigate the drylands for farming and grazing. Utilising methods seen from the Musarfic and Hestani people, peasant and noble alike tend to the common lands, feeding growing armies, and bringing plenty to Mesutia."
 oyria_the_lashers: "The Lashers"
 oyria_the_lashers_desc: "While the Oyrian navy lacked a longstanding naval tradition as the Aedavates across the Maqitan sea, the sailors adopted a rather unconventional approach to sea warfare.Constructing a large navy from scratch to rival the hegemons of the sea would prove too difficult, a new doctrine was developed to instead focus on capturing rival vessels with specialised boarding crews and galleys.\n\nShips were fitted with large metal hooks and a myriad of ropes attached to harpoons to board and capture, while specialised sailors rapidly eliminated the sailors.\n\nThese crews were nicknamed “the Lashers”, feared for their movement across the air as they swooped over inexperienced enemies."
 oyria_interior_journey: "Journey to the Interior"
 oyria_interior_journey_desc: "Journeys past the narrow valleys of the Turahtur and Almurtaf mountains revealed a range of civilisations deep in the interior of Sahila with kingdoms and luxuries unheard of in Mesutia.\n\nWilling to bring peoples together to forge new alliances and foster new trade routes, expeditions of merchants and clergy ventured deep into the interior to establish diplomatic ties and charter new maps."


 RIBYARA_name: "Ribyara"
 RIBYARA_name_ADJ: "Ribyah"
 decision_ribyara_title: "Legacy of Altakar"
 decision_ribyara_desc: "Ribyara was once a great kingdom, controlling exchange of ideas between east and the west. We must restore what we have lost."
 altakar_legacy_mod: "Altakar's Legacy"
 desc_altakar_legacy_mod: "We will not lose our land to Ilumist heretics!"

 zabayzgad_temple: "House of Prosperity"
