l_english:
 TD_Toflanter_Peasantry_title: "Toflanter Peasantry"
 TD_Toflanter_Peasantry_desc: "After Imperial Edict of 1089 many nobles and commoners ventured into our lands, build civilisation, and have grown in power. Now descendants of those people, the local Peasantry and Nobility, are at Odds with each other, and we must choose a side in this conflict."
 estate_peasants_imperial_edict: "Imperial Edict of 1089"
 estate_peasants_imperial_edict_desc: "After Imperial Settler Edict of 1089 many nobles and commoners ventured north to colonize (or conquer) lands north of Magkirche."
 TD_Toflanter_Empower_Nobles_tt: "If we Empowered the Nobility:\nThe '§YProtect Rural Nobility§!` estate privilege will be upgraded with §Y10% Manpower Recovery Speed§! and §Y-10% Peasantry Influence§!."
 TD_Toflanter_Empower_Peasants_tt: "If we Empowered the Peasantry:\nThe '§YExpanded Freedoms§!` estate privilege will be upgraded with §Y10% Production Efficiency§! and §Y-10% Nobility Influence§!."

 TD_Ordenic_Estates_title: "Balancing the Estates"
 TD_Ordenic_Estates_desc: "If we wish to keep up with adminsitrative and diplomatic efforts of the emperor and our neighbours, we need to cooperate with the estates."
 atleast_three_estates_loyal_tt: "At least §Y3§! Estates have at least §Y60§! Loyalty"
 TD_Unity_of_Estates: "Unity of Estates"
 upgraded_ordenic_supremacy_over_crown_tt: "The '§YSupremacy over the [Root.GetStateForm]§!` estate privilege will be upgraded with §Y5% All Estate Loyalty Equilibrium§!."

 TD_Magreiner_Wheatlands_title: "Expanding the Wheatlands"
 TD_Magreiner_Wheatlands_desc: "Magreina is known for it's fertile soil and many wheatlands. With ever growing population, if we want to keep up we must increase our production."
 TD_Expanded_Wheatfields: "Expanded Wheatfields"
 TD_Magreiner_Wheatlands_tt: "Every owned grain-producing province will get:"

 TD_Mageiner_Renaissance_title: "Promote Renaissance"
 TD_Mageiner_Renaissance_desc: "A prestigious and prosperous realm such as ours is primed for a cultural rebirth, a renewed interest in the arts, sciences, and something some people are beginning to call the 'humanities'. We should do all we can to embrace this movement."
 TD_Mageiner_Renaissance_Ord_title: "Promote Renaissance"
 TD_Mageiner_Renaissance_Ord_desc: "A prestigious and prosperous realm such as ours is primed for a cultural rebirth, a renewed interest in the arts, sciences, and something some people are beginning to call the 'humanities'. We should do all we can to embrace this movement."
 TD_Continue_the_Renaissance: "Continue the Renaissance"

 TD_Magreiner_Kriegerstein_title: "Kriegersteiner Shadow"
 TD_Magreiner_Kriegerstein_desc: "All of Magreina lives in the shadow of the [KRI.GetAdjective] [KRI.GetStateForm], and if we ever wish to unite as one, we must walk out from the [KRI.GetAdjective] shadow."
 TD_Magreiner_Kriegerstein_Ord_title: "Kriegersteiner Shadow"
 TD_Magreiner_Kriegerstein_Ord_desc: "All of Magreina lives in the shadow of the [KRI.GetStateForm], and if we ever wish to unite as one, we must walk out from the [KRI.GetAdjective] shadow."
 unlock_magreinland_formable_tt: "§YUnlock Magreinland @MGR Formable Decision§!"
 overshadowed_kriegerstein_tt: "We have Succesfully Overshadowed the Kriegerstein"

 TD_Magreiner_Courts_title: "Courts of Magreina"
 TD_Magreiner_Courts_desc: "With Magreinland being the heartland of modern Saelian Empire, and our close proximity to two Tetrachs and the Imperial Court, spread of information, administrative optimisations, and other valuable information is fast. We should utilize this information and cooperate with our estate to reform our state."
 Magreiner_administration_reform: "Magreiner Administration"
 Magreiner_administration_reform_desc: "Magreiner Administration was a type of Administration, as name suggest, native to Magreinland, where Estates willingly traded power to the local rulers in exchange for more privileges, which resulted in increased centralisation and development efforts of the region."
 unlock_Magreiner_administration_reform_tt: "Unlock the '§YMagreiner Administration§!` government reform."
 TD_Magreiner_Courts_Ord_title: "Courts of Magreina"
 TD_Magreiner_Courts_Ord_desc: "With Magreinland being the heartland of modern Saelian Empire, and our close proximity to two Tetrachs and the Imperial Court, spread of information, administrative optimisations, and other valuable information is fast. We should utilize this information and cooperate with our estate to reform our state."
 


 TD_Magreinland_Federation_title: "Magreinland Federation"
 TD_Magreinland_Federation_desc: "With Advancements in humanist thought, philosophy and general science, if we wish to keep up with modern times and our ever-expanding realm, we must federalise."
 TD_Magreinland_Federation_Ord_title: "Magreinland Federation"
 TD_Magreinland_Federation_Ord_desc: "With Advancements in humanist thought, philosophy and general science, if we wish to keep up with modern times and our ever-expanding realm, we must federalise."
 kill_unrest_separatism_magreiner_tt: "Every owned §YToflanter§! or §YOrdenic§! province will have their separatism and unrest removed."
 magreiner_federal_monarchy_reform: "Magreiner Federal Monarchy"
 magreiner_federal_monarchy_reform_desc: "Magreiner Federal Monarchy is a Federation of states with Magrein Monarch as a representative and estates which rule the country from the parliament."
 unlock_magreiner_federal_monarchy_reform_tt: "Unlock the '§YMagreiner Federal Monarchy§!` government reform."
 magreiner.9.t: "Federalisation of Magreinland"
 magreiner.9.desc: "With Advancements in humanist thought, philosophy and general science, if we wish to keep up with modern times and our ever-expanding realm, we must federalise."
 magreiner.9.a: "Glory to [MGR.GetName] @MGR"

 TD_Magreinland_Granary_title: "Granary of the Empire"
 TD_Magreinland_Granary_desc: "Magreinland is Granary of the Empire, providing grain, such as wheat and rye, to all of Silvestria, and even beyond."
 estate_peasants_magreiner_granary: "Granary of the Empire"
 estate_peasants_magreiner_granary_desc: "Magreinland is Granary of the Empire, providing grain, such as wheat and rye, to all of Silvestria, and even beyond."
 estate_peasants_magreiner_granary_mod: "Granary of the Empire"
 TD_Magreinland_Granary_mod: "Imperial Granary of Magreinland"

 TD_Magreinland_Cities_title: "Cities of Magreina"
 TD_Magreinland_Cities_desc: "Hegenstadt, Magkirche, Magstadt, Limstadt, Nordkirche. Those 5 cities are the most important historically, culturally and economically cities of the Magreinland. Not only we must develop them further so they shine bright all across Mysentria, but we should also found more important cities alongside Magreina."
 TD_City_of_Magreinland_mod: "City of Magreina"
 TD_Magreinland_Cities_tt: "Every province meeting the criteria will get:"
 TD_Magreinland_Cities_Ord_title: "Cities of Magreina"
 TD_Magreinland_Cities_Ord_desc: "Hegenstadt, Magkirche, Magstadt, Limstadt, Nordkirche. Those 5 cities are the most important historically, culturally and economically cities of the Magreinland. Not only we must develop them further so they shine bright all across Mysentria, but we should also found more important cities alongside Magreina."
 

