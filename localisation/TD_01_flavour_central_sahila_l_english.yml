l_english:
 mpasi_group_ideas: "Mpasi Minor Ideas"
 mpasi_group_ideas_start: "Mpasi Minor Traditions"
 mpasi_group_ideas_bonus: "Mpasi Minor Ambition"
 mpasi_jungle_trade_routes: "Jungle Trade Routes"
 mpasi_jungle_trade_routes_desc: "The People North of the Great Central Sahilan Lakes are used to live in the harsh, moisty environment of the jungles, and even commence trade all across of it up to the Okeirina mountains, and even past beyond it."
 mpasi_traditional_copperworking: "Traditional Copperworking"
 mpasi_traditional_copperworking_desc: "Mpasi people are known for their early adoption of copperwork, using it early to produce weapons and neccessities like nails, hammers etc. Later with adoption of iron it has become mostly a cultural resource used for jewelry and things alike."
 mpasi_exchange_with_the_northerners: "Exchange with the North"
 mpasi_exchange_with_the_northerners_desc: "With how fast information flow, the People of eastern Ngamba river had contact with northern Sahila for centuries, and with arrival of Mysentrians in later ages, the exchange of thought and ideas accelerated rapidly."
 mpasi_unification_of_ebamba: "Unification of Ebamba"
 mpasi_unification_of_ebamba_desc: "Ebamba was a kingdom united by Soldiers of Simka and Singayo who rebelled against their countries, overthrowing them in the process, and uniting most of the eastern Ngamba basin in the process. Kingdom of Soldiers was short-lived and later reformed into the Federation of the local kingdoms."
 mpasi_nanama_irrigation: "Nanama Irrigation"
 mpasi_nanama_irrigation_desc: "With moist climate and all-encompassing jungles, the most dominant form of acquiring food was hunting and gathering, but with advancement of technology, people of Mpasi group started utilizing irrigation in tight, unforested parts near the Ngamba river, adding wheat and other crop abundance into the already food-wealthy region."
 mpasi_ozevo_law: "Ozevo Law"
 mpasi_ozevo_law_desc: "Ozevo Law was established in the Ebamba Kingdom in the XVIth century, and was kept later in the splinter states of said kingdom. It said that everyone who commited grave crimes against society and ancestors, like murder, was sent into a special penal company. To prevent convicts from uniting and overthrowing the commanding officers, they were always kept in different units."
 mpasi_patrons_of_kise: "Patrons of Kise"
 mpasi_patrons_of_kise_desc: "In the age of Enlightenment, many wealthy people of Kise city began patronizing local artists and architects, resulting in making great works of arts known all across Central Sahila, and eventually spreading all across Ngamba River."
 
 ezimi_kingdom_reform: "Ezimi Kingdom"
 ezimi_kingdom_reform_desc: "Ezimi Kingdom was form of Tribal Monarchy with one, powerful Cheiftain ruling all over the country, with soldiers who answered only to him supporting the whole endeavour."
 
 
 inyaji_group_ideas: "Inyaji Minor Ideas"
 inyaji_group_ideas_start: "Inyaji Minor Traditions"
 inyaji_group_ideas_bonus: "Inyaji Minor Ambition"
 inyaji_foundation_of_ikirorero: "Foundation of Iki-rorero"
 inyaji_foundation_of_ikirorero_desc: "The Iki-rorero were the first properly fortified settlements that weren't in direct neighborhood of the coast of the Great Lakes due to civilisational advancements and abandonment of nomadic lifestyle."
 inyaji_umurimas: "Umu-rimas"
 inyaji_umurimas_desc: "Umu-rimas are the filulial fields sitting directly next to Great Lakes, which are one of the most fertile soils in the area, allowing us to feed ourselves and not rely on foreign imports."
 inyaji_great_lakes_trade: "Great Lake Trade"
 inyaji_great_lakes_trade_desc: "The Great Lakes are a vital point on the trade routes connecting Nyanban Gulf through Ngamba rivers up to the eastern coasts of Mujura. With the fact that ships are faster than land caravans, we can profit from monopolizing the Great Lakes Waterways."
 inyaji_umusore_conscription: "Uma-sore Conscription"
 inyaji_umusore_conscription_desc: "In the mid 16th century, the Inyaji rulers adopted a conscription system for their subjects that required them to lend their unmarried, young men to serve in a corvée system, which was later called Uma-sore Conscription"
 inyaji_freedom_of_ideas: "Freedom of Ideas"
 inyaji_freedom_of_ideas_desc: "The Great Lakes people, despite their tribal lifestyle, were known for many cultural and technological marvels, with their most known was very developed seafaring technology and advanced knowledge of astronomy, wood veneering and ironworking."
 inyaji_gutsinda_effect: "Gu-tsinda Effect"
 inyaji_gutsinda_effect_desc: "Gu-tsinda Effect is a Inyaji-specific type of warfare focused on winning major battles, which developed thanks to the opennes Savanna steppe where sieges weren't an effective form of winning wars - atleast until adoption of gunpowder."
 inyaji_taming_the_umuriro: "Taming the Umu-riro"
 inyaji_taming_the_umuriro_desc: "When foreign merchants from Mysentria came to the Central Sahila with unknown to the locals technology of gunpowder, the Inyaji people quickly tamed that technology they called 'the pure fire'."
 
 vanhu_group_ideas: "Vanhu Minor Ideas"
 vanhu_group_ideas_start: "Vanhu Minor Traditions"
 vanhu_group_ideas_bonus: "Vanhu Minor Ambition"
 vanhu_chinkati_trade: "Chinkati Trade"
 vanhu_chinkati_trade_desc: "As long as Ajitengala people have been here, and even before them, we have traded across Chinkati sea and dominated the trade of goods like ivory, gold and slaves."
 vanhu_ajitengala_exchange: "Ajitengala Exchange"
 vanhu_ajitengala_exchange_desc: "Ajitengala people are descendants of a far-away civilisation, and through trade with them, we have learned a lot about diplomacy and taming the sea."
 vanhu_gold_minting: "Gold Minting"
 vanhu_gold_minting_desc: "With most of the Central Sahilan gold mines being concentrated in our region, to not cause economical collapse, we have mastered the responsible minting of the golden coin."
 vanhu_ibwe_building: "Ibwe Building"
 vanhu_ibwe_building_desc: "Ibwe Building tradition is almost as old as our civilisation, and is staple of our cultural advancements in decorative and traditional architecture."
 vanhu_protection_of_mujuri_empire: "Protection of the Mujuri"
 vanhu_protection_of_mujuri_empire_desc: "Mujura is the biggest political entity in the region, to the point the region was even named the Greater Mujura later by geographs. In exchange for tribute, they protect us from external threats and share their military knowledge with us."
 vanhu_early_centralisation: "Vanhu Centralisation"
 vanhu_early_centralisation_desc: "Due to the fact that our region has been ridden by the Early Tribal Urbanization of the capital, the capitals of the region were centers of everything, which resulted in most of the Vanhu states ending up heavily centralised, with most of the power ending up in the hands of the local Monarchs."
 vanhu_hondo_mubvi: "Hondo Mubvi"
 vanhu_hondo_mubvi_desc: "Mysentrians weren't the first outsiders to arrive in Greater Mujura, preceeded by Northern Sahilan and Ajitengali Explorers, but were the first to actively try to conquer and colonize our land to exploit our people. It is our only natural course of action that we will try to fight back to repell them."
 
 mujuri_ideas: "Mujuri Ideas"
 mujuri_ideas_start: "Mujuri Traditions"
 mujuri_ideas_bonus: "Mujuri Ambition"
 mujuri_zvechiuto_traditions: "Zvechiuto Traditions"
 mujuri_zvechiuto_traditions_desc: "Mujuri Soldiers are not only considered a occupation, a force to be reckoned with, but also they are put on the cultural pedestal due to how fighting is seen as a ceremonial privilege in the Mujuri land, with that tradition dating back to the earliest traces of Civilisation in the region."
 mujuri_pfumo_tactics: "Pfumo Tactics"
 mujuri_pfumo_tactics_desc: "Pfumo tactics were an early specialised shock warfare tactics focused on spearheading a certain point of enemy formation in order to break it and cause chaos and disorder in the enemy ranks, causing enemy to flee."
 mujuri_bhadhara: "Bhadhara"
 mujuri_bhadhara_desc: "Mujuri Kingdom is the strongest Entity in the region, and with it's long-lasting military traditions, it has taken up the mantle of the protector of it's weaker neighbours, in exchange for the `Bhadhara` tribute."
 mujuri_beyond_chinkatia: "Beyond Chinkatia"
 mujuri_beyond_chinkatia_desc: "Thanks to our dealings with Ajitengali people, we know that they homeland lies far away in the eastern isles we didn't know about before. We know the world doesn't end in Mujura, and it is ours to explore."
 mujuri_kwesekwese_culture: "Kwesekwese Culture"
 mujuri_kwesekwese_culture_desc: "Due to strong Royal power in the Mujura, Nobility wasn't that high above other estates, which resulted in development of more mass-available culture in Mujura. Many Mujuri Peasants were able to read and write, and participate in the Mujuri culture."
 mujuri_unification_of_greater_mujura: "Unification of Greater Mujura"
 mujuri_unification_of_greater_mujura_desc: "With Mujura region protected by the Mujuri Kingdom against external threats, and many subjects remaining loyal to the Mujura, the kingdom has started a diplomatic effort to unite the Region under unitary rule of the Mujuri Court in the XVIIth century."
 mujuri_absolutism: "Mujuri Absolutism"
 mujuri_absolutism_desc: "Due to Early Centralisation in the Tribal stage specific to the Vanhu people, Mujura has developed strong royal power and weak, non-autonomous estates. It later resulted in almost absolute power of the Mujuri King."
 
 cokar_group_ideas: "Cokari Minor Ideas"
 cokar_group_ideas_start: "Cokari Minor Traditions"
 cokar_group_ideas_bonus: "Cokari Minor Ambition"
 cokar_climate_adaptation: "Climate Adaptation" #55 degrees celsius outside my window at the time of writing this btw -Kazuma
 cokar_climate_adaptation_desc: "Although Cokariland isn't the driest place in the continent of Sahila, it lies directly on the equator, and despite that, Cokari people learned to adapt and live in this very unfriendly to humankind land."
 cokar_ancestors_faith: "Ancestors Faith"
 cokar_ancestors_faith_desc: "Amanaa faith is the faith of Cokari people, their father, grandfathers, and forefathers. They have belived in their ancestors and spirit animals for longer than Saelian Empire existed, and they are very unlikely to abandon it."
 cokar_ajitengala_exchange: "Ajitengala Exchange"
 cokar_ajitengala_exchange_desc: "Like many coastal cities, states and tribes of Chinkatia, Cokari people also have traded and exchanged with Ajitengali people, although they were mostly interested in their ways of land and sea warfare."
 cokar_kec_culture: "Kec Culture"
 cokar_kec_culture_desc: "Cokari people are very militarised society, with long and deeply-rooted warrior traditions, where every male is expected to become a warrior and fight for it's tribe or country."
 cokar_mental_resilence: "Mental Resilience"
 cokar_mental_resilence_desc: "Cokari Warriors are conditioned to warfare from as young as the age of three, making them very unlikely to get startled by sudden manuever of the enemy or their comrades dying."
 cokar_cen_mat: "Cen Mat"
 cokar_cen_mat_desc: "People of Cokariland, despite their primarly militaristic culture, aren't isolationist nor opposed to advancements of forgein cultures, on the contrary, they are very likely to assimilate with forgein and conquered cultures and live in cohesion with them."
 cokar_tin_thoor: "Tin Thoor"
 cokar_tin_thoor_desc: "In the tribal stage, and even after adoption of Feudalism and centralisation, the Cokari people have kept their militaristic male-only nature, which after long time of cultivating resulted in almost all non-warrior related jobs like farming, administration, trading et cetera being dominated almost solely by women, and this separation of roles proved very efficient for the cokari states."
 
 joologoni_ideas: "Joologoni Ideas"
 joologoni_ideas_start: "Joologoni Traditions"
 joologoni_ideas_bonus: "Joologoni Ambition"
 joologoni_ruling_in_the_land: "Ruling in the Land"
 joologoni_ruling_in_the_land_desc: "Up to mid 15th century Joologon struggled with highly autonomous provinces backed up by powerful estates, until in 1457 the King Gaguwe I has finally crushed the estate's dominance."
 joologoni_the_apabana_fortresses: "The Apabana Fortressess"
 joologoni_the_apabana_fortresses_desc: "In the 12th Century the Fortress of Luonecie was built on the Apabana river, and it is to this day a staple of Muli architecture, and back in it's prime was such a great fortification design it was copied all across Apabana river."
 joologoni_the_eastern_conflicts: "The Eastern Conflicts"
 joologoni_the_eastern_conflicts_desc: "With Constant skirmishes on the northeastern border with Midnimian states, we started slow consolidation of Cokariland, until we finally gained the upper hand in the early 16th Century and conquered both Akkalon and Socho."
 joologoni_empire: "Joologoni Empire"
 joologoni_empire_desc: "With unification of Cokariland and conquest of Husrhadigar in late 16th century, we have officialy span a large portion of land, and administrating such large swathe of land is a challenge, but our administration due to being female-dominated, is extremely efficient and up to the task."
 joologoni_the_nation_of_scholars: "Nation of Scholars"
 joologoni_the_nation_of_scholars_desc: "Joologon, as the biggest Cokuri state, always attracted bright minds, but after establishment of Joologoni Empire and gaining access to Gulf of Diarena, we have started technological, philosophical and artistical exchange with not only Ajitengali, but also with Diarenan, North Sahilan, and even Visparayan Thinkers."
 joologoni_kec_legacy: "Kec Legacy"
 joologoni_kec_legacy_desc: "Kec Culture was in early stages of the Joologoni state very useful to recruit armies and conquer land, but it was a double-edged sword that eventually led to a male-to-female disproportion so high we needed to not only phase it out, but also start recruiting women into the army to sustain our it."
 joologoni_nalel_grand_harbour: "Nalel Grand Harbour"
 joologoni_nalel_grand_harbour_desc: "In mid 17th Century, in the twilight of the Joologoni empire, to secure our importance on Chinkati sea, especially against Mysentrian ships, we founded the Grandest Harbour on the Chinkati coast in Nalel, and hired the best Ajitengali, Cokuri and Diarenan ship designers and shipyard workers to sustain it."