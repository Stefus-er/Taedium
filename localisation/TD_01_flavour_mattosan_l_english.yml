l_english:
 okoeruara_ideas: "Okoeruara Ideas"
 okoeruara_ideas_start: "Okoeruaran Traditions"
 okoeruara_ideas_bonus: "Okoeruaran Ambition"
 okoeruara_crown_of_the_shackled: "Crown of the Shackled"
 okoeruara_crown_of_the_shackled_desc: "The Iron Crown casts an ever imposing shadow upon the lands of the Kapeti and Bosonapan. Shortly after a grand conquest, their leaders were turned into mere puppets to follow the war banners of Okoeruara at the King Gberu’s beck and call.\n\nEach bloodied chieftain once knelt before the king, swearing oaths of loyalty along with offerings of their most precious treasures for the promise of mercy. They were granted it for the price of forfeiting their titles and claims, keeping what traditions they once had, but their people now endlessly toil for the war machine of the Iron Crown."
 okoeruara_masked_enforcers: "Boju Jagun"
 okoeruara_masked_enforcers_desc: "The power of Okoeruara was not gained by peaceful and conventional means, but by strict order that kept its denizens under a watchful eye. Protection of the king from dissidents of the various conquered tribes was desperately needed due to the demise of King Gberu, who was betrayed by his own men that still had their hearts loyal to their tribe.\n\nIt seemed that soldiers could not leave their old identities behind when serving the Iron Crown, leading to the creation of the Boju Jagun, the Masked Men. From a young age, they would be stripped of their names and connections and forced to fight and die for the king. Once they were found to be truly loyal and capable, they were given ominous masks of wood and ivory to remove their identities and to sow fear in their enemies."
 okoeruara_scourge_of_savanna: "Scourge of the Savanna"
 okoeruara_scourge_of_savanna_desc: "The open savannas in the region of Mattosan have proved to be a blessing and a curse in the northern conquests. They have aided in the rapid push in the heartlands, but have also left Okieruaran armies exposed to skirmishing rebels.\n\nSeeing as the Musarfic people had much success with their light cavalry in the vast deserts, a trade network was established to import horses for our own use, ones that withstand the heat to gain complete control in such wild terrain."
 okoeruara_engulfing_okeirina: "Engulfing Okeirina"
 okoeruara_engulfing_okeirina_desc: "The mountains of Okeirina prove invaluable to the success in forging weaponry, as its iron rich ore veins gave a great advantage for the large scale of production. After failing to find many more veins north to satisfy the growing needs of the military, the eyes of the smiths turned to the south, where lands lay unclaimed, holding treasures unknown.\n\nAccording to legends, it was once the domain of the ancestral founder Ofinran, who led the Matteie people across the narrow pass of Logafo for its fertile land. Now Logafo is a prime target to re-enter the region, to chart and claim the wild territories for the continued monopoly of iron, and the discovery of our ancestral homeland."
 okoeruara_spoils_of_dominion: "Spoils of Dominion"
 okoeruara_spoils_of_dominion_desc: "While many nations in Sahila have a strong noble class, which provides warriors to the state when needed, the merchant and clergy classes in Okoeruara provide many trained warriors as well. Due to the royal promise, the share of spoils from war are directly tied to contribution to war, creating competition and desire for all estates to maintain retinues of skilled soldiers. Once the spoils were divided, the responsibility of transitioning the former administrations and laws into Kinian was put on priests, merchants and nobles alike."
 okoeruara_knives_of_ilunla: "Knives of Ilunla"
 okoeruara_knives_of_ilunla_desc: "On the outskirts of the city of Ilunla lies an inconspicuous clay barracks, thought abandoned due to greenery consuming its outer walls. However, once inside, vibrant designs and tribal colours are revealed decorating the walls and ceiling. Acting as the main headquarters of the Knives of Ilunla, an illusive warrior order, it trains the affluent and destitute alike in close quarter knife combat.\n\nEach member must have proved themselves in wars, and were directly recruited by the master of the order himself. Once they subjected themselves to training with other elite warriors, and showed their prowess, they were gifted ceremonial knives made personally for them, with intricate designs of ivory and animal skins, weapons that they would take into wars to come."
 okoeruara_unquenched_flames: "Unquenched Flames"
 okoeruara_unquenched_flames_desc: "To maintain such a vast, populous kingdom, it had to be ingrained in the people's minds that rebellion is not even an idea to be tolerated. In Karaye, a large host of Zoa rebels captured a fort and held hostages from the royal family in an attempt to declare their tribe independent. Filled with rage, King Kpasse gathered his armies to siege the fort, vowing to leave no survivors.\n\nVictorious, he kept his promise and slew every rebel, while also dealing heavy damage to the fort, saving all but one of his family members, his daughter. He then rode to each village that had risen up in Geran, burning them all to the ground, leaving a graphic example of what rebellion against him and his descendants will always look like."
