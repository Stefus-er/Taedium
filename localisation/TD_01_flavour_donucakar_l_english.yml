l_english:
 donucakar_ideas: "Donuçakari Ideas"
 donucakar_ideas_start: "Donuçakari Traditions"
 donucakar_ideas_bonus: "Donuçakari Ambition"
 donucakar_last_bastion: "The Last Bastion"
 donucakar_last_bastion_desc: "In 1440, heir to the throne, prince Mahzun, organized a raiding campaign the Gormadi land with the purpose of gathering support against chilverchian marches, trying to make use of their exhaustion from the battle of Matliman. The campaign was massively unsuccessful and, on top of that, after weeks of fighting and marching, often without proper supplies, many started to desert. Ultimately Donucian forces were completely wiped out by Chilverchians, just a day's march away from the border city of Kanlabi. Later king Altan Alparslanoglu was forced to trade the stronghold for the body of his deceased son.\n\nNow, at our most fragile, we have to be prepared for the worst."
 donucakar_king_and_the_princess: "The King and the Princess"
 donucakar_king_and_the_princess_desc: "Since 1215 Donuçakar has been a member of the Sigilian community, thanks to the marriage between king Taylan Alparslanoglui and princess Cynehild Aretberg. This ended not only Merhaanic practices and raids eastern Empire, but also reinforced Confinia as a bulwark of Sigilianism in the east.\n\nFrom that point onwards Silvestrine emperors tried to keep good relations with Donucian rulers and often even proposed for them to join the empire, but kings of Donuçakar refused, wishing to maintain their independence."
 donucakar_donucian_legacy: "Donucian Legacy"
 donucakar_donucian_legacy_desc: "Sometimes people ask themselves 'How did that Anavatic tribe migrated all the way to Confinia?'. The answer is simple - by conquest. It was a time of Pamkusean and Zakarturi weakness which conflates with an era of great migrations, which forced Donucian people to settle in a new land."
 donucakar_ostsee_competition: "Lacerian Merchants"
 donucakar_ostsee_competition_desc: "For most of our medieval period, trade in the Ostsee was dominated by merchants from the Empire - Ostemerians had majority of their ports and assets in the north, while Revorians controlled the southern part of the sea, including Donuçakar. While Cadiziero technically paid tithe to our king at that time, the local families were wealthy enough to monopolize trade in our lands; most Donucian nobles either cooperated willingly, or were forced to sell their goods to Revorians.\n\nThis has changed with the efforts of king Taylan the Old, who not only weakened the power of Revorians in the country, but established a powerful merchant caste in the kingdom."
 donucakar_meritocratic_military: "Meritocratic Military"
 donucakar_meritocratic_military_desc: "Harsh times create strong men, as they say. And many of those men are not part of the noble estate, which for the most part dominated the military. This has led to our rulers to abolish standard noble militias and titles based on loyalty to instead turn our military into a proper force, made out of professional officers and engineers."
 donucakar_yanlan_monasteries: "Entrenched Clergy"
 donucakar_yanlan_monasteries_desc: "Even before the arrival of Donucians in Confinia there was a flourishing Saelian community, borders between sigilianism, sacellianism and eneratianism were blurry and hard to determine. Sacellist and eneratian branches were dominant, however in some towns fortified monasteries served as hotspots of sigilianism; these forts were later used by locals to defend from Anavatic, Donucian and Bunelisuli raids, allowing for sigilian community to maintain relatively the same population through the turbulent period. After our ascension into sigilianism this also allowed sigilian clergy to keep a lot of their power and seize large swats of land, previously owned by the eneratians and sacellists."
 donucakar_bulwark_of_sigilianism: "Bulwark of Sigilianism"
 donucakar_bulwark_of_sigilianism_desc: "Prayers of our monks and cowardice of our nobles aren't known to be an effective way of dealing with a powerful military threat and without much more drastic measures taken we would have surely fallen. We will no longer wait in our fortressess for Chilverchian sieges; we have to take battle to their territory. Through methodic advances we will push the border of Sigilian world forward at all cost - after all offense is the best defense."

 sugilin_kingdom_reform: "Sügilin Kingdom"
 sugilin_kingdom_reform_desc: "Open-arms approach to the new faith of Saelianism in early history of Donuçakar has led to the strengthened position of the clergy."

 estate_nobles_kanlabi_defeatism: "Kanlabi Defeatism"
 estate_nobles_kanlabi_defeatism_desc: "After staggering defeat in the Kanlabi fields our nobility fears any incoming encounter with the enemy."
 DON_newfound_confidence: "Newfound Confidence"
 desc_DON_newfound_confidence: "The nobles finally see hope in our future - our enemies will tremble before us."
 has_won_kanlabi_tt: "Has won a battle in §YKanlabi§!"

 armed_monasteries_reform: "Armed Monasteries"
 armed_monasteries_reform_desc: "In order to protect our kingdom from neighboring heathens, every monastery will be trained to autonomously defend themselves."
 gov_militarized_churches: "Militarized Churches"
 desc_gov_militarized_churches: "Sacred places in this province have been militarized to effectively fight back against invaders."
 mechanic_military_churches_attribute_yes: "Temple buildings now grant §YLocal Hostile Attrition§! and §YLocal Manpower Modifier§!."

 beyaz_dedalerarden_mod: "Beyaz Dedalerarden"
 desc_beyaz_dedalerarden_mod: "Distinguished drink from Dedalerar is a very sweet kind of white wine, popular even among the picky burghers of Revoria."