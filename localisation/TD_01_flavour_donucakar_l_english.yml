l_english:
 donucakar_ideas: "Donuçakari Ideas"
 donucakar_ideas_start: "Donuçakari Traditions"
 donucakar_ideas_bonus: "Donuçakari Ambition"
 donucakar_last_bastion: "The Last Bastion"
 donucakar_last_bastion_desc: "In 1440, heir to the throne, prince Mahzun, organized a raiding campaign the Gormadi land with the purpose of gathering support against chilverchian marches, trying to make use of their exhaustion from the battle of Matliman. The campaign was massively unsuccessful and, on top of that, after weeks of fighting and marching, often without proper supplies, many started to desert. Ultimately Donucian forces were completely wiped out by Chilverchians, just a day's march away from the border city of Kanlabi. Later king Altan Alparslanoglu was forced to trade the stronghold for the body of his deceased son.\n\nNow, at our most fragile, we have to be prepared for the worst."
 donucakar_king_and_the_princess: "The King and the Princess"
 donucakar_king_and_the_princess_desc: "Since 1215 Donuçakar has been a member of the Sigilian community, thanks to the marriage between king Taylan Alparslanoglui and princess Cynehild Aretberg. This ended not only Merhaanic practices and raids eastern Empire, but also reinforced Confinia as a bulwark of Sigilianism in the east.\n\nFrom that point onwards Silvestrine emperors tried to keep good relations with Donucian rulers and often even proposed for them to join the empire, but kings of Donuçakar refused, wishing to maintain their independence."
 donucakar_donucian_legacy: "Donucian Legacy"
 donucakar_donucian_legacy_desc: "Sometimes people ask themselves 'How did that Anavatic tribe migrated all the way to Confinia?'. The answer is simple - by conquest. It was a time of Pamkusean and Zakarturi weakness which conflates with an era of great migrations, which forced Donucian people to settle in a new land."
 donucakar_ostsee_competition: "Lacerian Merchants"
 donucakar_ostsee_competition_desc: "For most of our medieval period, trade in the Ostsee was dominated by merchants from the Empire - Ostemerians had majority of their ports and assets in the north, while Revorians controlled the southern part of the sea, including Donuçakar. While Cadiziero technically paid tithe to our king at that time, the local families were wealthy enough to monopolize trade in our lands; most Donucian nobles either cooperated willingly, or were forced to sell their goods to Revorians.\n\nThis has changed with the efforts of king Taylan the Old, who not only weakened the power of Revorians in the country, but established a powerful merchant caste in the kingdom."
 donucakar_meritocratic_military: "Meritocratic Military"
 donucakar_meritocratic_military_desc: "Harsh times create strong men, as they say. And many of those men are not part of the noble estate, which for the most part dominated the military. This has led to our rulers to abolish standard noble militias and titles based on loyalty to instead turn our military into a proper force, made out of professional officers and engineers."
 donucakar_yanlan_monasteries: "Entrenched Clergy"
 donucakar_yanlan_monasteries_desc: "Even before the arrival of Donucians in Confinia there was a flourishing Saelian community, borders between sigilianism, sacellianism and eneratianism were blurry and hard to determine. Sacellist and eneratian branches were dominant, however in some towns fortified monasteries served as hotspots of sigilianism; these forts were later used by locals to defend from Anavatic, Donucian and Bunelisuli raids, allowing for sigilian community to maintain relatively the same population through the turbulent period. After our ascension into sigilianism this also allowed sigilian clergy to keep a lot of their power and seize large swats of land, previously owned by the eneratians and sacellists."
 donucakar_bulwark_of_sigilianism: "Bulwark of Sigilianism"
 donucakar_bulwark_of_sigilianism_desc: "Prayers of our monks and cowardice of our nobles aren't known to be an effective way of dealing with a powerful military threat and without much more drastic measures taken we would have surely fallen. We will no longer wait in our fortressess for Chilverchian sieges; we have to take battle to their territory. Through methodic advances we will push the border of Sigilian world forward at all cost - after all offense is the best defense."

 sugilin_kingdom_reform: "Sügilin Kingdom"
 sugilin_kingdom_reform_desc: "Open-arms approach to the new faith of Saelianism in early history of Donuçakar has led to the strengthened position of the clergy."

 estate_nobles_kanlabi_defeatism: "Kanlabi Defeatism"
 estate_nobles_kanlabi_defeatism_desc: "After staggering defeat in the Kanlabi fields our nobility fears any incoming encounter with the enemy."
 DON_newfound_confidence: "Newfound Confidence"
 desc_DON_newfound_confidence: "The nobles finally see hope in our future - our enemies will tremble before us."
 has_won_kanlabi_tt: "Has won a battle in §YKanlabi§!"

 armed_monasteries_reform: "Armed Monasteries"
 armed_monasteries_reform_desc: "In order to protect our kingdom from neighboring heathens, every monastery will be trained to autonomously defend themselves."
 gov_militarized_churches: "Militarized Churches"
 desc_gov_militarized_churches: "Sacred places in this province have been militarized to effectively fight back against invaders."
 mechanic_military_churches_attribute_yes: "Temple buildings now grant §YLocal Hostile Attrition§! and §YLocal Manpower Modifier§!."

 beyaz_dedalerarden_mod: "Beyaz Dedalerarden"
 desc_beyaz_dedalerarden_mod: "Distinguished drink from Dedalerar is a very sweet kind of white wine, popular even among the picky burghers of Revoria."

 liberate_rural_elites: "Liberated Rural Elites" #£shield_DON£
 liberate_rural_elites_desc: "Our nobles have always been seen and have seen themselves as free spirits. By reinforcing their desires, we can bring order to the countryside much easier than we could have done ourselves."

 decision_rebuild_boreticay_title: "Rebuild Boretiçay"
 decision_rebuild_boreticay_desc: "Boretiçay was once an important port of Gormadi in the Panourgian Sea, used to secure their mercantile interests in the region. If we want to compete, we will have to restore the ruins."

 estate_burghers_haklar_bildirgesi: "Haklar Bildirgesi"
 estate_burghers_haklar_bildirgesi_desc: "The Haklar Bildirgesi contains all the rights and privileges of Revorian merchants in our country. While Cadiziero technically pays tithe to Donucakar, this document allows powerful families to monopolize donucian trade; most donucian nobles either cooperate willingly or are forced to sell their goods by the law."

 donucakar.1.t: "Kanlabi Humiliation"
 donucakar.1.desc: "The First half of the 15th century was a harsh period for eastern Mysentria. Merciless Bunelisuli raids raided Chilverchian and Camarian lands. Even despite defeating the nomads in 1432, various warlords kept the raids well into the 1430s.\n\n Trying to make use of Chilverchian exhaustion from the battle of Matliman, prince Mahzun's organized a raiding campaign in 1440 the Gormadi land with the purpose of gathering support against the marches. The campaign was massively unsuccessful - getting supplies was difficult and most locals didn't want to cooperate, seeing Donucian forces as another invader. A few months into the campaign morale was rapidly falling, and, even despite prince's fiery speeches, many began to desert. Ultimately donucian forces were completely wiped out by chilverchians on 6th of march 1443, just a day's march away from the border city of Kanlabi.\n\nThe chilverchians knew king Altan Alparslanoglu would do anything for the body of his son. The Duke of Arsènoux proposed an exchange - the body for the stronghold of Kanlabi; the king complied, losing the last seat of power of once powerful kingdom of Gormad. The Humilation made our nobles craven and unloyal, while the clergy expects us to take action against the heretics. Sitting Between a hammer and an anvil, Altan Alparslanoglu must find a solution to save the kingdom."
 donucakar.1.a: "Sal giveth and Sal taketh away"

 donucakar.2.t: "Academia Astronomica"
 donucakar.2.desc: "The Astronomical Academy of [don_aca_ast_et.GetName] was founded a group of Dagollian scholars and students seeking exile following persecutions in the Chilverchian lands. The academy is often named 'The Cristante Academy', which is attributed to the great investments of the Makenarinian oligarchic family of Crisantes.\n\nNotable is not only the history of the academy, but also its building. The tower of the Grand Observatory is one of the tallest sacral structures in the city, allowing for unobstructed view of the sky and astronomical observations.\n\nStudents of the Academy often leave the country after finishing the education, spreading our renown throughout the lands. Many voices in the court suggest to offer patronage to the academy and its disciplies, keeping the knowledge within the court."
 donucakar.2.a: "I wonder, what is the moon made out of?"
 donucakar.2.b: "We should seek to invest in the young minds."
 don_academia_astronomica: "Supporting Academia Astronomica"
 desc_don_academia_astronomica: "Through our investment, we can expect the academia to produce bright minds to fill our court."

 donucakar.3.t: "New Septentran Canal"
 donucakar.3.desc: "'Thanks to accounts of elder seamen from [787.GetName], we know that Septentran Minor prior to its adjustments had a length of no more than one Camarian Stadium, with depths never allowing for anything bigger than a twenty crew cog during springtime...\n\n...The construction of the canal commenced in 1578, as part of the royal expansion of then village Gaklama. The project was put forward under the watchful eye of a trusted Niftlander engineer, Hubrecht van Grootmoer,...\n\n...and despite those delays, the canal was finished in time for queen's Esin birthday...\n\n...As of year of our lord, the Esinian Canal has a daily throughput of almost thirteen and a half million agirli, greatly accelerating the growth of the bustling Gaklama.'\n\nExcerpts from 'The accounts of the Dutissimian Ventures' by an Argenian ambassador to the [Root.GovernmentName] of [Root.GetName]." #agirli is around 0,32kg
 don_new_septentran_canal: "Septentran Canal"
 desc_don_new_septentran_canal: "The river Septentra has been widened between lake Marvirida and Lacerian sea in order to more easily transfer goods and better shelter ships docked in [787.GetName]."
 donucakar.3.a: "This will strengthen our position in the western sea."
 donucakar.3.b: "I know a guy who could do it cheaper..."
 donucakar.3.c: "Maybe another time."
 donucakar.3.c_tt: "Unlock §YConstruct the New Septentran Canal§! decision."
 decision_don_new_septentran_canal_title: "Construct the New Septentran Canal"
 decision_don_new_septentran_canal_desc: "The river Septentra needs to be widened between lake Marvirida and Lacerian sea in order to more easily transfer goods and better shelter ships docked in [787.GetName]."

 donucakar.4.t: "A Hymn to the Steppe"
 donucakar.4.desc: "The great epic of 'Bozkira Bir Ilahi' was written across twenty years by none other than Kara Uçesi. Born as the youngest son of a Yanlan noble, Kara managed to achieve clerical education and venture east, attempting to learn from the Zakarturi masters. After his return, he spent rest of his days as a monk, writing his great work, finishing just months before his death.\n\nThe work is compromised of 58 poems, representing 58 years of Alpan's life. The first two of three books follows the mythological history of Donucians. Final poems show donucians losing that divine spark as they became more sedentary, chained to land and duty. Praised for its flowery style and likening the life on the steppe to a divine way of being, the collection solidified itself as one of the most culturally influential works of the period."
 donucakar.4.a: "Sing me a song, O' great Sazanda..."

 donucakar.5.t: "A War of Grapes"
 donucakar.5.desc: "Beyaz Dedalerarden has been a staple of our cultural exports for a long time. Its sweet and light taste makes it popular even among the picky Camarians. They only market we haven't been able to break through is obviously Chilverchia. Thankfully, relentless efforts of our landowners and merchants accompanied by our recent diplomatic and military victories made Chilverchians try our ambrosia. Now the elites are slowly embracing our wine, which is becoming a popular drink of choice at balls and during celebrations."
 donucakar.5.a: "War of grapes is the most brutal kind of war."
 donucakar.5.a_tt1: "Every owned wine-producing province:"
 donucakar.5.a_tt2: "Every Chilverchian country:"
 don_wine_boom: "Growth of Wine Industry"
 desc_don_wine_boom: "Thanks to our efforts, Donucian wine is sold across the continent. Even some Chilverchians secretly buy our produce."
 don_wine_compromitation: "Grape Humiliation"
 desc_don_wine_compromitation: "The nasty Donucians have decided to open a new front of war - a war of grapes."

 donucakar.6.t: "Metin the Second"
 donucakar.6.desc: "Born as a son of a Madavian merchant, from a very young age Metin could experience different cultures of the world.After reaching adulthood, he became a student of a Camarian painter Sergio Arete. There, in Fiburia, he was often painting battle scenes. After returning to his home country, he started making his signature duel paintings. These works were fought over by Revorian merchants and Donucian nobles. Soon a saying started going around that one could know the outcome of the painted battle through visual cues."
 donucakar.6.a: "What a brilliant artist!"

 donucakar.7.t: "Dogukan Amreoglu"
 donucakar.7.desc: "There were but a few men as brilliant and disciplined as Dogukan. Upbringing in a wealthy noble family with military tradition and education in the imperial military academy allowed him to accumulate great amounts of tactical and strategic knowledge. He put a great emphasis on discipline and learning in the army, putting his soldiers on massively repetetive and sometimes pointless tasks for the sole purpose of cramming obedience into every single man."
 donucakar.7.a: "He'll make a great advisor."
 donucakar.7.b: "Send him to drill the troops directly!"

 donucakar.8.t: "Chilverchian Knight Captured"
 donucakar.8.desc: "During the chase following the recent battle, we have managed to capture an important knight in the service of [From.GetName]. Despite his apparent fervour, our spies are convinced, he could be persuaded to join our ranks at a price."
 donucakar.8.a: "His shield will look great above the fireplace."
 don_chilverchian_knight_captured: "Chilverchian Knight Captured"
 donucakar.8.b: "Convince him to convert"

 donucakar.9.t: "The Great Akeni Uprising"
 donucakar.9.desc: "Tensions with the locals in southern Dutissim have been slowly increasing in the last few years. Our efforts to cull the local banditry and secure supply routes through frequent village raids and searches have led many locals to resist the army. The situation has finally boiled over leading to a widespread uprising."
 donucakar.9.a: "Crush them!"

 donucakar.10.t: "The Quincentenary"
 donucakar.10.desc: "In 1131, history of our people changed with the birth of the great Alparslan the Wolf. Being a son of a powerful horde leader in the steppe neighbouring Zakarturi Empire has made him acquinted with the ways of war and raiding since a very young age; by age fifteen he could beat any adult man in archery or horse riding. He inherited the throne at the age of 17 and then spent next 4 years consolidation and allying neighbouring clans. In 1150 he rode along Kidinare west, to a supposed land of milk and honey.\n\nAccording to the 'Chronicle of All History' by Yilmaz Hiç, when crossing the Matliman Isthmus there were four clans accompanying Alparslan: Donucians, Yanlans, Gormadi and Yese. When the leader of the Yese, the wicked Tarkan, challenged Alparslan to a duel and lost, our soon-to-be king ordered to kill every man and take every woman of Tarkan's clan. Tribe of Yese was no more, and Alparslan ruled to the end of his days unbothered by challengers as the sole king of Confinia.\n\nAlmost half a millenium has passed since these events and people still praise Alparslan's name. Festivals are raging across the countryside and people seem not to care about their regular struggles, at least for today."
 donucakar.10.a: "Five hundred years really is a long time."
 donucakar.10.b: "We will ride once again, just as he did in his days!"

 donucakar.11.t: "Dugay the Silent"
 donucakar.11.desc: "...\n\n...\n\n...?"
 donucakar.11.a: "..."
 donucakar.11.b: "..."

 donucakar.12.t: "Alperen of Geyik Dagi"
 donucakar.12.desc: "Alperen has been known as a great fortification expert for some time thanks to his efforts abroad, mostly in the Saelian Empire. Now he has returned to his homeland and is offering his services."
 donucakar.12.a: "Order him to construct us a great fortress!"
 donucakar.12.a_tt: "Next constructed or upgraded §YDefense§! building will have 25% of its base cost refunded. It will also provide the province with permanent §G+20.0%§! defensiveness."
 donucakar.12.b: "He'll make a great advisor."
 don_alperen_fortress: "Alperen Fortress"
 desc_don_alperen_fortress: "Thanks to the efforts of the great Alperen, this province is heavily fortified."