 bhajsaya.1.t: "Bargain with Gods"
 bhajsaya.1.desc: "Trying to Bargain, Pray, or any other way of achieveing something from deities is a integral part of Bhajsayan faith. Our ruler has decided to try to Bargain with [Root.Monarch.GetHerHim] chosen deity. What would we like to give in exchange?"
 bhajsaya.1.a: "Offer Prayers"
 bhajsaya.1.b: "Offer Wealth"
 bhajsaya.1.c: "Offer Life Force"
 bhajsaya.1.d: "Offer a Human Life"
 bhajsaya.1.e: "Offer many human lifes.."
 bhajsaya.1.f: "I need more time to think that through..."
 bhajsaya.2.t: "Human Sacrifice"
 bhajsaya.2.desc: "We have decided to Offer a human life to our deity, who shall we sacrifice on the altar?"
 bhajsaya.2.a: "Our beloved Heir"
 bhajsaya.2.b: "Our beloved Consort"
 bhajsaya.2.c: "One of our Advisors"
 bhajsaya.2.d: "One of our Colonists"
 bhajsaya.2.e: "One of our Diplomats"
 bhajsaya.2.f: "One of our Missionaries"
 bhajsaya.2.g: "One of our Merchants"
 bhajsaya.2.h: "On the other hand.. maybe we should offer something else?"
