l_english:
 dabba_ideas: "Dabban Ideas"
 dabba_ideas_bonus: "Dabban Ambition"
 dabba_ideas_start: "Dabban Traditions"
 dabba_last_stand_of_tsipus: "The Last Stand of the Tsipus'"
 dabba_last_stand_of_tsipus_desc: "The Gorteit clan from Rakagel relentlessly conquered Dabban cities for the past century. Seeing the opportunities this provided, great Madugu Tsipus consolidated the lands, from the highlands of Rana to great cities in the north. People of Dabba quickly learned, that only those loyal to Tsipus will survive."
 dabba_legacy_of_saghat: "Legacy of Saghat"
 dabba_legacy_of_saghat_desc: "Saghat the wise is considered the mother of all Dabban clans. According to the legend, she born as a servant in Kassenji, however quickly rose in ranks thanks to her ability to interpret dreams and see spirits of the dead. The court started to fear her influence, so she was exiled with all of her followers."
 dabba_coraka_mountain: "Coraka"
 dabba_coraka_mountain_desc: "When Saghat arrived in these lands, she searched for a new place to call home. She had a vision of a great city in the southern highlands, glowing brighter than every other city in the world. This place was located at the Coraka mountain, and despite becoming a ruin, it remains a site of many pilgrimages."
 dabba_tsibirini_rebirth: "Tsibirini Rebirth"
 dabba_tsibirini_rebirth_desc: "Alas the gods have once again blessed us with a time of prosperity! With cities being brought back from ruin, temples refurbished and border protected by our brave horsemen we can look towards an even brighter future"
 dabba_woven_horses: "The Woven Horse"
 dabba_woven_horses_desc: "Our brave cavalrymen, the Lifidi, were crucial in our forays into enemy territory and even now, in the age of gunpowder, they are useful at breaking enemy lines."
 dabba_back_in_bussiness: "Back in Bussiness"
 dabba_back_in_bussiness_desc: "We were once known as the nation of traders and travellers far and wide, even beyond the sea, however the Braissli traders quickly took advantage of our weakness and even attempted to subjugate us. We have to return to our roots and retake our legacy and position in the region."
 dabba_parroutan_scourge: "Scourge of Parrout"
 dabba_parroutan_scourge_desc: "The tables have turned. Decades of mismanagement turned our opressors into a walking corpse of a state, while we enriched ourselves and persevered through our dark age. Now we will unleash our grudge, repaying them for all the suffering tenfold."