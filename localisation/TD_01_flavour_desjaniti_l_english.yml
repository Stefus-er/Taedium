 desjaniti_home_of_deva: "Home of Deva"
 desjaniti_home_of_deva_desc: "This province is a place where person who ascended to Desjaniti Godhood was born, and is considered sacred by Desjaniti faith."
 desjaniti_home_of_last_deva: "Home of Last Deva"
 desjaniti_home_of_last_deva_desc: "This province is a place where last person who ascended to Desjaniti Godhood was born, and is considered the most sacred by Desjaniti faith."
 
 
 desjaniti.101.t: "Pakapujari conflict with Nobility"
 desjaniti.101.desc: "The Pakapujari have gone into conflict with the Nobility, beacuse the latter has forced them to stop spreading the teachings of Sacred Desjaniti Faith beacuse, as they said, `It will make peasants not want to work`. It is up to us to decide this conflict."
 desjaniti.101.a: "Support Pakapujari"
 desjaniti.101.b: "Support Nobility"
 TD_Desjaniti_supported_pakapujari: "Supported Pakapujari in conflict with Nobility"
 desjaniti.102.t: "Peasantry and matter of Teachings"
 desjaniti.102.desc: "Nobility, as always, wants to keep Peasantry in check, and to not anger the Pakapujari, they have stopped the peasants from ever arriving at the spot of the Pakapujari lessons. Some of the Peasants that made it through have filed a complaint to the Pakapujari, and it is up to us to resolve this conflict."
 desjaniti.102.a: "Support Nobility"
 desjaniti.102.b: "Support Peasants"
 desjaniti.103.t: "Pakapujari conflict with Sarvoccapakapujari"
 desjaniti.103.desc: "Sarvoccapakapujari, the Person who rules the Bhahanian state, either if he is a Deva or not, sometimes go into conflict with Pakapujari, and it has happened this time again, over a rather mundane topic during a debate. Should we support the Pakapujari stance, or stay loyal to the Sarvoccapakapujari?"
 desjaniti.103.a: "Support Pakapujari"
 desjaniti_opposed_pakapujarirajya: "Opposed Sarvoccapakapujari"
 desjaniti.103.b: "Support Sarvoccapakapujari"
 desjaniti.104.t: "Faithful Makes a donation"
 desjaniti.104.desc: "A Local Faithful person of unknown origin has appeared at our court, and gave us a Donation in spirit that we need to share our wealth with those in need, even if those in need are the rulers of local states."
 desjaniti.104.a: "Accept it"
 desjaniti.104.b: "Donate it to the poor"
 desjaniti.105.t: "Pakapujari questions legitimacy of our ruler"
 desjaniti.105.desc: "Pakapujari, after a heated conflict with our [Root.Monarch.GetHerHisCap] has started to question if we are even legitimate to rule over this land according to the Desjaniti rules."
 desjaniti.105.a: "Embrace the reputation!"
 desjaniti.105.b: "It is what it is.."
 desjaniti.106.t: "Spread of Forgein Ideals"
 desjaniti.106.desc: "REPLACE_ME when 1.1 hits."
 desjaniti.106.a: "It will blow over.."
 
 grand_desjaniti_temple: "Bhamatha"
 grand_desjaniti_temple_desc: "Bhamatha is one of seven grand Desjaniti temples that are holy sites native to this faith."
 
 desjaniti.201.t: "The Decay of Bhamatha"
 desjaniti.201.desc: "The Bhamatha of [desjaniti_bhamatha_et.GetName] is falling into state of disrepair, and Pakapujari call us to help them fund the repair costs of this prestigious temple of our faith."
 desjaniti.201.a: "Repair it"
 desjaniti.201.b: "Leave it be"
 TD_Desjaniti_decaying_temple: "Decaying Bhamatha"
 desjaniti.202.t: "Conflict at Bhamatha"
 desjaniti.202.desc: "The Pakapujari priests at [desjaniti_bhamatha_et2.GetName] Bhamatha had a debate, which became an almost physical conflict, with more Radical Pakapujari arguing that the Traditionalists are gonna bring the Desjaniti faith to certain doom. Whose side should we pick?"
 desjaniti.202.a: "Support Radicals"
 desjaniti.202.b: "Support Traditionalists"
 desjaniti.202.c: "Support neither side"
 
