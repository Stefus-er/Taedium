 desjaniti.302.t: "Edict of Holy Introspection"
 desjaniti.302.desc: "The Holy [BHA.Monarch.GetHerHisCap] of [BHA.GetName] has proclaimed an Edict of Holy Introspection, which is the traditional to Desjaniti faith way of telling every faithful that they should abstain from violence, and rethink their life choices."
 desjaniti.302.a: "Well, we gotta reschedule that war"
 desjaniti.303.t: "Unjust war with Pakapujarirajya"
 desjaniti.303.desc: "We are at war with the holy [BHA.Monarch.GetHerHisCap] of [BHA.GetName], and since they proclaimed the Edict of Holy Introspection, they, and all of Desjaniti's Pakapujari, call to us to cease our hostility towards [BHA.GetName]."
