 pakapujarirajya_designate_sinner_title: "Ostracize Ruler"
 pakapujarirajya_designate_sinner_tooltip: "Designate the ruler of this country as a grave sinner, hurting their stability and diplomacy."
 pakapujarirajya_designate_sinner_desc: "At the cost of §R10§! devotion, we will designate the ruler of target country a grave sinner, which will result in mutual §R100§! opinion loss.\nAdditionaly, they will gain the suffer the following penalties until the death of their current ruler:\nNational Tax Modifier: §R-10.0%§!\nStability Cost Modifier: §R-15.0%§!\nYearly Prestige: §R-2.00§!\nTolerance of the True Faith: §R-2.00§!\nYearly Legitimacy/Devotion/Horde Unity: §R-0.50§!\nYearly Republican Tradition: §R-0.30§!\nOpinion of Country from others of the same Religion: §R-100§!"
