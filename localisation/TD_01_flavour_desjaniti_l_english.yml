 desjaniti.301.desc: "The Holy [BHA.Monarch.GetHerHisCap] of [BHA.GetName] has released a new teaching, which endorses Agrarianism, and we are all bound by it's new rules that obligate us to stop investing into other, non-agrarian endeavours, like Trade."
