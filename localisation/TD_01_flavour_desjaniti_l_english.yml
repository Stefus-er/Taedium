 guns_of_gsambya: "Guns of Gsambya"
 desjaniti.10.t: "The Makahena Restoration"
 desjaniti.10.desc: "After passing of Ambroise Devata, nobody questioned that they were the living gods, but the ideas they brought with themselves from the west have really destabilized the Maisetra region and Desjaniti faith as a whole. On 10th of October 1688, Man named Ishita has visited the Sacred Court and shown all of the Pakapujari that he has ascended to Godhood, and possesses wisdom unlike any Devata before him. Some belivers have even started thinking that the first Ishita from 15th century has came back from the dead to save Desjaniti Faith from the brink of Revolution."
 desjaniti.10.a: "He shall restore the Pakapujarirajya after the revolutions!"
