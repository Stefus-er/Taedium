 desjaniti.12.t: "The Gsambya Ascension"
 desjaniti.12.desc: "On 15th of April 1726 Anno Imperii, Man named Chanda has been confirmed to be the next Godhood Ascendee, hailing from the province of [3790.GetName]. Chanda Devata has gone in history of Desjaniti as the Devata that has not only shared his cosmic knowledge, but also shown everyone how they can achieve it themselves. Thus, he has revolutionized the Desjaniti faith, making it no longer dependend on Pakapujari-picked Devata's, which has greatly reduced the Pakapujari influence over the faith, and Chanda Devata has gone down in history as `the Last Deva`."
 desjaniti.12.a: "He shall lead the Pakapujarirajya to heavens!"
 desjaniti.12.b: "He will fulfill his mission on this land as an advisor."
