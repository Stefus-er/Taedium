 desjaniti_designated_us_a_grave_sinner: "Designated us a grave Sinner"
 desjaniti.307.t: "Pakapujarirajya designated our ruler a sinner."
 desjaniti.307.desc: "The Holy [BHA.Monarch.GetHerHisCap] of [BHA.GetName] has declared that our [Root.Monarch.GetHerHisCap] has broken the fundamental laws of our faith, and that everyone, including our own subjects, should ostracize us."
 desjaniti.307.a: "Yikes!"
 cb_grave_sinner: "Holy War"
 cb_grave_sinner_desc: "A Holy War against a grave sinner of Desjaniti faith, it is our duty to decimate this internal threat to integrity of our faith!"
 pakapujarirajya_designate_crusade_title: "Declare the Enemy of God"
 pakapujarirajya_designate_crusade_tooltip: "We will call a great holy war against them"
 pakapujarirajya_designate_crusade_desc: "We will declare holy war against target country, which will greatly reduce their opinion of us, and give every Desjaniti country a free Casus Belli on them.\nThis action will cost us §R25§! devotion."
