 desjaniti.9.t: "The Ascension from Afar"
 desjaniti.9.desc: "On 1673, when Devata Jean Paul has passed, he told the Pakapujari on his deathbed that in his infinite wisdom he has forseen that another Devata will come from his Homeland, and only a year has passed, and on 4th of March 1674, a man going by the name Ambroise, has been found by the Pakapujari to be the next Ascendee, and he was invited into the Bhahana's court."
 desjaniti.9.a: "He shall lead the Pakapujarirajya to heavens!"
