 desjaniti.309.desc: "The Holy [BHA.Monarch.GetHerHisCap] of [BHA.GetName] has sent an Envoy to our court as an act of help to their faithful brethren. It is considered one of the biggest honors a Desjaniti state can receive from the Pakapujarirajya."
