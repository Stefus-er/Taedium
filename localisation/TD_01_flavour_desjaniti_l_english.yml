 desjaniti.8.t: "The Ascension from Afar"
 desjaniti.8.desc: "After some time without an Ascension, the Pakapujari started to get worried that something might have severed the Devata Cycle, until on 6th of July 1649 a Forgeiner from a land very far west, that some call Chilverchia, going by the name Jean Paul, has been found by Pakapujari to have the wisdom of someone who ascended to Godhood, so they `invited` him to be the next Devata of Bhahana."
 desjaniti.8.a: "He shall lead the Pakapujarirajya to heavens!"
