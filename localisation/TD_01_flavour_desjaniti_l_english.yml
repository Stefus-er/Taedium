 cb_holy_war_desjaniti: "Holy War"
 cb_holy_war_desjaniti_desc: "A Holy War against external threat of Desjaniti Faith designated by Sarvoccapakapujari of Pakapujarirajya, it is our duty to decimate this external threat!"
