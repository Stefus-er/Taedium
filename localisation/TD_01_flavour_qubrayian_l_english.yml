l_english:
 qubrayian_qubray: "Highest of All"
 desc_qubrayian_qubray: "Qubray, the highest god of water and the patriarch of the Qubrayian Pantheon."
 qubrayian_anulil: "Sea's Wind"
 desc_qubrayian_anulil: "Anulil, spirit of the coastal winds and the sky; wife of Qubray."
 qubrayian_altakar: "Eternal Struggle"
 desc_qubrayian_altakar: "Altakar, chief of the Ribyah people, eternally fighting evil in the afterlife."
 qubrayian_ersakalla: "Lady of Peaceful Death"
 desc_qubrayian_ersakalla: "Eršakalla, ruler of the afterlife, goddess of elders and veterans."
 qubrayian_oyar: "Ritual of the Clean"
 desc_qubrayian_oyar: "Oyar, god of medicine, plants, and soil; son of Qubray."
 qubrayian_kwela: "Flower of Qubray"
 desc_qubrayian_kwela: "Kwela, goddess of animals, marriage and mother of all men; daughter of Qubray."
 qubrayian_masrig: "Mountain Spring"
 desc_qubrayian_masrig: "Mašrig, the great spirit of the mašrig valley and river, defender of the weak."
 qubrayian_annetu: "Wings of War"
 desc_qubrayian_annetu: "Annetu, goddess of battle, blesses those who fight in her name."
 qubrayian_elum: "King of the Faithful"
 desc_qubrayian_elum: "Elum, god of light, and faith, the guiding light of those who follow Him."
 qubrayian_faday: "Wellspring of Prosperity"
 desc_qubrayian_faday: "Faday, god of prosperity and righteousness."
 qubrayian_rasus: "Patron of Scholars"
 desc_qubrayian_rasus: "Rasuš, god of learning and scholars."
 qubrayian_twins: "Twins of Ayina"
 desc_qubrayian_twins: "Ena-Arashwa and Ena-Arakdar, the twin rivers and spirits of the Fawud, children of Ayina, grandchildren of Qubray."
 qubrayian_akka: "Mountain Rapids"
 desc_qubrayian_akka: "Akka, Spirit of the Almurtaf mountains, cradle of rivers, seat of Qubray, and the great builder."
 qubrayian_angwer: "Gilded River"
 desc_qubrayian_angwer: "Angwer, gilded god of banking, jewelry, and commerce."
 qubrayian_darin: "Founder of Lands"
 desc_qubrayian_darin: "Darin, god of newlyweds and civilization, protects those who seek new life."
 qubrayian_haysdu: "Star's Guide"
 desc_qubrayian_haysdu: "Hayasdu, god of trade and the sky, rewards tolerance and shrewdness."

 QUBRAYIAN_DOCTRINES_LONG: "Pantheonic Patrons"
 QUBRAYIAN_DOCTRINES_SHORT: "Patron"
 QUBRAYIAN_DOCTRINES_POWER_NAME: "Church Power"

qubrayian_patron.1.t: "Annetu, Wings of War"
qubrayian_patron.1.desc.1: "Annetu, our winged goddess of war recently had her lands conquered first by the Elumites, then subjugated by the Musarfics. With the reconquest of our once great city of Germusal, we can begin rebuilding and return to the veneration of Annetu."
qubrayian_patron.1.desc.2: "The city of Germusal, once held hostage by the Musarfic heathens, has been returned to Qubrayian hands. We can now venerate the winged goddess properly to recieve her blessing."
qubrayian_patron.1.a: "Praise the Zabayzgad! Praise Qubray!"
qubrayian_patron.2.t: "Elum, King of the Faithful"
qubrayian_patron.2.desc: "The worship of Elum in our nation has increased in our land with our conquest of Kotorat and Mount Galahar. It's worth acknowledging that Elum is no meer lesser god, and reconcile with the monotheists."
qubrayian_patron.2.a: "Elum, alongside Qubray!"
qubrayian_patron.3.t: "Faday, Wellspring of Prosperity"
qubrayian_patron.3.desc: "Faday worship among the Qubrayians was limited to a small minority prior to the conquest of his river. With addition of Faday worshipers from the Nahitaran population and the increase in Qubrayian pilgrims, the niche but important god of prosperity shall be welcomed as one of our primary patrons."
qubrayian_patron.3.a: "The worship of Faday, important once more."
qubrayian_patron.4.t: "Rasuš, Patron of Scholars"
qubrayian_patron.4.desc: "Worship of Rasuš, an already niche deity, had all but been eliminated when the Elumites conquered the estuary of his river. Now that we have liberated Rasuš' estuary, and conquered his most important city, Rasuš has risen from less than a household god, to a staple of the Qubrayian faith."
qubrayian_patron.4.a: "Proof that any god can be great!"
qubrayian_patron.5.t: "Ena-Arashwa and Ena-Arakdar, Twins of Ayina"
qubrayian_patron.5.desc: "The rivers of Ena-Arashwa and Ena-Arakdar, children of Ayina who herself is Qubray's child, flows through the Fawud desert, bringing life to a barren and inhospitable land. The Musarfics do not attribute this blessing to the twins, to only Ayina, with our conquest of the rivers this grevious sin can be rectified."
qubrayian_patron.5.a: "Sin no more!"
qubrayian_patron.6.t: "Akka, Mountain Rapids"
qubrayian_patron.6.desc: "The throne of Qubray and the origin of rivers has long been under the tyranny of the Elumite monotheists of Murtafia, with Akka, the spirit who built the throne, subjugated. While the worship of Akka has always been important, now that the throne owned by Qubrayian hands pilgrimages to it's summit can begin anew."
qubrayian_patron.6.a: "A throne fit for a king!"
qubrayian_patron.7.t: "Angwer, Gilded River"
qubrayian_patron.7.desc: "In the golden fields of Atlada and Debba Kingdoms lives Angwer, greater spirit banking, commerce and jewelry. Now that we control the river, we control its commerce, and can show Angwer proper respect."
qubrayian_patron.7.a: "A perfect land for our Zabayzgad."
qubrayian_patron.8.t: "Darin, Founder of Lands"
qubrayian_patron.8.desc: "The river Darin has been in the heartland of many kingdoms throughout history, most recently Konatar and Socho, however none of these kingdoms could appreciate the prosperity of Darin; they never venerated the river and thusly fell. We shall rectify this and worship the spirit of civilization, as the old kingdoms never had."
qubrayian_patron.8.a: "A spirit shown proper due."
qubrayian_patron.9.t: "Hayasdu, Star's Guide"
qubrayian_patron.9.desc: "Throughout the lands of Diarena the people worship the sky god Hayasdu, this worship comes in two forms, those who worship the sky and those follow his tolerance. We believe that only worshiping one aspect of Hayasdu is folly."
qubrayian_patron.9.a: "A two sided belief, made one."