l_english:
 td_bohemia.1.t: "Deposition of king Pepik"
 td_bohemia.1.desc: "The king is known to be a mad person, often demanding impossible to complete requests only to get bored after they are completed. Recently, he has made a claim that entire nation of bohemia comes from a parallel universe where our continent of mysentria is called 'Europe', the Saelian Empire is called 'Holy Roman Empire' and Kriegerstein is actually called 'Oustria'. He is so sure of his theory, than he now seeks a way to 'return home' and is becoming increasingly dangerous for himself and the entire kingdom. How shall we proceed?"
 td_bohemia.1.a: "His son will take his place."
 td_bohemia.1.b: "If king says it's true, then it MUST be true!"
 
 td_bohemia.2.t: "Battle of Dunkbrunnen"
 td_bohemia.2.desc: "REPLACE_ME"
 td_bohemia.2.a: "This is a Disaster!"
 
 #I'm putting it here due to it being related to insanity of King Pepik
 decision_become_oustria_title: "Proclaim Oustria @AUS"
 decision_become_oustria_desc: "BECOME OUSTRIA, REALIZE BOHEMIAN DREAMS"

 bohemian_ideas: "Bohemian Ideas"
 bohemian_ideas_start: "Bohemian Traditions"
 bohemian_ideas_bonus: "Bohemian Ambition"
 bohemia_bohemian_banking: "Bohemian Banking"
 bohemia_bohemian_banking_desc: "Many great merchant banks of Silvestria have their roots in Bohemia and the kingdom greatly contributed to the growth of banking in the entire continent. The wealthy merchants and landowners built on the experiences of Camarian and Zakarturi bankers to establish a modern banking system in the north."
 bohemia_runga_valley: "Towers of Okrajna"
 bohemia_runga_valley_desc: "The mountain ranges surrounding the bohemian basin have saved the kingdom many times from foreign invasion. Important valleys and corridors are littered with numerous bastions, towers and castles, overviewing the neighboring landscape and greatly improving defensive capabilities of our forces."
 bohemia_imperial_nostalgia: "Imperial Nostalgia"
 bohemia_imperial_nostalgia_desc: "History of Bohemia and the Empire goes as far back as to the times of first emperors. In early medieval period Bohemians were known for their great warriors and often served as auxillaries to regular imperial forces. Bohemian kings slowly expanded their influence, culminating in the election of 1281, where the first zbojaner emperor Ludwig ascended to the imperial throne. Reign of Ludwig and later his two sons is known as the first imperial renaissance, known for the external and internal stability, urbanisation and reinforcment of imperial power."
 bohemia_riches_of_the_earth: "Riches of the Earth"
 bohemia_riches_of_the_earth_desc: "Bohemian basin is a bountiful land with a variety of available resources. Fertile farmlands of river Runga, salt and copper mines of the eastern highland and countless rich cities producing luxury resources like glass and clothing. These riches are sold across the border to our impoverished neighbours, who call only dream of ever attaining the prosperity of Bohemia."
 bohemia_diplomatic_ministry: "Silvestrine Diplomats"
 bohemia_diplomatic_ministry_desc: "Bohemian time as the land of the Emperor has taught the ruling class many things - one of which being the art of diplomacy. Our diplomats often proficiently speak capiran and silvestrine, reducing the need for additional traslation services. In addition, they are also well educated in customs of even small counties. Many diplomatic guides have been written by our scholars and nobles, most of which were translated and shared throughout the continent."
 bohemia_geoberic_trade: "Geoberic Trade"
 bohemia_geoberic_trade_desc: "With the discovery of the New World the global economic center shifted from the Maqitan sea to the Niheyan Ocean. Many nations wish to obtain hantlian and venatian riches - tobacco, cocoa, potatoes, tomatoes, slaves and cotton - all have become a common trading good in bohemian ports. Merchants from all over the country now rush to serve as middlemen between the two worlds and profit from the silvestrine greed."
 bohemia_advanced_taxation: "Royal Tax Collectors"
 bohemia_advanced_taxation_desc: "Despite the large population of Bohemia, tax collection wasn't always very effective, often being unregulated and siphoned by nobles in rural areas and dysfunctional and corrupted in cities. Administrative reforms of king Viktorín have finally put a stop to embezzling. Even after the introduction of the reformed system many have tried to avoid paying taxes and, in most cases, it didn't turn out too good for them, so you better pay up!"

 estate_nobles_armicustos_imperialis: "Armicustos Imperialis"
 estate_nobles_armicustos_imperialis_desc: "Thanks to our long lasting loyalty to the empire, many of the emperors have put their trust in our nobles to secure the borders of the empire and oversee parts of the emperor's army in times of war.\n§YThis privilege will have an additional modifier if we are allied to the current emperor.§!"