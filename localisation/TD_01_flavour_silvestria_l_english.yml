 geoberic_ideas: "Geoberic Minor Ideas"
 geoberic_ideas_bonus: "Geoberic Minor Ambition"
 geoberic_ideas_start: "Geoberic Minor Traditions"
 geoberic_dynastic_elites: "Dynastic Elites"
 geoberic_dynastic_elites_desc: "New rulers who came here from Salia after the formation of Ansgarland were detached from the reality of local Glaser population. Even now, when the peninsula is populated by Geoberic people, they see themselves as distinct and unique enough to justify their elitist rule."
 geoberic_tax_laws: "Customary Tax Laws"
 geoberic_tax_laws_desc: "Laws in these lands were never properly written down, but that doesn't mean that they don't exist. Local population feels obliged to pay taxes to pay for their protection, even if they know that the gold will be spend on expensive banquets."
 geoberic_mountain_resistance: "Mountain Resistance"
 geoberic_mountain_resistance_desc: "Hilly terrain of geoberic peninsula makes it very easy to defend against foreign invader. This is also amplified by the natural resilience of our people."
 geoberic_entrepreneurism: "New World Entrepreneurism"
 geoberic_entrepreneurism_desc: "New world is also known by another name - continent of opportunities. Exotic goods travel across the ocean to our ports, from which we can sell them at much higher prices thanks to the demand and fascination of the unknown. "
 geoberic_industrialism: "Early Industrialisation"
 geoberic_industrialism_desc: "The popularisation of manufactories across the land made our magnates eager to search for more efficient production methods and investments."
 geoberic_clergy_influence: "Independent Clergy"
 geoberic_clergy_influence_desc: "Detachment from the matters of the empire and high popularity of liemarian ideas in our people made every man an independent philosopher and our clergy far more open-minded than those backward sigilians."
 geoberic_nationalism: "Geoberic Nationalism"
 geoberic_nationalism_desc: "As the years go by, the national pride among the burghers and nobility is getting stronger. People no longer identify with their religious community, their Emperor and not even their king - they are only loyal to their own nation."

 kriegerstein_ideas: "Kriegersteiner Ideas"
 kriegerstein_ideas_bonus: "Kriegersteiner Ambition"
 kriegerstein_ideas_start: "Kriegersteiner Traditions"
 kriegerstein_the_warriors_stone: "The Warrior's Stone"
 kriegerstein_the_warriors_stone_desc: "Castle Kriegerstein was built during the IX century and was originally made out of wood, but was rebuilt multiple times. most notably in XIII and XVII centuries. It was named after a legendary Silvestrine noble who had to protect his land against violent northern tribals. The hill was in a perfect place to quickly spot and surprise enemies in the nearby woods. Ever since those days the castle is seen as a symbol of relentless fight for what is yours."
 kriegerstein_magreiner_farmlands: "Magreiner Farmlands"
 kriegerstein_magreiner_farmlands_desc: "Rich and fertile Fluvisols of Magreiner provide not only our people with food, but they are so prosperous that we can export it to other nations inside and outside of the Empire. The most common type of crop is wheat and barley, but growing influx of new world crops plants such as corn made the production more diverse."
 kriegerstein_lichterian_inheritance: "Lichterian Inheritance"
 kriegerstein_lichterian_inheritance_desc: "The events that led up to the prince, and later emperor, Heinrich IV becoming the ruler of duchies of Kriegerstein and Lichter can be tracked down to the marriage of Heinrich II von Kriegerstein and Elizabeth von Scâffurt, which subsequently granted claims to the duchy of Lichter to von Kriegersteins and susbequently - von Schlaufbergs."
 kriegerstein_imperial_crossroad: "Imperial Crossroad"
 kriegerstein_imperial_crossroad_desc: "City of Hegenstadt is where 2 major imperial roads meet: Via Caroli running from Merkast to Dorschau and Via Magreini which stretches from Bohemia to Granlatz. Thanks to many merchants using this roads, the city became a hub of many goods, people, cultures and ideas."
 kriegerstein_lessons_of_mercenary_wars: "Lessons of Mercenary Wars"
 kriegerstein_lessons_of_mercenary_wars_desc: "Mercenary Wars refers to series of conflicts and uprisings during the XVI and XVII century happening mostly in the eastern parts of the Saelian Empire. Caused by strengthened position of mercenary bands following the League of Lippstadt and many civil wars, these wars brought not only mass devastation, but also permanently weakened the empire. Many leaders studied these wars to more effectively fight using modern tactics and technology."
 kriegerstein_permanent_court: "Permanent Court"
 kriegerstein_permanent_court_desc: "In the medieval period the imperial court was not operating in one location. The emperor was constantly on the move living in his vassals' quarters or his own palaces to personally control his subjects. Now through the new policies the court was set in Hegenstadt, in a splendorous palace in the middle of the city to show our power and influence."
 kriegerstein_imperial_court_of_affairs: "Imperial Court of Affairs"
 kriegerstein_imperial_court_of_affairs_desc: "Court of Affairs was a parrarel institution to the regular imperial court which was more focused on the matters of the lands directly under control of the emperor to take some of the burden off of him. It was the first institution of its kind, not only trying to accomodate the needs of nobility and aristocracy, but also poorer merchants and common folk."

 ##SALIA
 salia_ideas: "Salish Ideas"
 salia_ideas_bonus: "Salish Ambition"
 salia_ideas_start: "Salish Tradition"
 salia_land_of_the_gusten: "Land of the Gusten"
 salia_land_of_the_gusten_desc: "Rivers flowing into the Gusten are known for carving deep but also wide riverbeds often used for transporation of goods. This led to most cities forming along those rivers, further increasing their importance."
 salia_salian_baroque: "Salish Baroque"
 salia_salian_baroque_desc: "Turbulent times of the XVI and XVII century in the empire have devastated most of the empire, but luckily most of the conflict happened outside of our lands. Political and religious stability allowed our society to invest in arts, build new churches and prosper."
 salia_salish_knights: "Salish Knights"
 salia_salish_knights_desc: "Salish knights never really were a major military formation but rather a symbol of status and wealth, because only the rich could afford horses and full equipment. Now thanks to increasing wealth and organization of state-funded cavalry they can finally be of use in modern times."
 salia_castles_of_nine_emperors: "Castles of Nine Emperors"
 salia_castles_of_nine_emperors_desc: "Salia is also known as the land of the emperors, due to the fact that the vast majority of Silvestrine emperors came from these regions. Remnants of their once great fortifications still scatter the land and remind us of our past."
 salia_salt_industry: "Salt Industry"
 salia_salt_industry_desc: "Salt is essential to food conservation. Most of the salt on the continent comes from the seawater, but mining it provides a much better yield. Salish and Bohemian salt mines supply not only the empire, but also Camaria and Niftland."
 salia_waldrodung: "Waldrodung"
 salia_waldrodung_desc: "When Saelius conquered these lands they were covered in a dense and almost untraversable forests. The process of deforestation started with the arrival of Saelian colonists and continues to this day."
 salia_embrace_the_nordmarker_model: "Embrace the Nordmarker Model"
 salia_embrace_the_nordmarker_model_desc: "Nordmarker model of military focuses on high drill and discipline of the infantry, but we also adapt it to allow us to use our elite cavalry."
 salia.1.t: "The Knights of Salia Ride on!"
 salia.1.desc: "The knights of our [Root.GovernmentName] are known far and wide, from forests of Marstonia to islands of Arkabil."
 salia.1.a: "Glory to our holy defenders!"
 salia.2.t: "Die Gustenwein"
 salia.2.desc: "The landwalders of Salia are not only amongst the most devout of all Saelians, but also one of the best winemakers in the Empire, often even surpassing the skill of Camarian winemakers. Predominately white, sweet, and acidic, wine from Gusten valley is one of the more popular drinks in most courts of Mysentria."
 salia.2.a: "I hope I can drink more!"
 TD_Knights_of_Salia: "Knights of Salia"
 TD_Bearers_of_the_Saelian_Faith: "Holy Knights of Saelius"
 TD_Die_Gustenwein: "Die Gustenwein"
 salia.3.t: "Expansion of [627.GetName] Mines" #kupfthal
 salia.3.desc: "Influential nobles and landowners of [627.GetName] have come to the [Root.Monarch.GetTitle] to ask for funding. They wish to expand the mining operations in Okrajna mountains and have already made necessary preparations, requiring only approval of the [Root.Monarch.GetTitle] and a small loan."
 salia.3.a: "Let us begin the mining expansions!"
 salia.3.b: "It's not worth it"
 salia.4.t: "[641.GetName] Prospect" #Besigenhof
 salia.4.desc: "New reports are coming from around the town of [641.GetName] that local peasants have discovered a source of iron, sulfur and nickel ore, all of which are important for the purposes of cannonmaking."
 salia.4.a: "We should leave it to the local landowners."
 salia.4.b: "I might just have an idea how to increase the effectiveness of this new mine..."
 salia.5.t: "Prisoners Rise Up"
 salia.5.desc: "The ungrateful miners of [This.GetName] have risen up and now demand to be freed from their service. Their forces are now roaming in the countryside."
 salia.5.a: "Pacify those mongrels!"
 salia.5.b: "This system isn't worth the trouble it causes."
 TD_penal_mine: "Penal Mine"
 desc_TD_penal_mine: "Vast majority of miners in this province have a criminal record, redeeming themselves through inhalation of toxic gasses."
 salia.6.t: "The Salish Mining Rivalry"
 salia.6.desc: "With the opening of the Besigenhof mine, the southern and northern mining complexes have been increasingly competetive towards each other, fighting for influence and funding in the state."
 salia.6.a: "Interesting.."
 TD_Salish_Mining_Rivalry_tt: "The Mines of Besigenhof and Kupfthal will randomly gain and lose base production."
 salia.7.t: "Besigenhof Mine - New Rich Vein Found"
 salia.7.desc: "Recent growth of [641.GetName] has led to local prospectors discovering a new vein of mineable ore."
 salia.7.a: "Excellent!"
 salia.8.t: "Besigenhof Mine - a Tunnel Collapses"
 salia.8.desc: "Rapid and mostly uncontrolled expansion [627.GetName] has led to one of the mining shafts collapsing."
 salia.8.a: "Damnation!"
 salia.9.t: "Kupfthal Mine - New Rich Vein Found"
 salia.9.desc: "Recent growth of [627.GetName] has led to local prospectors discovering a new vein of mineable ore."
 salia.9.a: "Excellent!"
 salia.10.t: "Kupfthal Mine - a Tunnel Collapses"
 salia.10.desc: "Rapid and mostly uncontrolled expansion [627.GetName] has led to one of the mining shafts collapsing."
 salia.10.a: "Damnation!"
 #salia.1.tt: "§YThis is first event in this Salish event chain. If you want to continue the chain, you must Have 75 prestige and 35% Cavalry Fraction in the Age of Reformation.§!"
 salia.12.t: "The Salish Jousting Tradition"
 salia.12.desc: "Despite the fact that the era of knights is giving way to an age of disciplined standing armies, chivalry and tradition of recreational jousting has managed to live on in the lands of Salia."
 salia.12.a: "Chivalry is not dead yet!"
 salia.13.t: "Cavalry Reforms"
 salia.13.desc: "With the Dawn of the 17th century, the era of heavy-armored knighthood and chivalry has definitely come to an end, and even Salia has been forced to adapt; only light cavalry remains in use by modern tactics."
 salia.13.a: "Survival through adaptation"
 salia.14.t: "The Salish-Nordmarker Model"
 salia.14.desc: "With Adoption of both Cavalry reforms and Nordmarker Model, we had managed to create an unique Salish-Nordmarker model of our army that combines both high drill of Nordmarker model and Salish Cavalry Traditions."
 salia.14.a: "Knights of Salia have been reborn!"
 #salia.12.tt: "§YIf you wish to continue the event chain, you must achieve Cavalry Fraction of 40%, reach the age of Absolutism, and have atleast 40% Army Professinalism or 60 Army Tradition, as well as have formed United Salia.§!"
 #salia.13.tt: "§YIf you wish to finish the event chain, you must have atleast 60% Army Professinalism or 90 Army Tradition, and stay as Salia.§!"
 TD_Jousting_Tradition: "The Jousting Tradition"
 TD_Prestige_of_Salish_Jousting: "Salish Chivalry"
 TD_Cavalry_Reforms: "Cavalry Reforms"
 TD_Salish_Nordmarker_Model: "The Salish-Nordmarker Model"
 salia.15.t: "A Sigilian Bastion"
 salia.15.desc: "For centures has Salia nurtured the imperial culture, which has also solidified it as a centre of imperial faith. We shall never strive from the path of loyalty to the emperor, and will always defy the heretics!"
 salia.15.a: "Glory to Salia!"
 salia.16.t: "Salish New World Missions"
 salia.16.desc: "With our Expansion into New World, we should not only focus on conquering, but also enlightening the natives about glory of Saelius."
 salia.16.a: "Fund the missions!"
 salia.17.t: "Sprechtwald Cathedral"
 salia.17.desc: "Sprechtwald Cathedral, which has been in construction since 1337, and it remains the smallest of the electoral cathedrals. Before 1495, the already built part served as a temporary church while Tetrarch lived in the Sprechtwald Castle."
 salia.17.a: "We should finish the Cathedral ahead of time"
 salia.17.b: "Continue at the current pace, we have time"
 salia.18.t: "Gottfried Karl Althus"
 salia.18.desc: "Gottfried Karl Althus was Salish Sigillian Baroque painter, sculptor and architect, who lived between 1567 and 1623. He was mostly known for his sculpture of Emperor Saelius that stands before Sprechtwald Cathedral to this very day. He was also known for being staunch Sigillian, and opposed Liemarianism fierecly."
 salia.18.a: "What a fierce mind, excellent for our court."
 salia.19.t: "Reinmar Auerbach"
 salia.19.desc: "Reinmar Auerbach was one of the creators of modern capitalist thought, and a very known economist in his time. He was born on 1665 in the small salish town of [630.GetName]. He has studied economy at Limstadt University and excelled at it, and has worked his early years in the Old Imperial Mint of [672.GetName], and later he worked as an economist at courts of Saelian Emperor, Ansgarland's Rulers, and finished his carrier with helping Ehrenia to cement their economical domination. He died in 1731 and was buried with honors at the Ehrenstadt's Graveyard."
 salia.19.a: "Hire him this instant!"
 TD_SAL_Sigillian_Bastion: "Sigillian Bastion"
 salia.16.tt: "§YEstablish New World Missions§! privilege will now grant every Sigillian Saelish nation and their colonies §Y+2% Missionary Strenght against Heathens§!."
 salish_fullcav_1_title: "Promote the Salish Knighthood"
 salish_fullcav_1_desc: "The knights of our [Root.GovernmentName] are known far and wide, from forests of Marstonia to islands of Arkabil."
 salish_fullcav_2_title: "Promote the Chivalry"
 salish_fullcav_2_desc: "Despite the fact that the era of knights is giving way to an age of disciplined standing armies, chivalry and tradition of recreational jousting has managed to live on in the lands of Salia."
 salish_fullcav_3_title: "Reform the Cavalry"
 salish_fullcav_3_desc: "With the Dawn of the 17th century, the era of heavy-armored knighthood and chivalry has definitely come to an end, and even Salia has been forced to adapt; only light cavalry remains in use by modern tactics."
 salish_fullcav_4_title: "Establish the Salish-Nordmarker Model"
 salish_fullcav_4_desc: "With Adoption of both Cavalry reforms and Nordmarker Model, we had managed to create an unique Salish-Nordmarker model of our army that combines both high drill of Nordmarker model and Salish Cavalry Traditions."

 prisoner_rebels_title: "Prisoner Rebels"
 prisoner_rebels_desc: "Prisoner rebels rise up a province to break free from the chains, often wishing to escape the country, obtain amnesty or find their own realm."
 prisoners_rebels_demand: "Obtain freedom"
 prisoners_rebels_demand_desc: "The prisoners demand we free them from their punishment. If that demand isn't met, they will simply plunder and live of off our land for as long as possible."
 prisoner_rebels_army: "Prisoner Army"

 SAL_rally_the_knights_title: "Rally the Knights"
 SAL_rally_the_knights_desc: "Hard times are coming. Men abandon their farms to become swords for hire, counts and barons squabble for power and Bohemia once again tries to seize the region. We must gather our forces and show our might."
 TD_Rallied_The_Knights: "Rallied the Knights"
 Salish_Rally_Reward_tt: "Gain permanent claim on every province of §YSalish§! culture."
 Salish_The_Bohemian_Wars_title: "The Bohemian Wars"
 Salish_The_Bohemian_Wars_desc: "Treacherous Bohemians cannot ever be trusted - they will take join any side that will even slightly improve their standing in the empire. Their lack of loyalty will be their demise, as without allies they are powerless to stop us."
 TD_Saelish_Bohemian_Wars: "The Bohemian Wars"
 saelish_won_war_bohemia_tt: "If we defeated §YBohemia§! in the last 100 years:"
 saelish_defeated_bohemia_other_way_tt: "If §YBohemia§! doesn't exist or is our subject:"

 SAL_the_seats_of_power_title: "The Seats of Power"
 SAL_the_seats_of_power_desc: "If one wishes to unite all Salians under one banner, they certainly have to take hold of the great cities of Merkast and Sprechtwald. Their immense influence over the region shaped local politics and economics for many generations, so it is imperative to either take them by force or create a new center of power to overshadow them."
 Saelish_Owns_Merkast_tt: "If we Own Merkast"
 Saelish_Owns_Sprechtwald_tt: "If we Own Sprechtwald"
 Saelish_Developed_Own_Capital_tt: "If we developed our capital to 20 development"
 salia.11.t: "The Future of Capital City"
 salia.11.desc: "With flourishment of the capital city it is time for us to decide the future of this city and it's production."
 salia.11.a: "Glassworks are worth a fortune."
 salia.11.b: "What would we wear if not cloth?"
 salia.11.c: "Paper is the future!"

 SAL_salish_holy_orders_title: "A Call to Service"
 SAL_salish_holy_orders_desc: "Even though almost every county, duchy and castle in Salia holds at least a few zealous knights and courtiers, there have never been an organised holy order like those seen in the Eneratian realms. To strengthen our ranks and prevent the fire from dying out, we need to fund a new order."
 Saelish_Orders_reward_tt: "If we have at least §G+25%§! Cavalry Combat Ability, we will unlock \"§YSaelius Cavalier§!\" Holy Order and additionaly:"
 saelian_cavalier_order_reform: "Holy Cavalier Order of Saelius"
 saelian_cavalier_order_reform_desc: "This order was founded by just and noble knights from across Salia wishing to serve in the name of Saelius with their hoofed companions."
 saelius_cavalier_ho: "Saelius Cavalier Order"
 saelius_cavalier_ho_desc: "This order was founded by just and noble knights from across Salia wishing to serve in the name of Saelius with their hoofed companions."
 Saelish_Orders_reward_tt2: "\nIf we have at least §G+25%§! Infantry Combat Ability, we will unlock \"§YSaelius Paladin§!\" Holy Order and additionaly:"
 saelian_paladin_order_reform: "Holy Paladin Order of Saelius"
 saelian_paladin_order_reform_desc: "This order was founded by the rightful paladins and royal knights of Salia which while too poor to afford horses, were devout enough to serve in the name of Saelius."
 saelius_paladin_ho: "Saelius Paladin Order"
 saelius_paladin_ho_desc: "This order was founded by the rightful paladins and royal knights of Salia which while too poor to afford horses, were devout enough to serve in the name of Saelius."

 SAL_salish_prosperity_title: "Saeleschzeit"
 SAL_salish_prosperity_desc: "With the Gusten valley under our control, we can now focus on solidifying control and expanding production capabilities, to strengthen our guns and appease the elites. This truly is the best time to be Salish!"
 SAL_salish_prosperity_reward_tt: "Every owned province producing either §YWine§!, §Yiron§! or §YCopper§! with at least §Y10§! base production will gain the following modifier:"
 SAL_salish_prosperity_reward_tt2: "If we own the §YGusten Wineyards§! great project, the level will be increased by 1."
 TD_Saelish_Prosperous_Province: "Salish Prosperity"



 ##Felderia
 felderia_ideas: "Felder Ideas"
 felderia_ideas_bonus: "Felder Ambition"
 felderia_ideas_start: "Felder Traditions"
 felderia_zbojaner_integration: "Zbojaner Integration"
 felderia_zbojaner_integration_desc: "Zbojaner people are not only known for their resilience, but also their disdain for outsiders. If we show them that our cultures are bonded together, it will benefit both of us."
 felderia_advanced_forest_exploitation: "Advanced Forest Exploitation"
 felderia_advanced_forest_exploitation_desc: "In the past our people cut down most of the dense forest that was growing in these regions in order to make place for new farmlands. Now we are more considerate and exploit the forest in a much more efficient manner, planting it back if the soil is too barren."
 felderia_renaissance: "Felder Renaissance"
 felderia_renaissance_desc: "Renaissace in these parts is heavily inspired by Capirian architecture. Using their fortresses and castles as inspiration, many local innovations quickly arose."
 felderia_forest_navigation: "Forest Navigation"
 felderia_forest_navigation_desc: "Forests of Bogiland are much more dense than the Felder ones, making it hard for most people to find a way through them. This seemingly bad situation gives us a great tactical advantages over our foes."
 felderia_integration_of_the_kaposnicy: "Integration of Kaposnicy"
 felderia_integration_of_the_kaposnicy_desc: "Kaposnicy were an elite Bogilish cavalry regiment which focused on mobility and sustained damage. Their strength is undeniable and it would be a waste for such a great concept to be abandoned."
 felderia_absolute_centralisation: "Absolute Centralisation"
 felderia_absolute_centralisation_desc: "Small Bogilish lords were always a menace for anyone trying to control these lands. If we want to survive, we need to crack down on their privileges to show them who is really in charge of this nation."
 felderia_royal_munition_manufactories: "Royal Munition Manufactories"
 felderia_royal_munition_manufactories_desc: "Thanks to the large copper, sulfur and salt deposits in these areas we were able to secure large-scale munition manufactories which proved to be greatly beneficial in the development of siege and battle cannons."
 feldersudbulwark_reform: "Feldersüdbulwark"
 feldersudbulwark_reform_desc: "Felder lands of Eben River are an underbelly of the Saelian Empire, and a Frontier against ever expansionist Bogilish Monarchy. We shall unify our lands to brace the upcoming storm of steel and gunpowder, and go with grace into history!"
 felderbundesrepublik_reform: "Felderbundesrepublik"
 felderbundesrepublik_reform_desc: "Felderbundesrepublik is first state with constitution within the Silvestrine land, made to unify warring Felder states under one government to centralise defensive efforts against external threats. The ones with most power within this Federation are Felder Nobles and Felder-Ostemer Merchants."
 merchants_sg: "Merchants"
 merchants_sg_MECHANIC_TOOLTIP: "Merchants"
 nobility_sg: "Nobility"
 nobility_sg_MECHANIC_TOOLTIP: "Nobility"
 felderia.3.t: "The Felder Federation"
 felderia.3.desc: "With the dawn of united Felderia, a new question arises - do we want to rule with the old-fashioned rule of Iron Hand, or should we and adopt a new, federal system of government, where rights of all estates are respected?"
 felderia.3.a: "Glory to the Felderbundesrepublik!"
 felderia.3.b: "We shall remain a [Root.GovernmentName]"
 felderia.4.t: "Wigebert von Preden"
 felderia.4.desc: "Wigebert von Preden was a Felder Sigillian philosopher who lived between 1485 and 1545, and was known mainly for his critique of both of Sigillian Church and Liemarian Reformation, being mostly known for his `Tetrarchy and the Empire` and `47 Theses against Liemar`, and also being active against both corruption in Sigillian Church and spread of those ideas of Liemarianism he was against. He has written himself in Felder history as someone who was neither on the side of the Emperor, Tetrarchy, nor Episcopate."
 wigebert_sigillian_mod: "Wigebert von Preden"
 wigebert_non_sigillian_mod: "Wigebert von Preden"
 felderia.4.a: "Appoint him as state minister!"
 felderia.4.b: "He should do just fine as an Advisor in our court."
 felderia.5.t: "Wenzel Kander"
 felderia.5.desc: "Wenzel Kander was famous Felder painter, sculptor and architect that has lived in the Baroque era, and his most known piece of art are Frescoes in the main hall of Felderpalast of Rogau, and also many of his paintings and Sculptures he contributed to the Rogau City's Collective Collections. He is considered a regional Hero in Rogau, as he helped to rebuild the city after the great fire for free."
 felderia.5.a: "All of Silvestria shall know his works!"
 felderia.5.b: "Offer him a position at our court."
 felderia.5.c: "He should decorate the Felderpalast!"
 felderpalast_mod: "Felderpalast"
 felderia.6.t: "Expansion of Medigrüd Copper Mine"
 felderia.6.desc: "With expansion of our state and the growing need of copper by various lords in the empire, many began to import copper from the mines in Medigrüd. It would be reasonable to expand it - we shall dig deeper and more greedily."
 felderia.6.a: "Excellent Idea!"
 medigrud_mine_mod: "Medigrüd Copper Mine"
 eben_riverbed_group: "Eben Plains"
 felderia.7.t: "Eben Harvest Bountiful!"
 felderia.7.desc: "This year the overflow of Eben river has brought a bountiful harvest, which has resulted in increased production of food in certain areas of our domain."
 felderia.7.a: "Excellent News!"
 eben_harvest_mod: "Eben Overflow"
 desc_eben_harvest_mod: "Eben has exceptionaly Overflowed in this province in recent time, which resulted in increased yield."
 

 silvestrine.1.t: "Great Fire of Rogau"
 silvestrine.1.desc: "While it was expected for a city with predominately wooden architecture to experience occasional fires, no one could have predicted how far and fast it can spread.\nOn [GetDate] Anno Imperii, the city experienced the most destructive fire in Sylvestria of the millenium, which by some estimates razed to the ground 80% of the whole city, only leaving occasional churches and towers standing. Those fortunate souls which have survived the inferno now must find salvation in their city council's grace."
 silvestrine.1.a: "We will Rebuild"
 silvestrine.1.b: "The Vicar will surely help us."
 silvestrine.2.t: "Great Fire of Rogau"
 silvestrine.2.desc: "While it was expected for a city with predominately wooden architecture to experience occasional fires, no one could have predicted how far and fast it can spread.\nOn [GetDate] Anno Imperii, the city experienced the most destructive fire in Sylvestria of the millenium, which by some estimates razed to the ground 80% of the whole city, only leaving occasional churches and towers standing. Those fortunate souls which have survived the inferno now must find salvation in their city council, which have requested our support in order to rebuild the city."
 silvestrine.2.a: "We have to help them"
 silvestrine.2.b: "We Will rebuild Rogau as a baroque city"
 silvestrine.2.c: "We don't have the money"
 silvestrine.3.t: "Athalhart von Lindenberg"
 silvestrine.3.desc: "While the gunpowder technology is quickly developing across the continent, only few nations can manage to gain an edge over their enemies, thanks to the brilliant tacticians, stragetists and military engineers, which are able to effectively apply this new innovation not during the training, but in the battlefield. One of those bright minds is Athalhart of the von Lindenberg dynasty, renowned for his use of siege artillery against the foes, being known for serving in the armies of Frederick II von Schlaufberg during the wars against Bogiland, where he helped to construct fortification in Felderia and breach through the Bogilish citadels with ease."
 silvestrine.3.a: "He will serve in the field"
 silvestrine.3.b: "He will help the high command"
 silvestrine.3.c: "He will be an advisor to our ruler"
 silvestrine.4.t: "Upper Magreina floodings"
 silvestrine.4.desc: "For centuries there were certain places along the river Magreina which were known for periodic floodings and had generally soft soil, which is avoided during construction. However the recent urbanization efforts and have led to many people forced to settle in these areas, to work the land and build new villages, dangerously near the flood terrace. While miry earth is enough of an issue, the year [GetYear] brough the biggest flood of the millenium, causing widespread devastation, taking whole villages down with the stream of the river. Many are now left without homes or a way to sustain themselves, and local princes are seeking salvation for their subjects."
 silvestrine.4.a: "We will rebuild"
 silvestrine.4.b: "Ask the emperor for help"
 silvestrine.5.t: "Upper Magreina floodings"
 silvestrine.5.desc: "For centuries there were certain places along the river Magreina which were known for periodic floodings and had generally soft soil, which is avoided during construction. However the recent urbanization efforts and have led to many people forced to settle in these areas, to work the land and build new villages, dangerously near the flood terrace. While miry earth is enough of an issue, the year [GetYear] brough the biggest flood of the millenium, causing widespread devastation, taking whole villages down with the stream of the river. Many are now left without homes or a way to sustain themselves, and local princes are seeking salvation for their subjects."
 silvestrine.5.a: "We have to help them"
 silvestrine.5.b: "We don't have the money"
 silvestrine.6.t: "Lichterian Uprising"
 silvestrine.6.desc: "Princes and dukes of Lichter always took pride of being the cultural overlords of the middle Magreina. They quickly consolidated the region while it was still considered to be imperial borderlands and held important position in the empire for centuries. Their downfall started with the royal marriage between von Kriegersteins an Scâffurts, ultimately leading to Heinrich IV inheriting both of their duchies. Now they demand more freedoms like they had in the good old days, wishing to once again extert their splendor over the region."
 silvestrine.6.a: "There is no place for self-will in the Empire"
 silvestrine.6.b: "Your wish is granted"
 silvestrine.6.c: "They deserve some liberties"
 LIH_became_free: "Gained Liberties"
 silvestrine.7.t: "Pemenienzimmer"
 silvestrine.7.desc: "The fascination with the orient was always great in the Saelian circles, and often more distant lands were seen as more splendorous and fantastical. With the reconnection of Mysentria to the rest of the world, many now start to import goods across the Pisachaian Ocean, in order to decorate their palaces with exotic material such as porcelain, tapestry and calligraphy. Some members of our court have proposed to redecorate one of the royal palace's chamber in a more eastern style."
 silvestrine.7.a: "Let's set it up"
 silvestrine.7.b: "It's too expensive"
 TD_Pemenienzimmer_province_modifier: "Pemenienzimmer"
 desc_TD_Pemenienzimmer_province_modifier: "This beautifully chamber is decorated in a classical Pemenian style-  or at least how the Mysentrians imagine Hengtua looks like."
 silvestrine.8.t: "Albrecht 'Würfelwerfer' von Schlaufberg"
 silvestrine.8.desc: "The recent history of the Saelian Empire didnt' see many powerful emperors, and especially not that influential as Albrecht von Schlaufberg-Kriegerstein, also known in many places as Albrecht 'the Dice Thrower', or Albrecht 'the Brute' by his enemies, trying to undermine his unending patronage of arts.\n\nHe earned the title of würfelwerfer by often placing his own wellbeing and wealth on the scales, risking their loss in order to ensure the continuation of the imperial ideas across the continent. His tactical mind allowed him to quickly defeat the Lichterian uprising and His diplomatic eloquency helped to establish a lasting peace with the tetrarchy. His deeds also include establishment of permanent diet and strenghtening the royal authority in the rural areas, which were mostly governed by independent nobles.\n\nMany are certain that if not for him, the Empire's lifespan would have been shorter by not only decades, but by centuries."
 silvestrine.8.a: "Ego Sum Lex."
 KRI_knight_emperor: "Knight Emperor"
 desc_KRI_knight_emperor: "Our ruler is a battle-born servant of Sal, often risking [Root.Monarch.GetHerHis] own life for the cause of the empire."
 KRI_knight_emperor_die_desc: "[Root.Monarch.GetHerHisCap] deeds for the Saelian Empire will never be forgotten."
 silvestrine.9.t: "Silvestrine Jewels"
 silvestrine.9.desc: "Silvestria has been known for centuries for it's many centers of Glass production and Glassmaking tradition, and everything related to glass like Jewelry, Chandeliers et cetera. With now most of that industry unified under our glorious [Root.GovernmentName], we can form official Silvestrine Monopoly on glass."
 silvestrine.9.a: "Yay"
 silvestrine_jewels: "Silvestrine Jewels"
 silvestrine.10.t: "Striking Black Gold"
 silvestrine.10.desc: "With the spread of Industrialisation, coal started to be used everywhere, increasing demand, and many new veins of coal were found everywhere all across Mysentria. That is, until 1789, when Silvestrine countries found shallow coal deposits, and flooded the market with cheap coal which resulted in spread of Industrialisation so rapid it even spread beyond Mysentria."
 silvestrine.10.a: "That certainly won't backfire on us, right?"
 increased_coal_supply: "Coal Supply Overflow"
 silvestrine.11.t: "Conrad Sälen Ackermann"
 silvestrine.11.desc: "Conrad Sälen Ackermann was an Imperial Legate that lived between 1482 and 1555, and served most of his life as Legate, Envoy and diplomat for the Saelian Emperor. He is also famous for various political and societal Treaties that were so ahead of his time that some modern historians even call him the `Precursor of Enlightenment`."
 silvestrine.11.a: "We are lucky to have someone as competent as him"
 TD_Imperial_Legate_in_Court: "Conrad Sälen Ackermann"
 silvestrine.11.t: "Widespread adoption of Paper"
 silvestrine.11.desc: "With invention and adoption of Printing Press in Silvestria, and increased paper production in the XVIth century, we have become one of the first regions of Northern Mysentria to use paper in everyday life, including administration, military, economy, and culture."
 silvestrine.11.a: "Paper is the future!"
 TD_Widespread_use_of_paper: "Widespread use of Paper"
 silvestrine.12.t: "End of Magstadt-Limstadt Rivalry"
 silvestrine.12.desc: "Magstadt and Limstadt are respectively most important Toflanter and Ordenic Free Imperial Cities and metropolies, and two most important cities in the Magreinland. Ever since Foundation of the younger Magstadt, they have been in Rivalry between themselves to become the most important city in Magreinland, and even entire Silvestria. Today, in the Anno Imperii [GetYear], we have conquered both Magstadt and Limstadt, and officialy ended their rivarly."
 silvestrine.12.a: "End of an era"
 TD_Ended_Lim_Mas_Rivalry: "Intercity Rivalry Ended"
 silvestrine.13.t: "Ewald Safberg"
 silvestrine.13.desc: "Ewald Safberg was a Jester at the Imperial Court of Saelian Empire. Like most Jesters of his era, not only he served to make the court laugh, but also as an Advisor to the court, and has gone down in history as one of the most Silver-Tongued Advisors that Saelian Court even had."
 silvestrine.13.a: "Ugh... a Jester?"
 TD_SE_Jester: "Ewald Safberg"
 the_high_counts_reform: "The High Counts"
 the_high_counts_reform_desc: "Due to the complexity of Saelian law, some of the feudal subjects of our ruler from before obtaining the emperorship are separately classified as Hochgrafen. This title is often seen as more prestigious and privileged than that of the average noble, leading to them being a more loyalist class."

 waldrodung_reform: "Waldrodung"
 waldrodung_reform_desc: "By diverting some of our administrative cadre to more effectively manage the new territory, we will have an easier time directing the construction and further expansion."
 woods_forest_buff_mod: "Reduced Forest Penalties"
 desc_woods_forest_buff_mod: "This province benefits from increased effectiveness of further development."
 mechanic_reduced_woods_forest_penalties_yes: "Reduced development cost penalties in §YWoods§! and §YForest§! terrains."
 woods_forest_buff_tt: "Development Cost in §YForest§! and §YWoods§! terrains: §G-10.0%§!"

 landwaldanate_reform: "Landwaldanate"
 landwaldanate_reform_desc: "Many rulers in the Sigilian Empire are stewards of emperor's land, a system established after many Kuninstoftums were integrated into the empire. While de iure the power of Landwalder comes only from approval of the emperor, in reality it is local estates that pull all the strings."

 toflanter_monarchy_reform: "Magreiner Monarchy"
 toflanter_monarchy_reform_desc: "After Imperial Settler Edict of 1089 many nobles and commoners ventured north to colonize (or conquer) lands north of Magkirche."

 geoberic_monarchy: "Geoberic Monarchy"
 geoberic_monarchy_desc: "A government where a tight-knit royal elite secures the interest of the family in and outside of the realm."