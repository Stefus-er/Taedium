l_english:
 #this now obsolete.
 group_silvestrine_ideas: "Silvestrine Minor Ideas"
 group_silvestrine_ideas_start: "Silvestrine Minor Traditions"
 group_silvestrine_ideas_bonus: "Silvestrine Minor Ambition"
 SILVESTRINE_industrial_folk: "Industrial Folk"
 SILVESTRINE_industrial_folk_desc: "Our fame as a hardworking nation is not exaggerated. Dense forests are being changed into farms stretching to the horizon and mountains are being dug out in search of valuable metals."
 SILVESTRINE_servants_of_sal: "Servants of Sal"
 SILVESTRINE_servants_of_sal_desc: "Sal, commonly known as saelian God, is the absolute ruler of the world. We showed the world that we are his most faithful followers and even homeland of his cult is no match to us."
 SILVESTRINE_silvestrine_infantry: "Silvestrine Infantry"
 SILVESTRINE_silvestrine_infantry_desc: "Due to many mercenary bands across our lands, advanced infantry techniques have been develop to make the best use of armored men. Most common type is a silvestrine spearmen. They can hold of attacks of even the strongest cavalries in the world - many of them fought during the Battle of Matliman."
 SILVESTRINE_interconnected_empire: "Interconnected Empire"
 SILVESTRINE_interconnected_empire_desc: "Lands of Silvestria lie in the middle of not only the Saelian Empire, but also Mysentria as a whole. Subsequently, many people from different origins and nations travel across this land and we profiteer from this."
 SILVESTRINE_hierarchia_dei: "Hierarchia Dei"
 SILVESTRINE_hierarchia_dei_desc: "Hierarchia Dei, meaning 'God's hierarchy', is the term to describe the ideal order in the world, in which everyone has a strict place in the system. It is mostly used as a way to enforce feudal hierarchy and monarch's rule over peasantry."
 SILVESTRINE_many_states_of_silvestria: "Many States of Silvestria"
 SILVESTRINE_many_states_of_silvestria_desc: "Huge amounts of dukes, princes, counts, barons, bishops and mayors has caused silvestrine diplomatic innovations to emerge. Diplomats are meant to travel swiftly and return after resolving their mission."
 SILVESTRINE_effective_conscription: "Effective Conscription"
 SILVESTRINE_effective_conscription_desc: "Everything must function like a clock in a silvestrine country - and conscription isn't different. All of the paperwork relating to the conscription helps not only the army, but also bureaucracy related to managing population and censuses."


 ostemer_ideas: "Ostemer Minor Ideas"
 ostemer_ideas_bonus: "Ostemer Minor Ambition"
 ostemer_ideas_start: "Ostemer Minor Traditions"
 ostemer_cradle_of_imperial_renaissance: "Cradle of Imperial Renaissance"
 ostemer_cradle_of_imperial_renaissance_desc: "It was through these lands that the ideas of Renaissance spread to the empire thanks to our Camarian merchants."
 ostemer_salt_industry: "Salt Industry"
 ostemer_salt_industry_desc: "Salt is one of the most important goods in preserving the food during long voyages, and thankfully these lands profit greatly from it."
 ostemer_gate_to_the_empire: "Gate to the Empire"
 ostemer_gate_to_the_empire_desc: "Being the easternmost part of the empire has granted us the possibility of monopolising the trade with not only Mezonia, but even Kakigia and Pemenia."
 ostemer_sailor_schools: "Sailor Academies"
 ostemer_sailor_schools_desc: "Not anyone can become a sailor - it requires a great deal of knowledge and experience taught only in the Academies scattered across the Ostemer coast."
 ostemer_trade_connections: "Trade Connections"
 ostemer_trade_connections_desc: "Being the middleman between the Empire and the east we can maintain a good relations with many countries thanks to our 'generous' offers to them."
 ostemer_advanced_gunmaking_methods: "Advanced Gunmaking"
 ostemer_advanced_gunmaking_methods_desc: "Copper mines of Camaria and Felderia combined with the knowledge gathered by our merchants helped us develop innovative methods of gunsmithing."
 ostemer_spread_of_modern_ideas: "Spread of Ideas"
 ostemer_spread_of_modern_ideas_desc: "New ideas come and go every day in these ports and our citizens are accustomed to them constantly changing. If something is discovered in Pemenia, our merchants will know soon eough and spread this knowledge further."
 ostemer.1.t: "Arnold Veit Silberg"
 ostemer.1.desc: "A known trader, Arnold Veit Silberg, has approached our Court, with intentions to ask for funds for his expedition eastwart into Kakigia, how should we respond to his request?"
 ostemer.1.a: "Such brilliant Mind would only go to waste in the east, offer him position at our court!"
 ostemer.1.b: "Give him the necessary funds, I am curious of the east."
 send_arnold_east_tt: "Arnold Veit Silberg will go for an expedition that could last up to §Y10 Years§!"
 ostemer.2.t: "Silberg's Expedition"
 ostemer.2.desc: "Arnold Veit Silberg has returned from his expedition, and has brought various maps of the Eastern lands with him."
 ostemer.2.a: "Excellent! Now offer him a position in our court."
 discover_silberg_tt: "We will discover all land provinces in Zakarturii Steppe and Visparaya"
 ostemer.3.t: "Leonard Bachmann"
 ostemer.3.desc: "Leonard Bachmann was Ostemer-Revorian Natural Scientist, Engineer and Theorist, who was mostly known for his work in Cartography, Astronomy, Palaeontology. He has lived between 1457 and 1498, taken education and lived most of his life in the Ostemer City of Orienfort. He has also gone down in history for being a great Architect, Painter and Sculptor, and is considered one of the most famous Renaissance geniuses in all of Mysentria."
 ostemer.3.a: "We should Offer him a great offer!"
 ostemer.4.t: "Sigward Sisser"
 ostemer.4.desc: "Sigrid Sisser was originally a girl born into a family of Snaiwatzer Peasantry in the year of 1517, and when Mercenary Wars came in the year of 1527, to avoid fate that most of Peasantry suffered when refused draft, she has disguised herself as a man, and joined Elender Ranks, where she, under name `Sigward Sisser`, rose up quickly in ranks and learned the War craft. After the end of 1st Mercenary War in the 1550, she left the war-embroiled Snaiwatz into eastern Ostemer Republics, where she has served as a Mercenary General until her death in 1578. Only after her death her employers have discovered she was actually a Woman."
 ostemer.4.a: "Right Man in in the Right place makes all the difference."
 ostemer.5.t: "The Eberlander Rebellion"
 ostemer.5.desc: "One of our Privateers, Ernst Oelssner, has managed to convince a crews of our ships to actually rebel against our overlordship, and has managed to Seize the island of Eberland and establish a rogue pirate state on it."
 ostemer.5.a: "You have nothing to lose, but your chains!"
 ostemer.5.b: "They WILL hang for this."
 ostemer.6.t: "Wolfgang Werner"
 ostemer.6.desc: "Wolfgang Werner, or known under his pen name `Liedolf`, was a known writer, philosopher, and historian. He was Famous for his criticism of Saelianism, especially Liemarianism, Slavery and Feudalism. He was also an advocate of freedom of speech, religion, and separation of state and religion. His most controversial piece of work was `Brianolan Revolution` where he showed the other side of the infamous Brianolan part of Camarian history."
 ostemer.6.a: "Hire him at our court!"
 ostemer.7.t: "Hans Lazen"
 ostemer.7.desc: "Hans Lazen was a Silvestrine, specifically Ostemer, composer and musician during early enlightment. He was known for giving concerts all across Mysentria, mostly on organs and keyboard. His most known work was `Mass in C Minor` which he has shown during his concert in the St. Liemar Cathedral in the Capital of the Episcopate."
 ostemer.7.a: "What a Great Mind!"
 ostemer.8.t: "Hans Lazen is giving concert in [Root.Capital.GetName]"
 ostemer.8.desc: "Hans Lazen is a composer known all across Mysentria, and he has decided to give a concert in our glorious capital city of  [Root.Capital.GetName]!"
 ostemer.8.a: "Excellent!"
 ostemer.9.t: "Kirchbach Cathedral Finished"
 ostemer.9.desc: "Kirchbach Cathedral is a one of the four Tetrarchy Cathedrals, and is famous for being the one that has been build the longest. It's construction has begun in the late medieval ages, somewhere during XIVth century, and has taken so long that it was only finished in the year of 1598. Is one of the smaller and simpler Cathedrals due to Kirchbach Tetrarch's financial problems, with the only smaller being one in Sprechtwald."
 ostemer.9.a: "Finally, after all this time..."
 ostemer.10.t: "Scarfegg Porcelain"
 ostemer.10.desc: "When travelling has become much easier thanks to great discoveries of XVIth and XVIIth century, at the end of XVIIth, a man known as Lambert Lauban, one of the lesser merchants from the free imperial city of Scarfegg, has launched an expedition to Hengtua, and managed to bring home the secrets of producing Pemenisile, and started the production in his home city of Scarfegg."
 ostemer.10.a: "How he managed to pull this off?"
 ostemer.11.t: "The Limstadt Trade"
 ostemer.11.desc: "We have managed to secure the inland trade routes of Central Silvestria across all roads of Limstadt without spilling too much blood. This will increase our trade power in the region for the time being."
 ostemer.11.a: "Great News!"
 ostemer.12.t: "The Eastern Fur Trade"
 ostemer.12.desc: "Fur is rare and wanted commodity in lands of Mysentria, and we are one of it's main importers. We have managed to secure a great chunk of Fur production, and now we have enough share of the supply to demand higher prices!"
 ostemer.12.a: "With that the possibilities of our expansion are vast!"
 ostemer.13.t: "The Salt Production Expansion"
 ostemer.13.desc: "We have managed to secure various desalinization spots all across ostsee, and even beyond. Now we can prepare to expand our salt production, and increase supply so we can dictate the prices of that necessary conservant."
 ostemer.13.a: "Didn't we salt this meat too much?"
 ostemer_fur_imports: "Ostemer Fur Monopoly"
 ostemer_salt_expansion: "Ostemer Salt Production Expanded"
 ostemer_salt_the_coast_tt: "Five Random Coastal Provinces which have 12 development and produce either Fish, Grain, Livestock or Naval Supplies will change into salt."
 ostemer.14.t: "Fires of the Snaiwatzer Wars"
 ostemer.14.desc: "The Snaiwatzer Wars are greatly impacting our economy and stability, and some provinces are starting to feel the effects of it."
 ostemer.14.a: "We must finish this War as fast as possible."
 ostemer.15.desc: "The Snaiwatzer Wars are greatly impacting our western Neighbours, and many Snaiwatzer people are migrating eastward, into our land, taking their wealth with them."
 ostemer.15.a: "We shall welcome this Refugees with open arms!"
 ostemer.16.t: "Race for the Revorian Bay"
 ostemer.16.desc: "Many of our merchants squabble between themselves or go cry on the emperor's lap, but we know what we must do! Overthrow the Revorian domination of the Ostsee Trade and claim it for ourselves!"
 ostemer.16.a: "Great competition awaits!"
 ostemer_revorian_bay_info_tt: "§YThe First Ostemer country to achieve 50% Share in Revorian Bay and secure it's position as strongest in Doniepr and Mezonian Straits Trade Nodes will be rewarded handsomely.§!"
 OSTEMER_DOMINATION: "Ostemerian Merchants from this country have dominated all viable trade in this trade node."
 ostemer.17.t: "Ostmeer Domination"
 ostemer.17.desc: "We have Succesfully dominated trade all across Revoria, Doniepr and Mezonian Straits, and we rule the Revonian Bay, wait, no, from now on, this piece of sea is ours to rule, and ours to name!"
 ostemer.17.a: "From now on we rule the §MOstmeer§!!"
 ostemer.18.t: "New World Discovered?"
 ostemer.18.desc: "The Aqerb, Carbian, Argenian, Ansgar and even Bohemian Explorers claim to have found new world in the west, and alongside it a new route to the Hengtua. This is bad news for us!"
 ostemer.18.a: "Calamity awaits us!"
 ostemer_eastward_collapse_info_tt: "§YThe Westward Trade route has opened.\nIf Ostemer wish to stay relevant in the world of trade, it must either:\n - Trade enough Pemenisile, Tea or Silk to get a bonus\n - Have atleast 15% Share in any Hengtuan Trade Node\n - Create a Subject Colonial Nation and Circumnavigate the Globe.§!\n\n§RFailure to meet either of the requirements until year 1600 will have dire consequences for all of Ostemer!§!"
 ostemer.19.t: "Eastward Trade Routes Secured"
 ostemer.19.desc: "We have managed to secure our relevane with the trade between Mysentria and Hengtua, and even beat competition to it!"
 ostemer.19.a: "Great Success!"
 ostemer.20.t: "Eastward Trade Collapse"
 ostemer.20.desc: "We have fought between ourselves for too long, and before we noticed it, the western competition beat us, our relevance in east-west trade shattered. Ostemer, Revorian, Wedlan... nobody matters anymore in the world of trade."
 ostemer.20.a: "This is truly the Ostemer Century of Humiliation"
 ostemer_eastward_collapse: "We failed to secure new steady trade routes that could stay competitive with the western one, and our trade has collapsed"
 dorshau_naval_academy_title: "Found the Naval Academy of Dorshau"
 dorshau_naval_academy_desc: "The Naval Academy of Dorshau is a famous Eastern Silvestrine school of navigation, naval battle and ship design, founded in XVIIth century, and has become famous in the same century due to it's unique, effective, but pricey `Dorshauer` Flagship Design."
 dorshau_naval_academy_mod: "The Naval Academy of Dorshau"
 dorshau_academy_grant_admiralship_title: "Recruit Admiral from Dorshau Naval Academy"
 dorshau_academy_grant_admiralship_desc: "We should recruit an Admiral from Dorshau."
 ostemer_trade_fleet: "Ostemer Trade Fleet"
 ostemer_trade_fleet_desc: "Ostemerian Merchants have been known for being the most successful and entrepreur merchants on both Ostsee and Middelandse Sea, which resulted in centuries-long naval traditions of the Ostemer as a whole."


 felder_ideas: "Felder Minor Ideas"
 felder_ideas_bonus: "Felder Minor Ambition"
 felder_ideas_start: "Felder Minor Traditions"
 felder_tax_reforms: "Tax Reforms"
 felder_tax_reforms_desc: "Tax reforms of the Emperor Albrecht von Shlaufberg had the greatest effect on these lands due to most of local farms being controlled by powerful individuals."
 felder_renaissance: "Felder Reinassance"
 felder_renaissance_desc: "Peaceful and nearly venatic farmlands of Felderia attract many great poets, advisors and artists who serve in the increasingly prestigious courts of local princes."
 felder_zbojaner_roots: "Zbojaner Roots"
 felder_zbojaner_roots_desc: "These territories were originally settled by Zbojaner people and many of our own still have bogilish ancestors. Their folklore and religion is still seen in architecture and art and sometimes even claiming Zbojaner ancestry is seen as prestigious."
 felder_forest_infantry: "Forest Infantry"
 felder_forest_infantry_desc: "Many peasants have experience in traversing and living in the forest, so they will make a great warriors in our army - every leader wishes for a soldier that can feed himself."
 felder_standing_army: "A Standing Army"
 felder_standing_army_desc: "While expensive in these times, the high prosperity of these lands have allowed us to adopt standing armies earlier than in other parts of the Empire."
 felder_royal_munition_manufactories: "Royal Munition Manufactories"
 felder_royal_munition_manufactories_desc: "Closeness to the imperial capital and regional copper deposits swayed the emperor into investing in local artillery and gun production."
 felder_absolutism: "Felder Absolutism"
 felder_absolutism_desc: "Richness of these lands have made the local elites greedy for power which lead to the strengthening of the prince and diminising the nobility."


 saelish_ideas: "Salish Minor Ideas"
 saelish_ideas_bonus: "Salish Minor Ambition"
 saelish_ideas_start: "Salish Minor Traditions"
 saelish_knights: "Salish Knights"
 saelish_knights_desc: "'Chivalry is not dead', at least that's what the pompous yet brave knights of Salia say and their effectiveness proves them right most of the time."
 saelish_reformed_lawmaking: "Reformed Lawmaking"
 saelish_reformed_lawmaking_desc: "Slow urbanization has allowed us to adapt the law systems from neighboring princes instead of experimenting on our own."
 saelish_the_land_of_castles: "The Land of Castles"
 saelish_the_land_of_castles_desc: "Many lords wish to live in a castle - rural and hilly terrains of these lands hold the perfect conditions for their desires."
 saelish_imperial_culture: "Imperial Culture"
 saelish_imperial_culture_desc: "People of Salia are often seen as the prime examples of the ideal Sigilians and servants of the emperor."
 saelish_winemaking: "Salish Winemaking"
 saelish_winemaking_desc: "Wine and cider are the drinks of choice of not only the local nobility, but also among the cityfolk, who own many vineyards across the land."
 saelish_centralisation_of_saelish_region: "Centralization of Salia"
 saelish_centralisation_of_saelish_region_desc: "Growing threat of the Geoberic unification made the local princes realise, that they need to act quickly and increase their strength to push them back - even at the cost of their fellow noblemen."
 saelish_military_engineeering_schools: "Modern Military Engineering"
 saelish_military_engineeering_schools_desc: "Mercenary wars taught the empire that the superior firepower was more important than good cavalry. Ever since then, many tried to tame the power of the gunpowder in these lands."


 upper_magreiner_ideas: "Ordenic Minor Ideas"
 upper_magreiner_ideas_bonus: "Ordenic Minor Ambition"
 upper_magreiner_ideas_start: "Ordenic Minor Traditions"
 upper_magreiner_heart_of_the_empire: "Heart of the Empire"
 upper_magreiner_heart_of_the_empire_desc: "Upper Magreina is where the Via Caroli and Via Magreini cross in the great city of Hegenstadt."
 upper_magreiner_law_reforms: "Law Reforms"
 upper_magreiner_law_reforms_desc: "Closeness to the true imperial domain made this region in much more direct control than the other parts of the empire, keeping the law and order intact. "
 magreiner_trade: "Magreiner Trade"
 magreiner_trade_desc: "Great river of Magreina starts in the high Cacumuds, flows through Adrianburg, Limstadt, Hegenstadt, Magkirche, Magstadt and Kaphenden to finally reach its end in the Bay of Niftland up north, carrying many important goods and ideas."
 upper_magreiner_legacy_of_imperial_civil_war: "Legacy of the Lippstadt League"
 upper_magreiner_legacy_of_imperial_civil_war_desc: "Brutal but quick war of the Lippstadt League brought not only changes to the imperial power structure, but showed the first signs of the new age weaponry - Alwin von Verun became famous for using wagon warfare which was easily defendable in open terrain typical to the magreiner farmlands."
 magreiner_imperial_ties: "Imperial Ties"
 magreiner_imperial_ties_desc: "many local rulers can quickly travel to the imperial capital and this closeness many times benefited not only princes but also the imperial court."
 upper_magreiner_cradle_of_imperial_baroque: "Cradle of Imperial Baroque"
 upper_magreiner_cradle_of_imperial_baroque_desc: "Baroque, more known in the empire as so-called 'Wahrekunst', was a way for the emperor and tetrarchy to fight against the reformation and show the true power of the empire."
 development_of_the_upper_magreiner: "Development of the Ordenic"
 development_of_the_upper_magreiner_desc: "Fertile farmlands of the Magreina bring us prosperity, but they thanks to the investments of many emperor they are increasingly making us and the empire much more self-sustainable."
 middle_magreiner_ideas: "Toflanter Minor Ideas"
 middle_magreiner_ideas_bonus: "Toflanter Minor Ambition"
 middle_magreiner_ideas_start: "Toflanter Minor Traditions"
 middle_magreiner_granary_of_the_empire: "Granary of the Empire"
 middle_magreiner_granary_of_the_empire_desc: "Flatlands of northern Silvestria are so fertile that they not only feed the local population, but the wheat and rye are exported to outer reaches of the empire and even outside of it."
 middle_magreiner_homeland_protection: "Homeland Protection"
 middle_magreiner_homeland_protection_desc: "People of these lands wish for their prosperity to remain unscathered without a fight, but even they know they will have to protect it - even if they have to risk their own lifes."
 middle_magreiner_saelian_tetrarichy_connections: "Connections with the Tetrarchy"
 middle_magreiner_saelian_tetrarichy_connections_desc: "Nordkirche is often seen as the most prestigious and powerful of the four electors due to the most recent land grants and overall influence they have over the northern parts of Mysentria, which greatly influences the prestige of the region by proxy."
 middle_magreiner_expanded_royal_court: "Expanded Royal Court"
 middle_magreiner_expanded_royal_court_desc: "Influx of gold and silver from selling grain encourages the low and medium nobility to increase the size of their personal courts to show other rulers who is the richest and most powerful."
 middle_magreiner_refined_artillery_craft: "Refiner Artillery Craft"
 middle_magreiner_refined_artillery_craft_desc: "Late XVII century Kriegersteiner interest in artillery and gunpowder also had a large influence on local lords, who often wish to imitate the emperor to gain even just a factor of his splendor."
 silvestrine_magreina_riverbed_group: "Silvestrine Magreiner Plains"
 magreiner.1.t: "Expansion of Hegenstadt's administration"
 magreiner.1.desc: "Hegenstadt is one of the oldest, biggest and most Pretigious cities in [Root.GetName], but it's status makes it hard to administrate. It is time we should put an end to this by expanding the local administration."
 magreiner.1.a: "Great Work!"
 magreiner.2.t: "Military Ideas of Magstadt Academy"
 magreiner.2.desc: "The Military Experts and Professors of Imperial Magstadt Academy have made an advancement in military theory."
 magreiner.2.a: "We should reap the benefits"
 TD_Military_Ideas_of_Magstadt: "Military Ideas of Magstadt"
 magreiner.3.t: "Economic Ideas of Limstadt Academy"
 magreiner.3.desc: "The Economy Professors and Economists of Imperial Limstadt Academy have made a proposal to our [Root.GovernmentName] on how we could improve our income."
 magreiner.3.a: "We should reap the benefits"
 TD_Economic_Ideas_of_Limstadt: "Economic Ideas of Limstadt"
 magreiner.4.t: "Magreina Floods!"
 magreiner.4.desc: "Magreina is not only the Biggest River of Silvestria, but of the entire Mysentria, and not only every attempt to tame it has failed, but the floods are devastating for every important city along its course."
 magreiner.4.a: "What a Calamity!"
 magreiner.4.tt0: "§RAs long as Magrein Dykes Great Project stays on Tier 0, the Floods will devastate the Lower Magreiner Plains.§!"
 magreiner.4.tt1: "Every Silvestrine Magreiner Plains province will gain 15 devastation. If the province produces grain, it will also gain +0.5 goods produced for 2 years."
 magreiner.4.tt2: "Emperor of the Saelian Empire will lose 1 imperial authority for every important city or princely capital that gets devastated by the flood.§!"
 fund_magrein_dykes_title: "Construct Magrein Dykes"
 fund_magrein_dykes_desc: "[643.GetName] is the perfect place to build Great Magreina Dykes to prevent future floods, but we aren't direct owners of the province, but we can extert our Imperial Influence and funds to help the local ruler build them."
 magrein_dykes_built_tt: "Prevents Magreiner floods from appearing"
 magreiner.5.t: "Ludwig von Ertzberg" #Literally Ore Mountain btw
 magreiner.5.desc: "Ludwig von Ertzberg was one of the most known Baroque painters in whole of Mysentria. Born in 1565 in Free City of Limstadt, has been living, taken education at Arts Department of Limstadt Academy, and created art his whole life in his home city. He died in 1643 and is mostly known for his portrait of Emperor Albrecht 'Würfelwerfer' von Schlaufberg."
 magreiner.5.a: "Offer him position at our court."
 magreiner.6.t: "Ulrich von Weinenfeld"
 magreiner.6.desc: "Ulrich von Weinenfeld was Magreiner-born general that served in the Imperial Army, and has gone in history as the man that revolutionized Warfare by his widespread adoption of Gunpowder in warfare, making old tactics obsolete."
 magreiner.6.a: "He should lead our armies!"
 magreiner.7.t: "Bernhard von Bauhem"
 magreiner.7.desc: "Bernhard von Bauhem was a liemarian zieglerheimer noble who was a distant cousin of the ruling von Schlaufbergs family. He never was even close to taking the [ZIG.GetName]'s throne, but he has gone down in the history of [ZIG.GetName] as a man who preached about religious tolerance, and is considered one of the precursors of the modern idea of freedom of conscience."
 magreiner.7.a: "We should actually let him rule the country!"
 magreiner.7.b: "I'll pass"
 TD_von_Ritterbergs_Main_Bank: "Ritterberg Bank"
 magreiner.8.t: "von Ritterbergs"
 magreiner.8.desc: "von Ritterbergs is an old and well-known Magreiner Burgher Family, who instead of trading wheat and rye like most Magreiner Merchants, is known for it's lending and banking interests. They are active and well to this day, with their main bank in the city of Himmelnberg."
 magreiner.8.a: "An excellent initiative!"
 magreiner_black_revolution_title: "The Schwarzpulver Revolution"
 magreiner_black_revolution_desc: "Magstadt Academy has made a new breakthrough with the help of our Generals, now we can adopt Black Gunpowder all across our army!"
 magreiner_blackpowder_army_reform: "Schwarzpulver Army"
 magreiner_blackpowder_army_reform_desc: "Schwarzpulver Army was a Term for the Imperial and Magreiner armies after widespread adoption of Magstadt-Developed Variant of Black Gunpowder that was easier and cheaper in production."
 unlock_magreiner_blackpowder_army_reform_tt: "Unlock the '§YBlackpowder Army§!` government reform."
 magreinland_ideas: "Magreiner Ideas"
 magreinland_ideas_start: "Magreiner Traditions"
 magreinland_ideas_bonus: "Magreiner Ambition"
 magreinerland_imperial_heartlands: "The Heartlands of the Empire"
 magreinerland_imperial_heartlands_desc: "The Magnificent Magreina, and all land that surrounds it, lies in the very center of Silvestria and, subsequently, the Saelian Empire. The plains of Magreinland hold Mysentria's most fertile soil; the biggest river of Mysentria not only makes trade easier, but it also attracts many workers from all of Silvestria and even abroad."
 magreinerland_close_imperial_circle: "Magreiner Imperial Circle"
 magreinerland_close_imperial_circle_desc: "Until recently, the crème de la crème of imperial influence lived in Salia or Ostemeria, however with the two most recent elections, native to Magreinland von Schlaufbergs managed to take the imperial crown. This, alongside growing wealth of local nobles, brought much interest and prestige to these lands. "
 magreinerland_the_magreiner_academies: "The Magreiner Academies"
 magreinerland_the_magreiner_academies_desc: "Two of the oldest and most important Universities of Saelian Empire operate in Magreinland. The self-perpetuated rivalry between Imperial Magstadt Academy and the Imperial Limstadt Academy fuels the gears of progress."
 magreinerland_luchterschloss: "Luchterschloss"
 magreinerland_luchterschloss_desc: "Magreina is the cradle of the Imperial Baroque, or `Wahrekunst` as it is called by Silvestrine, and in the city of Luchter lies the biggest pinnacle of the Imperial Wahrekunst - the Magreiner Luchterschloss palace. Together with the Wolfgangian bridge and the New Square, they form an urban axis which crosses the Magreina and the entire city, leading to the countryside."
 magreinerland_the_blackpowder_revolution: "The Schwarzpulver Revolution"
 magreinerland_the_blackpowder_revolution_desc: "The Schwarzpulver Revolution was a wave of military reforms and advancements that swept through Magreinland in the late 17th Century. This was mostly possible thanks to invention of `Schwarzpulver`, an easier to make and less dangerous variant of gunpowder, which was known for it's black colour."
 magreinerland_precursors_of_silvestrine_lawmaking: "Toflanter Political Thought"
 magreinerland_precursors_of_silvestrine_lawmaking_desc: "Close proximity of imperial and electoral courts and relative peace in the region compared to other areas of Saelian Empire, has allowed our philosophers to spend a lot of time on improving our law and instituting new reforms, for which modern historians call Magreiner courts the precursors of modern Law, rights of man, and enlightenment."
 magreinerland_federalisation_of_magreina: "Federalisation of Magreina"
 magreinerland_federalisation_of_magreina_desc: "With expansion of Magreinland and acquisition of newly-conquered people and our novel way of administrating land, we adopted a more federal approach to government, establishing equal states under the rule of one King and one Parliament."
 
 
 nahtrucer_ideas: "Nähtrucer Minor Ideas"
 nahtrucer_ideas_bonus: "Nähtrucer Minor Ambition"
 nahtrucer_ideas_start: "Nähtrucer Minor Traditions"
 nahtrucer_northern_frontier: "Northern Frontier"
 nahtrucer_northern_frontier_desc: "Harsh life in the swampy Gyrdian forests made our men incredibly trusting in the leadership, because not once they proved to them that the cause they are fighting for is right."
 nahtrucer_gyrdian_influence: "Gyrdian Influence"
 nahtrucer_gyrdian_influence_desc: "Gyrdian stories and culture is slowly making its way in our culture. Many peasants and burghers start to worship Saelius himself and techniques used to effectively exploit the land are more prevalent than ever."
 nahtrucer_mercenary_competition: "Mercenary Competition"
 nahtrucer_mercenary_competition_desc: "Being one of two biggest accumulations of mercenaries in the empire makes the local mercenaries superior thanks to the sheer competition alone. Many of them compete to get hired and our rulers quickly learned to exploit these efforts."
 nahtrucer_expanded_diplomacy: "Expanded Diplomacy"
 nahtrucer_expanded_diplomacy_desc: "Elective Monarchies of the north not only grant us more meritocratic rule and stability of the realm, but also the ability to maintain better relations with greater amount of countries."
 nahtrucer_improved_fortifications: "Improved Fortifications"
 nahtrucer_improved_fortifications_desc: "Despite the swampy and forested terrains of Gyrdia, our engineers quickly adapted and managed to turn these obstacles into an advantage, allowing for better defenses even without major hills and mountains."
 nahtrucer_reformed_infantry: "Reformed Infantry"
 nahtrucer_reformed_infantry_desc: "New military technology brought a need for a new army capable of using this innovative equipement. The time of levies is over - only those with standing, professional armies will thrive."
 nahtrucer_administrative_reforms: "Administrative Reforms"
 nahtrucer_administrative_reforms_desc: "Consolidation of the northern border of the empire demanded from us to establish a proper administration, very different to the old feudal model. We can't no longer allow self-will of local lords and we will rule by law, not by the sword."
