l_english:
 southpemenia.1.t: "Ang Kum Rath"
 southpemenia.1.desc: "Ang Kum Rath was a 16th Century Xifang Scholar born in Dolvam, who has gone down in history for his open-mindness and philosophical treaties about differences and similiarities of the Xifang, Cach Moi and Bjateel Faiths."
 southpemenia.1.a: "Offer him position at our court"
 
 southpemenia.2.t: "End of Chueyat Isolationism"
 southpemenia.2.desc: "Our glorious [Root.GovernmentName] of [Root.GetName] has been self-sufficient and isolated from the rest of the world for a long time, but suddenly, the state of [southpemenia2ET.GetName] has standed rapidly encroaching on our way of life and our safety."
 southpemenia.2.a: "It is nothing to worry about."
 southpemenia.2.b: "It is time for change."